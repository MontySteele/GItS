# Marker registration ONLY. Deliberately no `addopts`, no `testpaths`, no
# `filterwarnings`, no plugin defaults: a bare `python -m pytest ...` must
# behave exactly as it did before this file existed, and CI's line
# (`python -m pytest tier0/tests tier05/tests -q`) must keep running the whole
# gate wall. The file exists so that `-m "not battery"` is a supported
# selection rather than an unregistered-marker warning.
#
# `pytest.ini` rather than `[tool.pytest.ini_options]`: the repo has no
# pyproject.toml and no setup.cfg -- it is not a packaged distribution, it is
# a tree of scripts -- so adding a build-system file to carry four lines of
# test config would be the larger change.
#
# PROPOSED, not ratified: the marker set and the fast-lane workflow are in
# docs/current/OPERATIONS.md awaiting [USER]'s call. Registering the names
# costs nothing eitherway; it is the WORKFLOW that is the proposal.
[pytest]
markers =
    battery: spends its time in a Monte-Carlo battery or run-level sim rather than in the assertion. Excluded by the fast lane (`-m "not battery"`), which is an inner-loop convenience and NEVER a substitute for the full suite before a push -- these carry the calibration bands, and a band that is not run is not a band.
