   effects: [{op: apply_power, power: bomb_damage_per_rotation, amount: 1, target: self}]}
   # EB-118 sec.4.4 (2026-08-24): the flat install becomes a CONNECTIVE one.
   # It was "your Bombs deal +2 damage", a number you read once and never
   # thought about again. It is now "the first time each turn you discard or
   # Exhaust a card, your Bombs deal +1 damage this combat" -- the same
   # ceiling reachable in two turns, but only if the deck is doing something
   # the card cares about. Id, rarity, role and archetypes are UNCHANGED,
   # which is what keeps this a Phase-1 edit.
   # THE ONCE-PER-TURN LATCH IS THE BOUND, and it is the guard LAW's Klee
   # A1/A2 rail asks for: connective scaling may not displace her frontload,
   # so the card cannot be turned into an engine by a discard-heavy turn.
   # The trigger does not care WHICH card left -- ordinary discards, ordinary
   # Exhausts and Klee's own status-exhaust route all count.
   # It increments the SAME `bomb_damage_up` the detonation reads, so a Bomb
   # armed three turns ago detonates at today's number. A second bomb-damage
   # stat would have made already-placed Bombs disagree with future ones.
   # The upgrade raises the PER-TRIGGER increment and adds no second trigger.
