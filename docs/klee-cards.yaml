# EB-118 PHASE 2 (packet §4.3): the second of the three direct faces to gain a readable
# price. BODY RULED BY [USER] 2026-08-24, option A of a reviewed slate, REPLACING the
# 2026-08-23 direction this row shipped with. What was wrong with that one, in
# [USER]'s terms: 16@2 plus Ethereal is a pure TAX, and an upgrade that only removes the
# tax merely refunds it -- neither face has anything to decide, and "2 energy for 20 just
# sounds boring". So the price stays and the card is given something to be ABOUT: a
# rider that pays off exactly when the printed number does its job.
# THE RIDER IS EXISTING GRAMMAR, NOT NEW MACHINERY. `{op: conditional, if: killed_target,
# then: [...]}` ships on sparkly_explosion (this sheet) and showstopper (Furina's), in
# both engines; the branch is an ordinary `damage` op, which is why no loader, engine or
# codegen vocabulary moves for it. Packet §4.3's "existing grammar only" holds.
# "A RANDOM OTHER ENEMY" IS THE CORPSE BEING DEAD, NOT A NEW TARGET SPEC. The branch
# resolves AFTER the 16 has landed and only when it killed, so the target is already out
# of the living-enemy population both engines draw `random_enemy` from -- tier0
# `_pick_targets` filters `state.living_enemies`, and the C# emits
# `.TargetingRandomOpponents(CombatState!)`, whose population is the same live accessor
# (`HittableEnemies`) the sim iterates. That is FIRST-PARTY VERIFIED, not inferred: the
# game's own shipped API docs say `HittableEnemies` is what "AOE and random attack
# targeting" draws from, and that a creature "is not hittable if it's dead". The printed
# "other" is therefore ENFORCED, not merely intended, and no `random_other_enemy` spec
# was invented to say it.
# NO OTHER ENEMY ALIVE: killing the last enemy leaves the splash nobody to reach. In
# tier0 that is PROVEN and pinned -- `_pick_targets` returns an empty list and the damage
# op resolves into nothing, no error and no self-hit. In the mod it is FIRST-PARTY
# GUARDED, and that is DECOMPILE-VERIFIED against the shipped `sts2.dll` v0.107.1
# (ilspycmd 8.2) rather than assumed: `AttackCommand.Execute` rebuilds `validTargets`
# from the living creatures on every hit and then runs `if (validTargets.Count == 0 &&
# combatState.IsLiveCombat()) break;` BEFORE it ever reaches the `Rng.NextItem` call --
# and `CombatState.IsLiveCombat()` returns literally `true`, so nothing about that break
# is conditional. The empty pool ends the hit loop; it does not throw, does not self-hit
# and does not re-hit the corpse. ONE REFINEMENT, recorded so nobody rediscovers it: a
# throw path on empty targets DOES exist, but only inside the duplicate-exclusion
# recheck under `allowDuplicates: false` -- and no generator-emitted card passes that
# argument, all thirteen callers taking the `true` default. This row adds NO new
# exposure -- it is the thirteenth caller of a path the first twelve already depend on,
# and every one of those twelve (da_da_da / rapid_fire / jumpy_dumpty, a BASIC card,
# among them) reaches the empty pool the moment an early hit kills the last body. The
# asymmetry that made the path LOOK undocumented is real and benign: the bomb and aura
# emitters guard their empty case because THEY call `Rng.NextItem` themselves, which
# throws on an empty sequence, while the damage emitter delegates to the game's own
# builder -- which guards for them.
# Ethereal is the printed downside and the upgrade BUYS IT OFF (`remove: ethereal`,
# klee-upgrades.yaml), which is why the old `{damage: +4}` delta is gone rather than kept
# beside it: one upgrade axis per card (upgrade-conventions.md row 6). The numbers do NOT
# move on upgrade -- 16/8 on both faces.
# FIRST DRAFTABLE CARRIER OF THE KEYWORD. The `ethereal:` field, the remove-Ethereal
# upgrade grammar and the C# CardKeyword.Ethereal reuse all landed INERT with the
# Route-1 infrastructure set; this row is what arms them. Two consequences ride with
# it and neither is optional: `STATIC_ETHEREAL_SHARE` stops being provably inert, so
# the drafter's PROPOSED bump comes due at integration; and R193's repricing trigger
# arms -- 0.6 is PROVISIONAL until this card has been read (trigger note at the
# constant in tier05/draft.py).
# TEMPO_BAND MOVED, AND NO HAND PUT IT THERE: fight [mid] -> [mid, late], written by
# `suggest_role_tempo_tags.py --land` and re-verified by `--check`. The rule that moved
# it is `role_tempo.fight_bands`, which bands a card `late` when any effect sits behind
# a gate (`gated_effect`, set by the walk the moment an op is nested in a conditional).
# A rider that pays only on a kill IS such a gate, so the classifier is right: the card
# is worth more in the fight-phase where things are close enough to death to die. It is
# now the band sparkly_explosion already carries for the same predicate. `solve` did NOT
# move -- a conditional splash is more of the same frontload, not a different problem --
# and the classifier agrees, so the review TSV lists 0 rows diverging from the authored
# solve.
# NOT MOVED at the Ethereal landing: id, rarity, role, solve. Ethereal is a LIFECYCLE
# keyword -- it decides whether the printed effect resolves at all, not what problem the
# card solves. A 2-cost 16 that dies in an unaffordable hand still solves frontload.
# `demolition` DROPPED, RULED [USER] 2026-08-24, the EB-118 Phase-3 W1 audit item R202
# call (9) opened. The ruled ground is that the tag means Bomb-plan PARTICIPATION
# everywhere else in this arm, and this body has none of its five verbs -- no
# place_bomb, detonate, modify_bombs, move_bombs, and no read of the bomb board. It is
# not a relabel to improve a count: the card is `role: glue`, so it was never in
# klee/demolition's payoff supply and no arm's supply number moves with it. R199's
# first guardrail is checked and not invoked. The ruled consequence is priced at
# secret_stash's row, where it lands.
