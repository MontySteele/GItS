# Furina + Fontaine upgrade deltas — v0.1 (companion file to furina-cards.yaml / fontaine-companions.yaml)
# Grammar authority: upgrade-conventions.md (mined base-game grammar). Same semantics as klee-upgrades.yaml.
# Bursts excluded (kit, v1.9; Talent Training = v2). Guest Stars excluded (generated mid-combat — rest-smithing
# cannot reach them; their upgrade story is the GENERATOR's upgrade, kickoff §9 grammar).
# encore-key semantics: bumps ALL gain_encore ops, branches included (the eager_to_help "both branches" precedent).
# SHEET PASS 1: all deltas PROPOSED pending user red-pen.
# Long comment blocks live in docs/notes/furina-upgrades-provenance.md, keyed by row id.
# Keep this header short and keep row notes to three lines (tools/lint_sheet_comment_blocks.py).

