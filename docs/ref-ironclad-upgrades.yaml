# REF_IRONCLAD upgrade deltas -- the anchor's missing power axis.
#
# Every designed character has 100% upgrade coverage (klee/furina 71/71 pool +
# 10/10 starter, kokomi 31/31). ref_ironclad has 0/6 and 0/10, so rest-site
# smithing, Sand Castle, Yummy Cookie, War Paint and Whetstone are ALL dead
# branches on the character the whole world is calibrated against -- measured:
# 0 upgraded cards in 300 runs, 0 smiths out of 683 rests.
#
# These are the REAL base-game numbers for the cards these rows model, not a
# tuning choice: Strike+ 6->9, Defend+ 5->8, Bash+ 8->10 with 3 Vulnerable,
# Inflame+ 2->3 Str, Heavy Blade+ (big base, +4 per the mined grammar row 1),
# Pommel Strike+ draw 1->2, Shrug It Off+ 8->11, Cleave+ 8->11,
# Metallicize+ 3->4. Grammar authority: docs/upgrade-conventions.md.
#
# The tier 0 battery never upgrades (run_battery builds from plain deck ids),
# so the frozen scorecard and the anchor lock are untouched by this file.

# ---- BASICS (Strike/Defend exact; Bash gets the signature dual bump) ----
strike:              {damage: +3}          # 6 -> 9, Strike+ exact
defend:              {block: +3}           # 5 -> 8, Defend+ exact
bash:                {damage: +2, vulnerable: +1}   # 8 -> 10, Vuln 2 -> 3.
#                                            The dual bump is the conventions'
#                                            stated "third basic" privilege
#                                            (upgrade-conventions.md row 5/6),
#                                            and it is Bash+ exactly.

# ---- COMMONS (exactly one bump each; zero cost reductions -- sheet law) ----
heavy_blade_like:    {damage: +4}          # 14 -> 18 (grammar: base 12+, +4-5)
pommel_strike_like:  {draw: +1}            # draw 1 -> 2, the real card's
#                                            signature change; damage stays 9
shrug_it_off_like:   {block: +3}           # 8 -> 11, Shrug It Off+ exact
cleave_like:         {damage: +3}          # 8 -> 11 all, Cleave+ exact

# ---- UNCOMMONS ----
inflame_like:        {power_amount: +1}           # 2 -> 3 Str, Inflame+ exact
metallicize_like:    {power_amount: +1}           # 3 -> 4, Metallicize+ exact
