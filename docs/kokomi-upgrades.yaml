#   deliberately retained, because removal would have opened a net-positive energy loop. That reasoning is
#   inherited by the merged card, whose Exhaust is now load-bearing for R79 as well as for the loop.
shell_of_sanctuary: {block: +4}          # 11->15, spirited_away-parity
exposing_current:  {vulnerable: +1}      # 2->3 (surprise_visit-parity; the R51 rider sharpens, the Exhaust stays)
all_streams_flow:  {damage: +3}          # 5->8 base; the 1-per-2-Charge read never moves (resource-curve law)
tidal_lure:        {block: +2}           # played 4->6; Sly Vulnerable stays 1 (header gap note)
watch_of_the_shallows: {power_amount: +2} # ward 3->5 (vigil_of_the_deep-parity slope). max_stacks does NOT ride
