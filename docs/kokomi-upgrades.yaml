votive_offering:   {block: +3}           # 5->8
ritual_purification: {draw: +1}          # 1->2; the Charge line NEVER moves (resource-curve law)
waterspout:        {damage: +3}          # 10->13, still burns itself (the base moved to 10 at v0.3)
cleansing_tide:    {block: +4}           # 10->14, still eats two cards
undertow_shuffle:  {draw: +1}            # 3->4; discard stays 2 (the two Sly bells are the identity)
moon_signal:       {draw: +1}            # discard 1, see 2
drifting_lantern:  {block: +2}           # played 4->6; the Sly branch stays 4 (header gap note)
surging_shoal:     {damage: +2}          # R77: 6->8 all (was 7->9; lint-ok: 7->9 superseded pair). The delta
                                         # is unchanged; the base moved.
                                         # The old comment here read "4->6" (lint-ok: 4->6 quoted stale
                                         # annotation), which had been stale since the
                                         # v0.3 repricing to 7 -- two bases out of date, in the file whose
                                         # whole job is to say what a card becomes.
jade_bulwark:      {block: +2}           # 6->8, warm_glow-exact
pulsing_current:   {damage: +3}          # 7->10 (snap's +3 slope on a base one higher since the v0.3
                                         # charge-curve pass); the +1 Charge line never moves

# ---- UNCOMMONS (bump OR keyword; two cost slots — Klee sheet law) ----
mass_mobilization: {cost: -1}            # 2->1 (uncommon cost slot 1)
field_promotion:   {draw: +1}            # 1->2
reinforcements:    {cost: -1}            # 2->1 (uncommon cost slot 2)
mercy_of_the_deep: {power_amount: +1}    # feel_no_pain 3->4
pearl_barrage:     {formula_per: +1}     # 5 + 2/exhausted card (gleeful_barrage-class scaling bump;
                                         # the base moved 3 -> 5 at v0.3 (lint-ok: 3->5 is that base move,
                                         # not this row's delta), the slope is what upgrades)
communion_of_tides: {draw: +1}           # burn 1, see 3
rearguard_action:  {block: +3}           # 7->10, dodge_roll-parity
