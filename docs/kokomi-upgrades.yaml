# Kokomi + Inazuma upgrade deltas — v0.2 sheet pass (companion file to kokomi-cards.yaml / inazuma-companions.yaml)
# Grammar authority: upgrade-conventions.md; klee-upgrades.yaml precedents cited inline. ALL deltas PROPOSED.
# RESOURCE-CURVE LAW (Klee R1 precedent, applied to her engine): upgrades must NOT move the resource curve —
#   no gain_charge deltas, no conscript-count deltas, no cadence/aura riders. Charge lines and conscript counts
#   are printed identities; upgrades buy quality (damage/Block/draw/cost), never a faster engine.
# ceremonial_garment: NO UPGRADE (kit card, v1.9; sparks_n_splash precedent — Talent Training is v2 design space).
# KNOWN GAP, flagged not fudged: no sly-delta key exists in the applier, so Sly branches never move on upgrade
#   (drifting_lantern/tidal_lure upgrade their PLAYED faces only). Extending the dispatch is a design decision
#   about whether upgrades should sharpen the discard game — deferred to a ruling, not smuggled in here.

# ---- BASICS ----
waters_edge:       {damage: +3}          # 6->9 (R53: base stays at Strike parity; Strike+ slope)
coral_guard:       {block: +3}           # 5->8, Defend-exact
kurages_oath:      {innate: true}        # [USER]: the upgrade buys INNATE ONLY — the Block does not move.
                                         # At 12 the printed number is already flagged as maybe-too-strong,
                                         # so the upgrade sells consistency (online turn 1, not drawn on
                                         # turn 6) instead of more of it.
bake_kurage:       {kurage_turns: +1}    # v0.4 starter rework: 1->2 turns on the field, i.e. ONE extra
                                         # pulse — which at the bank read (x3 since R73, was x4) is the whole upgrade. The pulse numbers are constants and
                                         # the +1 Charge never moves (resource-curve law) — duration is the
                                         # only dial an upgrade owns, and one more pulse is the honest reward.
tactical_retreat:  {draw: +1, discard: +1}  # G6: draw 1/discard 1 -> draw 2/discard 2. Both halves move
                                         # together because the card is a TEACHER: a version that drew 2 and
                                         # discarded 1 would teach that discard is a cost you grow out of,
                                         # which is the opposite of the Sly lane's bargain. [USER] verbatim:
                                         # not a true cycling effect, and never to be tuned into a solo
                                         # engine piece.
tide_reading:      {block: +2}           # 2->4; draw stays 1

# ---- COMMONS (one number bump each; zero cost reductions — Klee sheet law) ----
conscription_notice: {draw: +1}          # the notice replaces itself twice over; conscript count fixed at 1
to_the_front:      {add: {op: draw, amount: 1}}   # quick_fuse precedent: the 0-cost order now replaces itself
votive_offering:   {block: +3}           # 5->8
ritual_purification: {draw: +1}          # 1->2; the Charge line NEVER moves (resource-curve law)
waterspout:        {damage: +3}          # 7->10, still burns itself
cleansing_tide:    {block: +4}           # 10->14, still eats two cards
undertow_shuffle:  {draw: +1}            # 3->4; discard stays 2 (the two Sly bells are the identity)
moon_signal:       {draw: +1}            # discard 1, see 2
drifting_lantern:  {block: +2}           # played 4->6; the Sly branch stays 4 (header gap note)
surging_shoal:     {damage: +2}          # R77: 6->8 all (was 7->9). The delta is unchanged; the base moved.
                                         # The old comment here read "4->6", which had been stale since the
                                         # v0.3 repricing to 7 -- two bases out of date, in the file whose
                                         # whole job is to say what a card becomes.
jade_bulwark:      {block: +2}           # 6->8, warm_glow-exact
pulsing_current:   {damage: +3}          # 6->9, snap-exact

# ---- UNCOMMONS (bump OR keyword; two cost slots — Klee sheet law) ----
mass_mobilization: {cost: -1}            # 2->1 (uncommon cost slot 1)
field_promotion:   {draw: +1}            # 1->2
reinforcements:    {cost: -1}            # 2->1 (uncommon cost slot 2)
mercy_of_the_deep: {power_amount: +1}    # feel_no_pain 3->4
pearl_barrage:     {formula_per: +1}     # 3 + 2/exhausted card (gleeful_barrage-class scaling bump)
communion_of_tides: {draw: +1}           # burn 1, see 3
rearguard_action:  {block: +3}           # 7->10, dodge_roll-parity
# swift_currents: MERGED INTO moonlit_offering (G8). Its old delta was {energy: +1} with the Exhaust
#   deliberately retained, because removal would have opened a net-positive energy loop. That reasoning is
#   inherited by the merged card, whose Exhaust is now load-bearing for R79 as well as for the loop.
shell_of_sanctuary: {block: +4}          # 11->15, spirited_away-parity
exposing_current:  {vulnerable: +1}      # 2->3 (surprise_visit-parity; the R51 rider sharpens, the Exhaust stays)
all_streams_flow:  {damage: +3}          # 5->8 base; the 1-per-2-Charge read never moves (resource-curve law)
tidal_lure:        {block: +2}           # played 4->6; Sly Vulnerable stays 1 (header gap note)

# ---- v0.5 PARTIAL-FILL COMMONS (+12) ----
# Same laws as above: one number each, no cost reductions at common, and the RESOURCE CURVE NEVER MOVES —
# no conscript-count delta, no gain_charge delta, no threshold moves down. Upgrades buy quality only.
standing_orders:   {block: +3}           # 4->7; the muster count is a printed identity and stays 1
signal_arrow:      {damage: +3}          # 5->8; the order it carries never gets louder
shoulder_to_shoulder: {copy_cost_override: 0}   # the duplicate arrives FREE (Borrowed Brilliance precedent).
                                         # Not "copy 2" — the copy count is a card-creation number and LAW 4
                                         # binds this row at exactly net 0.
vow_of_tides:      {damage: +3}          # 8->11 all, still one wave and still self-consuming
pearl_diver:       {add: {op: draw, amount: 1}}   # to_the_front/quick_fuse precedent: the free line now
                                         # replaces itself. The Charge NEVER moves (resource-curve law), so
                                         # velocity is the only thing left to sell — which is the right sale.
tideline_watch:    {block_next_turn: +4} # 8->12 next turn; the exhaust stays exactly one card
whispered_word:    {block: +3}           # played 3->6; the Sly draw stays 1 (header gap note)
driftwood_charm:   {block: +3}           # played 3->6; the Sly Charge stays 2 (resource-curve law + gap note)
scattering_spray:  {damage: +2}          # 5->7 all; the churn (discard 1 / draw 1) is the identity and holds
slack_water:       {block: +3}           # 4+4 -> 7+4: the half you can rely on is the half that grows.
                                         # (Keyed `slack_water`, not the drafted `ebb_and_flow` — Furina owns
                                         # that id, and the upgrade index is GLOBAL across sheets, so the
                                         # collision took the loader down rather than silently shadowing.)
tideturn:          {damage: +3}          # 5->8; draw stays 1
steady_the_line:   {block: +3}           # 4->7 at 0 cost; the tempo price stays

# ---- v0.5 PARTIAL-FILL UNCOMMONS (+8) ----
# SECTION HEADING IS NOW APPROXIMATE: honor_guard (R75 + G8's R79 collision) and moonlit_offering (G8) were
# both promoted to Rare in the Neap Tide pass and are left in place rather than moved, so their git history
# stays readable. Rarity lives on the CARD sheet and is authoritative there; these headings are organisational.
honor_guard:       {retain: true}        # R75 + [USER] this pass: the upgrade buys RETAIN, nothing else.
                                         # The old delta added a draw, which is dead grammar now -- R79 gives
                                         # Discard/Sly the monopoly on draw, and this card is not in that lane.
                                         # A deeper discount is also out: cost_mod is energy, and energy is
                                         # the resource curve. Retain is the right sale for a 0-cost tempo
                                         # enabler -- it stops being a card you must draw ON the turn the
                                         # recruits are in hand, which is the whole failure mode it answers.
press_the_advantage: {damage: +3}        # 7->10; the recruit already arrives at cost 0, so damage is the dial
moonlit_offering:  {energy: +1, draw: +1}  # G8 merged card: energy 1->2, draw 1->2; the discard stays 1.
                                         # This is the R79 template's own upgrade shape ("Gain 1 (2) energy,
                                         # draw 1 (2)"). The Exhaust is NOT removable by upgrade -- it is what
                                         # makes the card legal under R79 at all, and removing it would also
                                         # open the net-positive energy loop swift_currents was denied.
read_the_current:  {damage: +3}          # the ALWAYS-LIVE half, 7->10 (so 13->16 over the bar). The threshold
                                         # bonus stays 6 and THE BAR NEVER MOVES — lowering a threshold is a
                                         # resource-curve move, which the law forbids. Upgrading the base is
                                         # also the honest sale: it pays on turn 1, not only after node 4.
quiet_harbor:      {block: +3}           # played 6->9; the Sly draw stays 2 (header gap note)
driftglass:        {damage: +3}          # played 8->11; the Sly hit stays 5 (header gap note)
pearl_current:     {power_amount: +2}    # metallicize 3->5 (mercy_of_the_deep-parity slope)
before_sun_and_moon: {power_amount: +1}  # kurage_amp 1->2. NOT the +2 pearl_current takes, deliberately:
                                         # every other power on this sheet adds a TERM, and this one moves a
                                         # COEFFICIENT on a bank that is uncapped and never spent (R80), so
                                         # the same printed delta is not the same power. +1 here already
                                         # doubles the card. It is also legal under the resource-curve law by
                                         # the narrow reading -- Charge ACCRUAL does not move, only what a
                                         # point of it buys -- and that reading is worth stating, because a
                                         # coefficient on the engine's output is the closest this sheet comes
                                         # to selling a faster engine without technically being one.
the_tide_remembers: {damage: +3}         # the base wave, 4->7 to all (so 9->12 over the bar); pile bar stays 6

