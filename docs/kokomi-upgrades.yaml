                                         # upgrade buys magnitude and the ceiling stays where the Rare put it,
                                         # with the row's `never_reduces` mode keeping the bigger ward on top.

# ---- v0.5 PARTIAL-FILL COMMONS (+12) ----
# Same laws as above: one number each, no cost reductions at common, and the RESOURCE CURVE NEVER MOVES —
# no conscript-count delta, no gain_charge delta, no threshold moves down. Upgrades buy quality only.
standing_orders:   {block: +3}           # 4->7; the muster count is a printed identity and stays 1
signal_arrow:      {damage: +3}          # 5->8; the order it carries never gets louder
shoulder_to_shoulder: {copy_cost_override: 0}   # the duplicate arrives FREE (Borrowed Brilliance precedent).
                                         # Not "copy 2" — the copy count is a card-creation number and LAW 4
                                         # binds this row at exactly net 0.
vow_of_tides:      {damage: +3}          # 8->11 all, still one wave and still self-consuming
pearl_diver:       {add: {op: draw, amount: 1}}   # to_the_front/quick_fuse precedent: the free line now
                                         # replaces itself. The Charge NEVER moves (resource-curve law), so
                                         # velocity is the only thing left to sell — which is the right sale.
tideline_watch:    {block_next_turn: +4} # 8->12 next turn; the exhaust stays exactly one card
whispered_word:    {block: +3}           # played 3->6; the Sly draw stays 1 (header gap note)
driftwood_charm:   {block: +3}           # played 3->6; the Sly Charge stays 2 (resource-curve law + gap note)
scattering_spray:  {damage: +2}          # 5->7 all; the churn (discard 1 / draw 1) is the identity and holds
# --- F4 Sly-lane bridge (Neap Tide addendum) ---
ebb_tide:          {exhaust: +1}         # exhaust 1 -> 2 CHOSEN cards, discard stays 1. The upgrade sells more
                                         # ENGINE, not more tempo: it is the conversion rate that scales, which
                                         # is the only thing this card was ever bought for. (Expressible only
                                         # because the branch is `chosen` -- the random branch has no C# path
                                         # at amount > 1; see the codegen guard.)
salt_line:         {block: +3}           # played 5->8; the Sly exhaust stays 1 (header gap note). The BELL is
                                         # the identity and the wall is the filler, so the filler is what grows
                                         # -- same call drifting_lantern and quiet_harbor already made.
slack_water:       {block: +3}           # 4+4 -> 7+4: the half you can rely on is the half that grows.
                                         # (Keyed `slack_water`, not the drafted `ebb_and_flow` — Furina owns
                                         # that id, and the upgrade index is GLOBAL across sheets, so the
                                         # collision took the loader down rather than silently shadowing.)
tideturn:          {damage: +3}          # 5->8; draw stays 1
steady_the_line:   {block: +3}           # 4->7 at 0 cost; the tempo price stays

# ---- v0.5 PARTIAL-FILL UNCOMMONS (+8) ----
# SECTION HEADING IS NOW APPROXIMATE: honor_guard (R75 + G8's R79 collision) and moonlit_offering (G8) were
# both promoted to Rare in the Neap Tide pass and are left in place rather than moved, so their git history
# stays readable. Rarity lives on the CARD sheet and is authoritative there; these headings are organisational.
honor_guard:       {retain: true}        # R75 + [USER] this pass: the upgrade buys RETAIN, nothing else.
                                         # The old delta added a draw, which is dead grammar now -- R79 gives
                                         # Discard/Sly the monopoly on draw, and this card is not in that lane.
                                         # A deeper discount is also out: cost_mod is energy, and energy is
                                         # the resource curve. Retain is the right sale for a 0-cost tempo
                                         # enabler -- it stops being a card you must draw ON the turn the
                                         # recruits are in hand, which is the whole failure mode it answers.
press_the_advantage: {damage: +3}        # 7->10; the recruit already arrives at cost 0, so damage is the dial
moonlit_offering:  {energy: +1, draw: +1}  # G8 merged card: energy 1->2, draw 1->2; the discard stays 1.
                                         # This is the R79 template's own upgrade shape ("Gain 1 (2) energy,
                                         # draw 1 (2)"). The Exhaust is NOT removable by upgrade -- it is what
                                         # makes the card legal under R79 at all, and removing it would also
                                         # open the net-positive energy loop swift_currents was denied.
read_the_current:  {damage: +3}          # the ALWAYS-LIVE half, 7->10 (so 13->16 over the bar). The threshold
                                         # bonus stays 6 and THE BAR NEVER MOVES — lowering a threshold is a
                                         # resource-curve move, which the law forbids. Upgrading the base is
                                         # also the honest sale: it pays on turn 1, not only after node 4.
quiet_harbor:      {block: +3}           # played 5->8; the Sly draw stays 2 (header gap note)
driftglass:        {damage: +3}          # played 8->11; the Sly hit stays 5 (header gap note)
undertow:          {formula_base: +3}    # played base 4->7; the per-exhaust slope stays +1 and the Sly
                                         # energy stays 1. Upgrading the BASE rather than the slope on purpose:
                                         # the slope reads a pile that is uncapped and only grows (the same
                                         # shape R80 makes dangerous on Charge), so moving it is a
                                         # resource-curve move on an unbounded count. The base pays on turn 1.
pearl_current:     {power_amount: +2}    # metallicize 3->5 (mercy_of_the_deep-parity slope)
before_sun_and_moon: {power_amount: +1}  # kurage_amp 1->2. NOT the +2 pearl_current takes, deliberately:
                                         # every other power on this sheet adds a TERM, and this one moves a
                                         # COEFFICIENT on a bank that is uncapped and never spent (R80), so
                                         # the same printed delta is not the same power. +1 here already
                                         # doubles the card. It is also legal under the resource-curve law by
                                         # the narrow reading -- Charge ACCRUAL does not move, only what a
                                         # point of it buys -- and that reading is worth stating, because a
                                         # coefficient on the engine's output is the closest this sheet comes
                                         # to selling a faster engine without technically being one.
the_tide_remembers: {damage: +3}         # the base wave, 4->7 to all (so 9->12 over the bar); pile bar stays 6

