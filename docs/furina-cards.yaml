# authored theatrical flavor — lore/constellation audit per v1.7 checklist before ship, as with Klee.
# Resource grammar: encore_cost is a playability gate (never overdraw). Fanfare is READ-ONLY -- no card spends it
# ("The Tide Turns", F-A4); cards read it (bonus_formula: N_per_M_fanfare), gate on it (if: fanfare_at_least_N), or
# print one of the TWO KEYWORDS below. spend_encore remains the priced-overdraw path.
# FANFARE REWORK (2026-07-28, RULED; numbers RATIFIED R130 2026-08-07 — per-row markers carry the record;
# the one exception is the vetoed Track 2.4 starter clause, reverted; `lasting_impression` was commissioned
# rather than ratified there and its body LANDED SEPARATELY AT R135, 2026-08-08). Two changes to this grammar:
#   TRACK A -- SINGLE LEG. Fanfare prints when Encore goes DOWN, never when it goes up. The four sources are
#     hp_lost, encore_spent, encore_absorbed (NEW -- the buffer eating a hit) and center_stage. `encore_gained`
#     is DELETED in both engines: it made every Encore point pay the meter twice (47% of all generation under
#     the greedy pilot, 62% under the stoker). All four are INDIRECT, which is what the keyword below rests on.
#   TRACK B -- PRINTED KEYWORDS. The invisible "every Power grants 5 floor, rares 8" automatic is DELETED.
#     "Fanfare Cap +X"  op: raise_fanfare_cap    -- the ceiling only. Commons/uncommons/Exhaust skills.
#     "Fanfare +X"      op: gain_fanfare_floor   -- current + floor + cap. RARE POWERS ONLY (register lint R6).
#     Spelled "Fanfare Cap", never bare "Cap" -- the Salon's member cap is also a per-player stat since A12.
#     NO card may grant TRANSIENT Fanfare directly (register lint L12, a BLOCKER on both the sheet and
#     effects.OPS): the moment one does, "Fanfare +X" means two things on faces already printed.
#     EB-118 sec.5.2 (2026-08-24) RETIRES Track 1's universal rider. "Fanfare Cap +X" is an AVAILABLE
#     EXPLICIT VERB, not a line every Power must carry: sixteen cards carried it incidentally, the cap has
#     not been a binding number since F-A5, and a printed line that is close to inert teaches the player to
#     distrust printed lines. Register lint R7 -- "every Power prints exactly one Fanfare keyword" -- is
#     GONE with them. What survives unchanged: R6, so "Fanfare +X" (gain_fanfare_floor) is still a RARE
#     POWER payoff and still exactly three cards; and the verb itself, so a future card whose JOB is
#     headroom prints "Fanfare Cap +X" and means it. Magnitudes if one is authored: +5 at common/uncommon,
#     +8 at rare. The cap verb may ride a non-Power (lasting_impression); "Fanfare +X" may not.
#     NO compensation was paid for the sixteen removals, deliberately: the value of the removal IS that a
#     printed rider becomes trustworthy again, and paying for it in flat numbers would spend that.
# NO passive accrual anywhere on this sheet — no per-turn Encore or Fanfare trickle exists, and none may be added (a per-turn Encore
# power would launder passive Fanfare through the gain hook; deliberately not designed — see sheet-pass plan §5).
# ONE exception, off-sheet by construction: the Ancient carve-out (R127, LAW card-sheet rules) — All the World's a
# Stage, Ancient rarity, Dusty Tome's single door. Ancients are not sheet rows, so this sheet's ban stands as written.
# SPOTLIGHT v5: Center Stage gives Furina plays Fanfare but no numeric boost; Guest Cast empowers every Companion card
# and gives no Spotlight-derived Fanfare. Fanfare payoffs READ the pool -- "The Tide Turns" (F-A4) retired
# fanfare_cost and no card spends it; the_final_verdict is the one card that lowers it, by crashing it to a floor
# it also drops.

