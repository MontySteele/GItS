   effects: [{op: gain_fanfare_floor, amount: 5}, {op: gain_encore, amount: 4}]}
   # Floor RATIFIED here (2026-07-26 [USER]; raised from its F-B2 value, and the upgrade delta chains on
   # top unchanged). Tested at the red-pen, and the honest reading of that cell is that it sits BELOW THE
   # RUN INSTRUMENT'S NOISE FLOOR -- both the fanfare and salon arms moved by less than the seed spread.
   # At the payoff reach this archetype actually holds, the run model cannot rank a single common. What
   # the cell DOES show is that the raised floor breaks nothing and does not re-pin the meter. The
   # pool-sweep world, where reach is the subject rather than the confound, delivers the real verdict.
   # F-B2's floor source at COMMON, and the reason the mechanic reaches the archetype it was built for: powers alone
