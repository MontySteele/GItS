   # Her normal attack.
   # A15 (RULED 2026-07-28, playtest-2 red-pen): damage 4 -> 6. The old 4 was
   # "DREADFUL on purpose — A1 is the load-bearing weakness (kickoff §2)", but
   # that design space was REVERTED and the number was left behind: a
   # vestigial weakness nothing downstream still leans on. EXPECT the A1
   # frontload axis to move at the next scorecard — that movement is THIS
   # RULING, not drift, and must be labeled as such when the table re-runs.
   # Upgrade delta unchanged (+3, so 6 -> 9) unless red-penned.
- {id: stage_presence, name: "Stage Presence", register: salon, cost: 1, type: skill, rarity: basic, solve: [block], archetypes: [generic], role: glue,
   effects: [{op: block, amount: 6}]}
   # One above a standard Defend: the measured starter-level stabilization nudge. Her distinctive durability still comes from Encore, not a hidden self-Spotlight subsidy.
- {id: regal_bearing, name: "Regal Bearing", register: archon, cost: 1, type: skill, rarity: basic, solve: [block, utility], archetypes: [generic], role: glue,
   effects: [{op: block, amount: 3}, {op: apply_power, power: weak, amount: 1, target: enemy}]}
   # Fifth basic (template allows 4-5): the Regina looks at you. Starter's A6 debuff texture from card one.
- {id: aria_of_recompense, name: "Aria of Recompense", register: private, cost: 1, type: skill, rarity: basic, solve: [sustain], archetypes: [generic, fanfare], role: enabler,
   effects: [{op: gain_encore, amount: 5}]}
