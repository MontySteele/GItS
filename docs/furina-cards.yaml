- {id: salon_debut, name: "Salon Début", register: salon, cost: 1, type: skill, rarity: basic, solve: [utility, scaling], archetypes: [salon], role: enabler, tags: [skill_tag],
   effects: [{op: apply_power, power: salon_member, amount: 1, target: self, member: chevalmarin}]}
