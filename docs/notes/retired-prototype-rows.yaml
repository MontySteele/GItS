# RETIRED -- the Furina REFRAME's six sealed-record faces (`EB-726`)
#
# R269 ruled the Stage, whose brief sec.2 retires the reframe by name. Its
# sixteen `proto_fr_` rows left `docs/prototype-surface.yaml` with `EB-719`
# (commit 525c5c58, 2026-09-08) and the rest of the arm -- the C# switch, the
# sim engine module, the Salon panel and every pin -- left HEAD with `EB-726`.
#
# SIX FACES SURVIVE HERE AND TEN DO NOT, and the split is the R101b rule this
# file exists for. The reframe rounds 1 to 16 are sealed records
# (`review/ruled/furina-reframe-round-*`, `review/records/furina-reframe-round-*`)
# and they name cards by printed TITLE. Ten of the sixteen titles are either
# named by no record or already resolve on a live sheet -- `Salon Debut`,
# `Let the People Rejoice`, `Shared Billing`, `Rapturous Applause` and
# `Unheard Confession` are shipped rows, and a frozen twin would only give one
# title two rows. The six below are the titles a sealed record names that
# NOTHING in HEAD resolves, so freezing them is what keeps those records
# replayable through `understudy/resource_order.SHEETS`.
#
# Retrieval -- the last tree that carried all sixteen, with their comments:
#
#     git fetch --depth=1 origin 525c5c58dd0d9aa958284a4b10cd34402ebcf8f5
#     git show 525c5c58dd0d9aa958284a4b10cd34402ebcf8f5^:docs/prototype-surface.yaml
#
# The arm's design reasoning is `review/ruled/furina-reframe-2026-08-29.md`
# (R220 A); the published reads stand as published (R101b) and are not
# re-graded by this deletion.

