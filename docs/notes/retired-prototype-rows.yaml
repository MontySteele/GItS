# RETIRED PROTOTYPE ROWS -- FROZEN, AND NOT A SECOND SURFACE.
#
# `EB-750`, 2026-09-16. R270 ruled Spark a CURRENCY under `KLEE_OVERHAUL`,
# which superseded the Sparks alternative-cost arm whole. Its eleven rows left
# `docs/prototype-surface.yaml` under that sheet's own deletion rule, together
# with both substitution maps, the derived `KLEE_SPARK_ALT_ROWS`, the emitted
# C# classes and the C# starter seam. They read back at commit
# 036c12d150d6dbd58f0776a0d07e3c028a321a61.
#
# WHY THE FACES SURVIVE HERE AND NOTHING ELSE DOES. `KLEESPARK-R1`, `-R2`,
# `-BT1`, `-BT2` and `-BT3` are SEALED records (R101b): their boards, their
# graded forms and the locks written on them
# (`tier0/tests/test_seat_instruments.py`) name these cards by printed TITLE,
# and a replay that cannot resolve a title cannot say whether the play aimed.
# Deleting the rows outright would therefore have struck a published record's
# machinery, which R101b forbids, so the FACES are frozen here and read by
# exactly one door: `understudy/resource_order.SHEETS`, the printed-title index
# a sealed record is replayed through.
#
# WHAT THIS FILE IS NOT. It is in no pool, no reward, no shop, no draft, no
# digest and no version stamp; `tier0/content/loader.py` never reads it; no
# codegen emits from it; no row here can be granted. Nothing is ever ADDED to
# it except by the same route -- a superseded row that a sealed record names --
# and a row whose records are archived leaves it.

