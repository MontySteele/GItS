# all_streams_flow already broke the seal on sub-Rare Charge reads, and a flat bar is milder than its
# per-point slope, so the ladder stays monotone.
# Commander (2)
- {id: honor_guard, name: "Honor Guard", cost: 1, type: skill, rarity: uncommon, solve: [utility], archetypes: [commander], role: payoff,
   effects: [{op: conscript, amount: 1}, {op: cost_mod, scope: companion_cards, delta: -1, duration: this_turn}]}
   # Muster one, and every unit already standing costs 1 less THIS TURN. The Commander's tempo payoff: the
   # archetype's failure mode is a hand full of recruits it cannot afford to play, and this is the answer to it.
- {id: press_the_advantage, name: "Press the Advantage", cost: 1, type: attack, rarity: uncommon, solve: [frontload, utility], archetypes: [commander], role: payoff,
   effects: [{op: damage, amount: 7, target: enemy}, {op: conscript, amount: 1, cost_override: 0}]}
   # The hit that makes the opening, and the recruit who walks through it TODAY (cost 0, this copy).
   # field_promotion is the same reach as a skill that replaces itself; this one is the reach on an attack.
# Priest (2)
- {id: moonlit_offering, name: "Moonlit Offering", cost: 1, type: skill, rarity: uncommon, solve: [scaling, velocity], archetypes: [priest], role: enabler, exhaust: true,
   effects: [{op: exhaust_from, amount: 2, select: chosen}, {op: gain_charge, amount: 3}, {op: draw, amount: 2}]}
   # Burn deep, see far: 6 total Charge (3 line + 3 funnel, counting its own rotation) and two fresh cards, for
   # a net deck delta of -3. The priest lane's biggest single act of fuel, and the sheet's clearest statement
   # that her deck IS her resource bar.
- {id: read_the_current, name: "Read the Current", cost: 1, type: attack, rarity: uncommon, solve: [frontload, scaling], archetypes: [priest, generic], role: payoff,
   effects: [{op: damage, amount: 7, target: enemy},
             {op: conditional, if: charge_at_least_10, then: [{op: damage, amount: 6, target: enemy}]}]}
   # THE THRESHOLD SHAPE, and the reason it exists: all_streams_flow's per-point slope is the only sub-Rare read
   # she has, and a slope is the shape that makes late Charge frightening. A bar does not — it pays once, it is
   # printed, and it stops. 10 is roughly her node-4 bank, so this comes online exactly when act 1 turns into
   # act 2. Off the bar it is a playable 7; on it, 13 — an uncommon-priced spike that never grows further.
   # Written as base-plus-bonus rather than a two-branch either/or ON PURPOSE: the upgrade then moves the half
   # that is always live, and the bar itself cannot drift downward as a side effect (resource-curve law).
