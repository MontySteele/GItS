   sly: [{op: damage, amount: 5, target: random_enemy}],
   effects: [{op: damage, amount: 8, target: enemy}]}
   # The first Sly ATTACK on any sheet: 8 aimed, or 5 at whoever is nearest when it goes over the side. Nothing
   # else in her pool makes a random discard into damage, and the assist lane needed a reason to be in a fight.
# Generic (2)
- {id: pearl_current, name: "Pearl Current", cost: 1, type: power, rarity: uncommon, solve: [block], archetypes: [generic], role: payoff,
   effects: [{op: apply_power, power: metallicize, amount: 3, target: self}]}
   # Standing guard: 3 Block at the start of every turn, forever. The generic lane's only power, and the one
   # card in the pool that pays a player who does nothing — deliberate, because every other engine she has
   # demands cards, and a deck that runs out of cards should not immediately run out of defence.
- {id: the_tide_remembers, name: "The Tide Remembers", cost: 2, type: attack, rarity: uncommon, solve: [frontload, scaling], archetypes: [priest, generic], role: payoff,
   effects: [{op: damage, amount: 4, target: all_enemies},
             {op: conditional, if: exhaust_pile_at_least_6, then: [{op: damage, amount: 5, target: all_enemies}]}]}
   # The pile threshold: the exhaust pile is the record of everything she has rotated off the line, and once it
   # is six deep the wave arrives with all of it behind (4 to all, or 9). pearl_barrage reads the pile per-card
   # and single-target; this reads it once, as a bar, and pays ALL enemies — the AoE face of the same idea,
   # bounded by construction. Same base-plus-bonus encoding as read_the_current, for the same two reasons.

