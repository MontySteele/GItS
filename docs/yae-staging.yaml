# YAE MIKO, CARD STAGE BATCH ONE -- a SIM-ONLY staging sheet
# (`loader.STAGING_SHEETS`). Paper: review/active/yae-card-paper-2026-10-13.md
# (every number and reading there); rules twin: tier0/engine/yae_shrine.py.
# No codegen reads this file: her C# waits on the paper's picks, so the
# faces print their base number plainly (no `{Var:diff()}`), and the
# `upgrade:` deltas are declared for the build that follows. Rows move to
# docs/prototype-surface.yaml, unchanged in grammar, when the picks are ruled.
# Her verb is `{op: yae, kind: ...}` with the fields `yae_shrine.KIND_FIELDS`
# names; `yae_amount` / `yae_base` / `yae_per` are its upgrade keys.
# Annotation names: red_ink, footnote, deadline, fox_fire, sakura_seal.

