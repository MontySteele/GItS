   # `EB-687`: THE CLAUSE NAMES WHAT IT DOUBLES, so a Plan that deals none is
   # visibly unchanged. The finding and the ceiling: the provenance note.
   description: "Deal 5 damage. [gold]Plan[/gold]: Apply 1 [gold]Vulnerable[/gold] to ALL enemies. The Plan after this one deals double damage.",
   effects: [{op: damage, amount: 5, target: enemy}],
   # THE RIDER IS THE SECOND CLAUSE and it aims at nothing: "the next Plan" is
   # the entry carried out immediately after this one in the same drain.
   # Order and the upgrade's one half: the provenance note.
   plan: [{op: apply_power, power: vulnerable, amount: 1, target: all_enemies},
          {op: next_plan_double_damage}],
   upgrade: {damage: 2}}

