- {id: proto_itto_superlative_superstrength_either, name: "Itto - Oni Rush", character: klee,
   authored_by: [claude],
   nation: inazuma, star: 5, rarity: rare, role_c: trigger, element: geo, cost: 2, type: attack,
   effects: [{op: choose_one, modes: [
              {label: "Deal 14 damage",
               effects: [{op: damage, amount: 14, target: enemy}]},
              {label: "Gain 6 Block",
               effects: [{op: block, amount: 6}]}]}]}

