   effects: [{op: block, amount: 4}],
   # A FLAG AND NOT A COUNT: under Nereid's Ascension the entry this reaches
   # is carried out THREE times (`CarryOutTimes + 1`) and not four, which is
   # the rule stated at `kokomi_plan.NEXT_PLAN_EXTRA_CARRY_OUT`.
   plan: [{op: next_plan_extra_carry_out}],
   upgrade: {block: 2}}

