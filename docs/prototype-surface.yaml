# =============================================================================
# KOKOMI SLICE 2 (R217 F, executing R213 E1) -- four rows, four arms, one each.
#
# THE QUESTION. R213 E1 reopened "Charge is uncapped and never spent" (R80).
# Slice 1 priced Companion Block at the turn and could not answer the other
# half of the 2026-08-26 playtest finding -- [USER]'s "her best turn is usually
# 'spam companion cards to block until you can hit with the Charge'" -- because
# nothing in it gave the bank a second use. These four rows are the four
# shapes R217 F names, each one a different answer to "is there a payoff
# besides waiting":
#
#   SPEND       -- the bank buys something NOW, at a rate that has to beat
#                  holding it for the readers.
#   THRESHOLD   -- the payoff steps up at a bar and stops, so there is a point
#                  to bank TO rather than a slope to wait on.
#   MODE        -- two halves paid in different currencies, one of them the
#                  bank.
#   FORMATION   -- R216 D's Muster subsidy with its sign flipped: the
#                  formation is bought WITH the finisher instead of feeding it.
#
# ONE PRICE ACROSS THE SLICE: every row that charges Charge charges SIX. Not a
# balance judgement -- an attribution one. Four arms differing in shape AND in
# price would leave nothing about a turn attributable to the shape. Six sits
# under the eight the boards bank, so a spend leaves a bank behind and the
# readers stay live either way; and it is the same number the threshold row's
# bar is set at, so the bar and the price cannot be read apart.
#
# EVERY OTHER NUMBER IS A SHIPPED NUMBER, UNMOVED. 7 and +6 are
# `read_the_current`'s. 5 Block is `coral_guard`'s. Muster 2 at cost 2 is
# `mass_mobilization`'s. The one number that is not lifted off a shipped face
# is 12, and it is derived rather than picked: the shipped readers pay 1 per 2
# Charge PER CAST and keep the bank, so a spend of 6 that empties it has to be
# worth about four casts of a reader to compete at all -- 2 per Charge spent.
# It is used TWICE (the spend row's whole payload, and the mode row's Charge
# half) so that the mode row's only new content is the alternative currency.
#
# THE CHARGE KEYWORD ships with these rows and is the R215 D / EB-152 gap
# closed on the prototype surface only: a printed [gold]Charge[/gold] with a
# hover tip carrying the rule and the live bank, attached by codegen from the
# `spend_charge` op. The packet's section 2 has the decision and its scope.
#
# NAMES are provisional and mine (R179), ordinary card names by construction:
# a blind grader reads printed titles, so no title here says spend, threshold,
# mode, formation, or prototype.
#
# I DESIGNED THESE ROWS AND MAY NOT GRADE THEM (R213's first guard).
# =============================================================================

# ---------- ARM 1: the bank buys something NOW -------------------------------
# Shipped twin: `all_streams_flow` / "All Streams Flow to the Sea" (1, Attack,
# Uncommon -- 5 damage, +1 per 2 Charge, single target, and the bank is
# UNTOUCHED). Cost, type, rarity, target and the noun all match it, so the pair
# differs in one thing only: that card READS the bank and keeps it, this one
# SPENDS it. There is no closer twin because nothing she owns spends Charge at
# all -- that is the rule the slice reopened.
#
# 12 rather than a formula, because a spend has nothing to scale off once it
# has paid. See the header for where 12 comes from.
- {id: proto_charge_spend_strike, name: "Sounding Line", character: kokomi,
   authored_by: [claude],
   cost: 1, type: attack, rarity: uncommon,
   effects: [{op: spend_charge, amount: 6},
             {op: damage, amount: 12, target: enemy}]}

# ---------- ARM 2: a bar to bank TO, not a slope to wait on ------------------
# Shipped twin: `read_the_current` (1, Attack, Uncommon -- 7 damage, +6 more at
# 10 or more Charge, and the bank is untouched). Both of its numbers are
# unmoved. Two things differ, and they are one idea: the bonus now COSTS the
# Charge it read, and the bar moves to the slice's single price so the bar and
# the price are the same fact. Off the bar it is a playable 7; on it, 13 and an
# empty-ish bank. It does not scale past the bar, by construction -- R58's
# threshold grammar, which is why this shape is legal below Rare at all.
- {id: proto_charge_threshold_strike, name: "Fathom the Tide", character: kokomi,
   authored_by: [claude],
   cost: 1, type: attack, rarity: uncommon,
   effects: [{op: damage, amount: 7, target: enemy},
             {op: conditional, if: charge_at_least_6,
              then: [{op: spend_charge, amount: 6},
                     {op: damage, amount: 6, target: enemy}]}]}

# ---------- ARM 3: two prices for one outcome --------------------------------
# Slice 1 arm 2's shape (Prune's "choose one"), with the currency swapped: there
# the two halves cost each other, here one half costs nothing but the card and
# the other costs the bank. The cheap half is `coral_guard`'s 5 Block exactly;
# the Charge half is arm 1's whole card, on purpose -- the only thing this row
# adds to that one is an alternative that is always available, so a turn that
# plays differently here is playing differently because of the ALTERNATIVE.
#
# THE GAME HAS NO PER-MODE PLAYABILITY. The choose-a-card screen offers both
# modes whatever the bank holds, so the Charge mode is the one place a price
# can be picked and not met. It does not pay out when that happens: the emitted
# body is `if (!await SpendCharge(...)) return;` and the sim raises
# ChargeUnpaid at the same point. The face still cannot GREY the mode out, and
# that is a real visibility gap rather than a nicety -- it is written up in the
# packet's section 6 as owed engineering, not papered over here.
- {id: proto_charge_mode_guard, name: "Twin Tides", character: kokomi,
   authored_by: [claude],
   cost: 1, type: skill, rarity: uncommon,
   effects: [{op: choose_one, modes: [
              {label: "Gain 5 Block",
               effects: [{op: block, amount: 5}]},
              {label: "Spend 6 [gold]Charge[/gold]: gain 12 Block",
               effects: [{op: spend_charge, amount: 6}, {op: block, amount: 12}]}]}]}

# ---------- ARM 4: the formation is bought, not subsidised -------------------
# Shipped twin: `mass_mobilization` / "Rally the Isles" (2, Skill, Uncommon --
# Muster 2 and gain 1 Charge). Cost, type, rarity and the Muster count are all
# unmoved; the CHARGE LINE flips sign. That is R216 D's deferral in a row: it
# ruled that Muster's subsidy -- a Mustered Companion costs 1 less, Exhausts,
# and pays 1 Charge, so blocking with one advances the finisher for free --
# folds into E1, and this asks whether the formation should cost the finisher
# instead of feeding it.
#
# THE PER-COMPANION FORM OF R216 D IS NOT BUILT HERE. "Recruits from this order
# grant no Charge when they Exhaust" is a property of the exhaust FUNNEL, not
# of a card's effect list, and it needs a flag on the recruit plus a check at
# the funnel in both engines. It is listed in the packet's section 6 for the
# coordinator rather than smuggled in beside four card rows.
- {id: proto_charge_muster_price, name: "Watatsumi Levy", character: kokomi,
   authored_by: [claude],
   cost: 2, type: skill, rarity: uncommon,
   effects: [{op: spend_charge, amount: 6}, {op: conscript, amount: 2}]}

# =============================================================================
# KLEE SLICE 1 (R213 E2) -- three rows, three arms. A FOURTH ARM WAS PROPOSED
# AND IS NOT HERE: `proto_spark_mode_bombs` / "Bag of Tricks" is HELD for
# [USER] on the independent seat's doctrine verdict, and holding it is the
# whole reason the seat was asked before anything was authored. The verdict is
# in review/qa/klee-slice-1-doctrine-review-codex-gpt-5.6-sol.md; the pick list
# is in the packet.
#
# THE QUESTION. R213 E2 reopened "Sparks mean free Attack" as "likely upstream
# of Klee's Attack-spam identity". The engine says it more sharply than the
# playtest did: `combat.card_cost` zeroes ANY Attack at the threshold and
# `combat.play_card` debits the bank for it, both unconditionally, so the bank
# has one destination and it is chosen for the player. Against D2's six
# steerable verbs -- timing, targeting, placement, acquisition, conversion,
# forgoing -- the base rule feeds none.
#
# WHAT THESE ROWS DO NOT DO. The automatic rule is UNTOUCHED. Making it opt-in
# is a change to a character mechanic (klee-character-design.md section 3), it
# cannot be quarantined on a card surface, and the seat agreed it should not
# ride along with a card-level slice because it would destroy attribution. It
# also said plainly that the rule is the upstream problem and must eventually
# move; that is [USER]'s, and it is in the packet, not here.
#
# ONE PRICE ACROSS THE SLICE: every row charges THREE Sparks. An attribution
# call, not a balance one. Three is LIFTED, not picked -- it is the free
# Attack's own threshold, which is the thing under test, so each pair asks
# whether the bank is worth more as this card than as the rule. The three
# SHIPPED sinks (powder_charge, hold_the_line, smoke_and_sparks) charge 2, but
# 2 was authored against True Spark Knight's reduced threshold and would have
# confounded the question. The seat was asked about this directly and agreed:
# "Three is the right controlled price for this slice."
#
# EVERY NUMBER IS A SHIPPED NUMBER. 6 damage at cost 0 is
# `flame_on_the_wick`'s. `times: 2` is the sheet's standard multi-hit count
# (jumpy_dumpty, pocket_fireworks). Draw 3 is the twin's ceiling plus its
# floor. Block 5 is `clockwork_toy`'s. Burst 10 is `combustion_study`'s. THERE
# IS NO DERIVED NUMBER IN THIS SLICE AT ALL -- an earlier draft had one, and
# the seat's arithmetic correction removed the need for it.
#
# NO NEW OP, NO NEW PREDICATE, NO NEW PRICED VERB. `spend_spark` has been in
# both engines since EB-118 Phase 2 and has been printed by three shipped
# Uncommons since R211's W3 window; its playability gate (`combat.spark_cost`)
# and its no-partial-spend rule are shipped behaviour these rows only reuse.
# The proposal's arm 2 would have needed a `spark_at_least_` predicate; the
# seat's re-authoring of that arm removed the conditional and with it the
# predicate, so this branch adds NOTHING to either engine's vocabulary.
#
# NAMES are provisional and mine (R179), ordinary card names by construction:
# a blind grader reads printed titles, so no title here says spend, price,
# conversion or prototype.
#
# I DESIGNED THESE ROWS AND MAY NOT GRADE THEM (R213's first guard).
# =============================================================================

# ---------- ARM 1: the Attack pays the bank instead of being paid by it ------
# Shipped twin: `flame_on_the_wick` (0, Attack, Uncommon -- 6 damage to a
# single enemy, bank untouched). Cost, type, rarity, target and the damage
# figure all match, so the pair differs in one idea: this card charges the bank
# and hits twice for having done so.
#
# WHY THE PRINTED COST IS ZERO, AND IT IS NOT A ROUNDING CHOICE. A paid Attack
# at a full bank is zeroed and DEBITED by the automatic rule, which would eat
# the three Sparks before this card's own `spend_spark` ran -- the card would
# pay for its cost line and then refuse its own payload. `play_card`'s debit
# branch is guarded by `card.cost != 0` (there since R39/R34, for their own
# reasons), so a printed-zero Attack takes no automatic debit and its top-level
# spend is the only thing that moves the meter. The rule is sidestepped, not
# altered.
#
# THE DECISION IT CREATES is the arm's whole content: with three Sparks and
# this card plus any PAID Attack in hand, playing the paid Attack first makes
# it free and empties the bank, which makes this card unplayable; playing this
# card first takes the bank itself and leaves the other Attack at full price.
# Two Attacks, one bank, and the player picks. That is D2's timing and
# forgoing, on the Attack half of the kit that W3's three Skill sinks left
# without a decision.
- {id: proto_spark_priced_strike, name: "Second Helping", character: klee,
   authored_by: [claude],
   cost: 0, type: attack, rarity: uncommon,
   effects: [{op: spend_spark, amount: 3},
             {op: damage, amount: 6, target: enemy, times: 2}]}

# ---------- ARM 2: the bank buys velocity instead of an Attack ---------------
# Shipped twin: `eager_to_help` (1, Skill, Common -- draw 2 if you have any
# Spark, otherwise draw 1, and the bank is UNTOUCHED). It is the purest "watch
# it rise" card on the sheet: it looks at the bank, takes nothing, and pays
# more for the bank merely existing. This row buys the draw instead.
#
# RE-DERIVED FROM THE CLAUSE, CLAUDE-SIDE, 2026-08-29 (ROUND 3). Rounds 1 and 2
# ran this row on the seat's own re-authoring, and the same model family then
# graded and pair-read it, so both outcomes were PROVISIONAL (packet section
# 11). The repair is not a third grader: the seat's text is DISCARDED and the
# row is derived here from the CLAUSE it named and nothing else.
#
# THE CLAUSE, quoted and used as the only input: "THE COST MUST STAY AT TOP
# LEVEL. A `spend_spark` inside a conditional branch is invisible to the
# playability gate, and the payoff would then fire unpaid. That is a structural
# rule about this verb, not a preference about this card."
#
# THE ORIGINAL PROPOSAL (packet section 2, arm 2, mine): "Draw 1 card. If you
# have 3 or more Sparks: spend 3 Sparks and draw 2 cards." -- cost 1, Skill,
# effects `draw 1` then `conditional if spark_at_least_3 -> [spend_spark 3,
# draw 2]`.
#
# THE DERIVATION, IN THREE FORCED STEPS.
#   1. HOIST. The clause says the `spend_spark 3` may not sit inside the
#      conditional branch, so it moves to the top of the effect list. That is
#      the whole content of the clause and it is mechanical.
#   2. THE GUARD IS NOW DEAD, AND THIS IS ARITHMETIC RATHER THAN TASTE. With
#      the spend at top level, `combat.spark_cost` derives a PLAYABILITY GATE
#      from it (the shipped `powder_charge` behaviour this row reuses): the
#      card cannot be played at all below 3 Sparks. So `spark_at_least_3` is
#      true on every board where the card resolves, and a predicate that is
#      true whenever it is evaluated is not a branch. It is deleted because it
#      cannot change an outcome, not because a preference removed it.
#   3. THE TWO DRAWS COLLAPSE. `draw 1` at top level plus `draw 2` in a branch
#      that always runs is `draw 3`. Both figures are the ORIGINAL proposal's,
#      and both were already lifted off the twin (`eager_to_help` draws 2 with
#      a Spark and 1 without); nothing new is picked.
# The result is: `spend_spark 3` then `draw 3` -- cost 1, Skill, Uncommon.
#
# THIS LANDS ON THE SAME WORDING THE SEAT SUPPLIED, AND IT IS SAID PLAINLY.
# "Spend 3 Sparks. Draw 3 cards." is what the seat wrote as its volunteered
# remedy in round 1, and it is what the three steps above produce from the
# clause alone. That coincidence is expected: a categorical structural rule
# applied to a two-line card has one outcome. What makes this clean is that the
# RECORD now shows the derivation rather than an accepted remedy -- packet
