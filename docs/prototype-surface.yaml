# PROTOTYPE SURFACE -- QUARANTINED. R213 B (1050f67), BACKLOG EB-147. One
# staging surface for cards being TRIED, every character at once. A row here
# is not a card in the game: it is a question put to the real engine. It is
# in no reward pool, no release build, no digest and no version stamp, and
# the only way to reach one is a grant by id on a dev build.
#
# THE DELETION RULE IS THE POINT OF THE FILE. Once a slice is ACCEPTED or
# REJECTED its rows LEAVE here, re-authored onto the owning character's real
# sheet or deleted outright, with the reasoning in the slice's packet under
# review/ and never as a commented-out row. AN EMPTY FILE IS THE HEALTHY
# STATE. How to write a row: docs/current/operations/prototype.md. Why each
# row below exists: docs/notes/prototype-surface-provenance.md, by row id.

