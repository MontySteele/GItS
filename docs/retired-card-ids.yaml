# RETIRED CARD IDS -- the tombstone register (EB-790).
#
# A progress save keeps a `CardStats` row and a `DiscoveredCards` entry for
# every card the profile has ever seen, BY ID, and validates each one with
# `ModelDb.GetByIdOrNull<CardModel>`. A miss is a non-fatal `ValidationError`
# in godot.log, twice per boot, for the life of the profile -- and this
# project never edits the owner's save. `live-looks-8c` (2026-09-16) found
# `KLEEMOD-PROTO_FR_SALON_DEBUT_NAMED` warning on every launch, the Furina
# reframe id `EB-726` deleted.
#
# Each row below becomes ONE HIDDEN ALIAS: a `RetiredCardAlias` claiming the
# id and nothing else -- in `ModelDb` so the lookup resolves, in no pool so
# nothing can offer or grant it, out of the card library, carrying no rule.
# `klee-mod/KleeCode/Cards/Retired/RetiredCardAlias.cs` is the full argument
# and the four properties it rests on; `tools/gen_retired_card_aliases.py`
# emits the classes and `tools/lint_retired_card_ids.py` is the gate.
#
# ROWS ARRIVE AUTOMATICALLY. `gen_klee_cards._write_plan` deletes a generated
# class and appends its id here in the same breath, so the next retirement is
# covered without anyone remembering. The seed was the union of two sweeps
# taken 2026-09-16 -- every `.cs` git has seen deleted from a generated card
# directory with no live class re-using the name, and every `KLEEMOD-` id any
# archived godot.log reports as unknown. `id` is the exact `ModelId.Entry` a
# save holds; `owner` picks the pool `Pool` answers with, and is cosmetic.

