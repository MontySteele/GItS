- id: reaction
  weights:
    damage: 0.9
    block: 1.2
    scaling: 1.0
    reaction: 2.0
    tempo: 0.7
    cost: 0.1

- id: spark
  weights:
    damage: 1.0
    block: 1.2
    scaling: 1.0
    reaction: 0.6
