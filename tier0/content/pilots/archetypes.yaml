# --- real_ironclad (the real base-game reference pool). block stays at the
# frozen 1.2 everywhere. sustain/spotlight are OMITTED, not zeroed: the
# policy defaults make them inert, while writing 0.0 would imply he has an
# Encore buffer worth devaluing.
#
# KNOWN UNDERSTATEMENT -- on the record so a low score is not read as a
# finding about his pool (see the pass report):
#   1. _scaling_value caps a self-power at min(amount,6)*3 and decays it by
#      max(0, 1-turn/12). Demon Form compounds +2 Str EVERY turn and scores
#      as a one-shot +2 worth nothing by turn 12 -- exactly when it wins.
#      Raising `scaling` does not fix this; it inflates one-shot buffs too.
#   2. Vulnerable scores a flat amount*2 with no reference to
#      C.VULNERABLE_TAKEN_MULT, so Bash -- his STARTER -- is undervalued,
#      and starter is the config where constraints are hard.
#   3. Body Slam's live Block formula is now visible, but persistent and
#      history payoffs are still priced conservatively: Barricade's retained
#      Block is not valued as future-turn sustain, and Rampage/Tear Asunder
#      receive only bounded one-redraw / one-event estimates.
- id: ironclad
  weights:
    damage: 1.1      # no elements, no engine: hits are the plan
    block: 1.2       # FROZEN. do not tune.
    scaling: 1.4     # the Strength ramp is his identity (Salon's slot)
    reaction: 0.0    # applies no elements; the term is inert, said out loud
    tempo: 0.7       # Battle Trance / Offering draw
    cost: 0.1

# --- real_silent (the real base-game reference pool, Silent anchor sprint
# 2026-07-27). block stays at the frozen 1.2 everywhere; sustain/spotlight are
# OMITTED, not zeroed, for the same reason they are on the ironclad entry.
#
# EVERY NUMBER BELOW IS A PLACEHOLDER -- sprint ask A3, DEFERRED by [USER]
# on 2026-07-27 ("should also wait", i.e. until the card pool completes).
# They are a first reading of her kit, not a measurement, and no tier05
# number derived from them may be quoted as load-bearing until they are
# ruled (D4: the instrument must model the changed object).
#
# The deferral is the right call on the evidence: A3 is currently
# UNMEASURABLE. The `silent` and `generic` pilots produce IDENTICAL statlines
# on her twelve-card starter, which holds four distinct cards -- there is
# nothing for a weight to choose between. Weights become measurable when the
# pool is large enough to draft real decisions.
#
# SCHEDULED REVIEW -- [USER], 2026-07-27: "review the pilot after all of the
# cards land." The trigger is pool completion, not a date, and the review is
# three questions, not one:
#   a. Re-read every PLACEHOLDER below against the complete pool. Only then
#      is ask A3 answerable, because only then does a weight have real draft
#      decisions to choose between.
#   b. Explain the act-1 clear regression FIRST. Clear fell 46% -> 31% ->
#      39% -> 35% as coverage rose 27 -> 59 of 88, while the starter battery
#      stayed flat -- combat is not what changed, the draft is. Tuning these
#      weights before that is explained would tune them to hide it.
#   c. Decide whether the scorer needs a poison term at all (see 2 below).
#      That is a scorer change, not a weight change, and it is the one thing
#      no value in this block can express.
#
# KNOWN UNDERSTATEMENT -- on the record before any low score is read as a
# finding about her pool:
#   1. The assembled pool is 59 of 86 cards (69%; 60 rows, the extra being
#      the Shiv token). The denominator is 86, not the 88 printed in her card
#      pool: the game marks Flanking and Sneaky MultiplayerOnly, so a
#      single-player run never offers them and no DSL work could change that.
#      It was 27 cards when these numbers were first written.
#      The 29 still out are no longer "systematically the interesting ones"
#      -- the shiv generators and the poison payoffs landed in passes 1-3 --
#      but the remaining rares (Wraith Form, Nightmare, Grand Finale, Storm
#      Of Steel) still skew the missing slice toward the deck's ceiling.
#      This anchor is a floor on her, not yet a portrait.
#   2. Poison is her scaling and the scorer has no poison term at all, so a
#      Deadly Poison reads as a one-shot debuff rather than as ramp.
#   3. RESOLVED 2026-07-27 (ask A1): Ring of the Snake IS wired now, so her
#      turn-1 hand is the real character's size. The weights below were first
#      read against a hand two cards smaller.
- id: silent
  weights:
    damage: 1.0      # PLACEHOLDER. shivs and poison, not big hits
    block: 1.2       # FROZEN. do not tune.
    scaling: 1.3     # PLACEHOLDER. poison is the ramp, priced blind (see 2)
    reaction: 0.0    # applies no elements; the term is inert, said out loud
    tempo: 1.3       # PLACEHOLDER. draw/discard velocity IS the plan
    cost: 0.1
