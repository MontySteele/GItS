# Klee — real design (klee-character-design.md §3). Her cards are rows
# in docs/prototype-surface.yaml.
# Declared statline targets (±0.5): A1 4.5, A6 4.0, A3 2.0, A4 1.5.
id: klee
name: "Klee"
hp: 62
nation: mondstadt        # §4.1 reward weighting: her same-nation half
element: pyro
cadence: catalyst        # every attack applies pyro
burst_max: 40
# v1.9: the Burst is kit, not loot -- granted to hand when the meter first
# fills. The sheet's kit_card flag and this list must agree (loader checks).
# The shipped kit Burst left with the shipped sheets (legacy cleanup stage 6).
relic_hooks: [spark_on_detonation]   # Pounding Surprise
# Frontload over scaling. Ruling 3.4, restructured in round 3, and DEMOTED by
# R204 (2026-08-24): it stays BINDING DESIGN INTENT and is no longer
# mechanically asserted anywhere. It used to be HARD on starter and on the
# median across archetype decks and a warning on individual packages; it is
# now reported on every deck of every run through `axes.identity_flags` and
# gates nothing. LAW's Klee identity text is unchanged by the ruling.
constraints: ["A1_frontload>A2_scaling"]
# The kit's ten (legacy cleanup stage 6: the shipped starter, its battery
# packages and their calibration bands left with the shipped sheets).
# `loader._starter_ids` deals the same list.
starting_deck:
  - strike
  - strike
  - strike
  - strike
  - defend
  - defend
  - defend
  - defend
  - proto_ko_jumpy_dumpty
  - proto_ko_kapow
