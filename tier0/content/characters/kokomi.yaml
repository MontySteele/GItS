# Kokomi — KICKOFF ROSTER v0.1 (docs/kokomi-kickoff-v1.md governs; NOTHING
# here is ratified — statline, constants, and composition are all PROPOSED
# and [USER]-gated per kickoff §6.8. Card pool: docs/kokomi-cards.yaml;
# companions: docs/inazuma-companions.yaml).
# Declared 7-axis targets (PROPOSED): A1 1.5-2.0 (load-bearing weakness —
# she pays in cards, never in HP, and never in cheap damage), A2 ~4.5
# ELITE (Charge is the scaling identity), A3 ~3.0 (Block is her defense
# medium), A4 stays LOW by design (heals are Rare+Exhaust; the healer
# fantasy is measured by the stability band in the act sims, not by A4 —
# R51), A5 ~3.5 (assist velocity), A6 ELITE target (R51: her second
# elite axis; Weak/Vulnerable arrive as riders on exhaust/Sly engine
# pieces — engine payoffs, never a spammable cheap AoE debuff like
# Furina's commanding_gaze), A7 ~2.5 (engine assembly tax is real).
# Exactly-two-elite-axes heuristic: A2 + A6, RULED 2026-07-24 (R51).
id: kokomi
name: "Sangonomiya Kokomi"
hp: 70                   # RULED R52 (ask 8): pinned starting point —
                         # her lore HP pool; stability wants headroom.
                         # Still a knob for sim-driven tuning.
nation: inazuma          # §4.1 reward weighting: Inazuma is her half
element: hydro
cadence: catalyst        # RULED R52 (N1): she is a catalyst — every
                         # attack applies hydro. Makes elite-A6
                         # application uptime structural (R51).
burst_max: 20            # v0.4 O4 salvage (PROPOSED, plan §1.2): 10 -> 20.
                         # The meter goes back to being a real Burst now
                         # that the Kurage carries the periodic output.
                         # W2 bracket (300 runs/plan, --realistic, priest /
                         # commander act-1): meter 10 = 72/79%, 15 = 48/63%,
                         # 20 = 34/48%, 25 = 25/39%. 20 is the arm that hits
                         # the pre-registered acceptance band (35-50%) and
                         # gives the healthiest median statline (A2 5.2 vs
                         # A1 3.6 — the constraint the archetype median has
                         # to satisfy). 15 overshoots commander past the
                         # Furina-57 ceiling reference; 25 falls under band
                         # on both plans.
                         # PRIOR (v0.3, superseded): 50 -> 10 made the Burst
                         # a FAST-CYCLING metronome, her Salon-member
                         # analogue. It cleared the act-1 wall and the ratio
                         # instrument correctly read it as FRONTLOAD — the
                         # §6.4 tension. O4's thesis is that canon keeps the
                         # metronome on the summon, not the Burst.
                         # Klee=40, Furina=70. [USER] red-pen.
kit: [ceremonial_garment]   # v1.9: Burst is kit, not loot. Shape B state
                         # (ruling ask 6 — roster ships the recommended
                         # both-with-capstone world).
# Tamakushi Casket (kickoff §2.5): the two conversion laws live on the
# relic hook — exhaust->Charge (universal funnel) and Strength->Charge
# (Flawless Strategy). NO payoff magnitude here (R16).
relic_hooks: [tamakushi_casket]
# Identity constraint (kickoff §3): she is a declared scaler with a
# load-bearing frontload weakness — the inverse of Klee's law. RULED R52
# (ask 3): the Klee law was Klee-scoped all along; there is no mod-wide
# A1>A2 invariant. This per-identity constraint stands on its own.
# DEMOTED by R204 (2026-08-24): reported on every deck of every run through
# `axes.identity_flags`, asserted nowhere.
constraints: ["A2_scaling>A1_frontload"]
archetype_decks:
  commander_weighted: commander
  priest_weighted: priest
  assist_weighted: assist
# NO winrate_bands: bands are ratified artifacts (pass-3 pattern) and this
# character has had zero red-pen passes. She never carried `deck_bands`
# either, so R204's roster-wide retirement of that system took nothing from
# her -- the note is kept because "she has no bands" now means something
# different: nobody has any.
# v0.3 charge-curve pass (ask 8: composition is a knob; PROPOSED): the
# S3 arms — tide_reading -> surging_shoal (the act-1 AoE check demands a
# starter answer; 7 clears Skittish) and one tactical_recall ->
# waterspout (one exhaust TEACHER stays; the second copy becomes the
# burn that hits). Starter grid in report §6. [USER] red-pen.
# v0.4 STARTER REWORK ([USER], 2026-07-26; PROPOSED). TWELVE cards, not ten:
# the Silent shape. Two reasons, both hers. (1) Her opening deck carries
# exhaust, so a 10-card deck that mills itself risks decking out early; the
# extra two cards are the buffer. (2) Starters are SUPPOSED to be bad and
# supposed to leave — two more mediocre cards is a real dilution cost, and
# tactical_retreat's thinning is how she pays it down. That is the Silent
# bargain verbatim.
# Shape: 4 Strike + 4 Defend + 2 companions + 2 mechanic cards (Charge and
# exhaust). The two Commons that used to sit here are GONE: waterspout and
# surging_shoal. [USER] ruling: "no one starts the game with AoE; if you need
# it, you draft it" — so the AoE answer moves to the draft (both cards stay in
# the pool and surging_shoal is now a package draft-in, since a card in NO
# package is unreachable, which is the vigil defect).
starting_deck:
  - waters_edge
  - waters_edge
  - waters_edge
  - waters_edge
  - coral_guard
  - coral_guard
  - coral_guard
  - coral_guard
  - gorou_inuzaka_charge
  - sayu_daruma_gift
  - bake_kurage
  - tactical_retreat
# Run-start Inazuma ensemble (starter-reserved trio per user ruling,
# kickoff §4): Gorou / Sayu / Shinobu. The trio is THREE characters across
# the two-slot convention, so the attack slot is Gorou's alone — RULED R52
# (N3): the adjutant ALWAYS enlists, for lore reasons. The asymmetry vs
# Klee/Furina's 2x2 is intended; no fourth shortlist name.
# v0.4: the companions are now ADDITIONS (the 11th and 12th cards), not
# replacements for a basic — so Gorou sits in the authored list directly (he
# was always the only attack-slot choice), and the support slot swaps the
# authored Sayu for the Sayu-or-Shinobu roll. Same `replace` grammar, no
# schema change; the deck is 12 either way.
randomized_starter:
  support: {replace: sayu_daruma_gift, choices: [sayu_daruma_gift, shinobu_grass_ring_bond]}
packages:
  # Plausible drafts (round-3 principle), not monocultures — each carries
  # natural cross-archetype draft-ins.
  commander_weighted:
    - conscription_notice
    - conscription_notice
    - to_the_front
    - mass_mobilization
    - field_promotion
    - reinforcements
    - grand_conscription
    - moon_signal
    - pulsing_current
    - jade_bulwark
    # draft-ins a human obviously takes:
    - votive_offering
    - communion_of_tides
    - drifting_lantern
    - surging_shoal
  priest_weighted:
    - votive_offering
    - votive_offering
    - ritual_purification
    - ritual_purification
    - waterspout
    - waterspout
    - cleansing_tide
    - mercy_of_the_deep
    - pearl_barrage
    - communion_of_tides
    - depths_judgment
    - epiphany_of_the_deep
    - prayer_to_the_moon
    - nereids_ascension
    - vigil_of_the_deep
    - kurages_oath
    # (vigil was MISSING from every package in the first battery run — the
    # §2.4 identity card unreachable by any archetype deck, caught by the
    # telemetry probe's prevented=0.0 row. The Klee planned-vs-shipped gap
    # class, caught in-session. Pre-vigil numbers are labeled in the
    # report; never compare unlabeled.)
    # draft-ins:
    - jade_bulwark
    - sango_prayer
    # v0.2 sheet pass (R51 texture): the priest lane's Vulnerable setup
    # swing joins the plausible draft — a NEW measured world; never
    # compare v0.2 battery numbers against v0.1's unlabeled.
    - exposing_current
    # v0.3 charge-curve pass: the on-curve reader — the vigil lesson says
    # an identity card unreachable by any archetype deck is a defect.
    - all_streams_flow
    # v0.4 starter rework: surging_shoal left the starting deck ([USER]: AoE
    # is drafted, never started). It was in NO package, so it would have been
    # unreachable — the vigil defect again. It draft-ins here and in commander
    # below: the act-1 AoE check still has an answer, it just has to be drawn
    # for now instead of handed over.
    - surging_shoal
  assist_weighted:
    - moon_signal
    - moon_signal
    - undertow_shuffle
    - undertow_shuffle
    - drifting_lantern
    - drifting_lantern
    - rearguard_action
    # G8 (Neap Tide v2.1) merged swift_currents INTO moonlit_offering and
    # deleted the row. This list is hand-maintained and did not follow, so
    # `--deck assist_weighted` raised KeyError('swift_currents') from the day
    # the F batch landed: the assist lane's seven-axis scorecard has been
    # unrunnable ever since, silently, because nothing loads every package.
    # test_character_packages_all_build (tier0/tests) now does.
    - moonlit_offering
    # F4 bridge (Neap Tide addendum). The package is what the axes harness
    # scores, so a lane fix that is not in the package is a lane fix the
    # scorecard cannot see. One of each: the converter, the bell, the payoff.
    - ebb_tide
    - salt_line
    - undertow
    - shell_of_sanctuary
    - jade_bulwark
    - pulsing_current
    # cross-lane draft-ins (assist feeds both other lanes by design):
    - conscription_notice
    - ritual_purification
    - pearl_barrage
    # v0.2 sheet pass (R51 texture): the Sly-Vulnerable bell (new world,
    # same labeling rule as above).
    - tidal_lure
