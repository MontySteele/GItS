    - encore_performance
    - undercurrent
    # draft-ins (R16 re-author: a human takes the scaling engine first —
    # top_billing displaced courtroom_drama):
    - graceful_retreat
    - commanding_gaze
  fanfare_weighted:
    - curtain_up
    - curtain_up
    - suffering_for_art
    - dramatic_entrance
    - crowd_work
    - tempo_change
    - ebb_and_flow
    - audience_participation
    - crescendo
    - showstopper
    - florid_cadenza
    - hearts_swelling
    - rapturous_applause
    - universal_revelry
    # draft-ins:
    - poised_riposte
    - graceful_retreat
    - quick_change
  # §8 acceptance probes (watchlist configs, NOT archetype decks — the
  # melt_stack pattern):
  # Criterion 1: self-carry (pump own kit, self-Spotlight) must NOT beat
  # Salon/Spotlight at median draft quality.
  self_carry:
    - poised_riposte
    - poised_riposte
    - torrential_turn
    - crescendo
    - showstopper
    - high_tide
    - universal_revelry
    - hearts_swelling
    - curtain_up
    - suffering_for_art
    - rapturous_applause
    - star_of_the_show
    - fortissimo_guard
    - quick_change
    - macaron_break
    - deep_breath
  # Criterion 2 delete-test probe: the Spotlight deck's companions WITHOUT
  # her machinery cards. If this wins like spotlight_weighted does, the
  # companions are carrying — SUPPORT_CARRY, real failure, no carve-outs.
  spotlight_companions_only:
    - chevreuse_interdiction_fire
    - chevreuse_interdiction_fire
    - chevreuse_vanguards_valor
    - chevreuse_bursting_grenades
    - lynette_box_trick
