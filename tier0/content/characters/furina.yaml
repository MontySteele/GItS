# Furina — sheet pass 1 (furina-kickoff-v0.1.md governs; statline CLEARED
# by redpen 2026-07-20). Card pool lives in docs/furina-cards.yaml (loader
# reads the docs sheet directly; single source of truth).
# Declared 7-axis targets (kickoff §2): A1 1.0-1.5 (load-bearing weakness),
# A2 ~3.0, A3 ~2.5, A4 4.3 (elite), A5 3.7, A6 4.2 (elite), A7 ~2.0
# (declared weakness). Exactly two elite axes: A4 + A6.
id: furina
name: "Furina"
hp: 78                   # RATIFIED (R17, 2026-07-20) at 60; RAISED to 78 by
                         # sitting slate 2026-08-29: "we forgot that Furina
                         # and Kokomi are canonically HP-scalers, so it's
                         # weird to give them lower HP pools than the average
                         # of the canonical characters. Klee being low makes
                         # total sense, but Furina should probably be
                         # medium-high and Kokomi be high, relative to the
                         # base cast." Derived, not picked: base cast is
                         # Ironclad 80 / Defect 75 / Regent 75 / Silent 70 /
                         # Necrobinder 66 (game_ref/*_char_facts.yaml), median
                         # 75, top 80. "Medium-high" = above the median and
                         # below Kokomi's 80.
nation: fontaine         # §4.1 reward weighting: Fontaine is her half
element: hydro
cadence: skill           # Skill-grade (kickoff §1): only Skill/Burst-tagged
                         # cards apply hydro; engine rule in effects._element_for
burst_max: 70            # RATIFIED (R17, 2026-07-20): particles from skill
                         # tags (5), reactions (5), Salon ticks (2/member/
                         # turn), Encore spend (1/point). Klee=40, nuke~90.
fanfare: true            # Fanfare cap = FANFARE_CAP_FRACTION x maxHP
kit: [let_the_people_rejoice]   # v1.9: Burst is kit, not loot
# Ethereal Spotlight (kickoff §3.1): her starting relic adds the selector
# card to hand each turn.
relic_hooks: [ethereal_spotlight]
# Identity constraint (kickoff §2 shape): her sustain must dominate her
# frontload. DEMOTED by R204 (2026-08-24) -- it was hard on starter and the
# archetype median and a warn on packages; it is now reported on every deck of
# every run through `axes.identity_flags` and gates nothing.
constraints: ["A4_sustain>A1_frontload"]
archetype_decks:
  salon_weighted: salon
  spotlight_weighted: spotlight
  fanfare_weighted: fanfare
# NO winrate_bands yet: bands are ratified artifacts (pass-3 pattern);
# the report's winrate proposals remain proposals (salon bands proposed,
# spotlight/fanfare deliberately held until the R16 world lands). That
# system is UNAFFECTED by R204.
# R204 (2026-08-24) RETIRED the live per-axis deck-band system as acceptance
# law, roster-wide, and `deck_bands` + `stale_bands` are DELETED here with it.
# What stood here, recorded because the deletion is the whole point: A2
# ceilings salon_weighted 7.6, fanfare_weighted 4.2, spotlight_weighted 4.3,
# ratified by R19 (2026-07-20) under the lag-not-growth reading; and B4's
# (Serenitea Sweep II, 2026-07-27) three `stale_bands` annotations, which
# existed only because a band known to be wrong still fired BAND EXCEEDED on
# every Furina run -- Sweep-I E2 had re-measured all three low and in the same
# direction (salon 9.04, fanfare 5.69, spotlight 4.90). B4's interim fix was
# the flag, not the band, and it was waiting on an axis-validity session to
# re-ratify. R204 answers that wait by retiring the system instead: NO
# replacement bands are ratified, and seven-axis values are reportable
# diagnostics that may identify something to investigate and may not gate a
# merge, require re-banding, or justify moving a value.
starting_deck:
  - soloists_solicitation
  - soloists_solicitation
  - soloists_solicitation
  - stage_presence
  - stage_presence
  - stage_presence
  - regal_bearing
  - aria_of_recompense
  - salon_debut
  - an_invitation
# Run-start Fontaine ensemble, mirroring Klee's Mondstadt starter rule.
# One weak basic Attack and one basic defense are replaced on a dedicated,
# replayable RNG stream. Each of the four shortlisted characters appears in
# exactly one role: Pyro/Cryo attack choice, two defensive support textures.
randomized_starter:
  attack: {replace: soloists_solicitation, choices: [chevreuse_interdiction_fire, freminet_pers_deploy]}
  support: {replace: stage_presence, choices: [charlotte_enduring_frosthelm, lynette_enigmatic_feint]}
packages:
  # Plausible drafts (round-3 principle), not monocultures — each carries
  # natural cross-archetype draft-ins.
  salon_weighted:
    - gentilhomme_usher
    - surintendante_chevalmarin
    - mademoiselle_crabaletta
    # A12 (2026-07-28): the cap-raise power. Added the same commit the card
    # was authored, per the sheet-projections rule -- a salon card outside the
    # salon package is a card the sim is blind to, and this one changes the
    # archetype's ceiling. It moves this package's measured numbers, so every
    # salon row wants re-measuring before it is quoted.
    - casting_call
    - dinner_service
    - usher_the_waves
    - matinee_performance
    # rising_tide CUT by A4 (2026-07-28 red-pen); removed from this package
    # the same commit, per the sheet-projections rule.
    - house_call
    - torrential_turn
    - grand_salon
    - waters_embrace
    - many_waters_melody
    - endless_waltz
    - undercurrent
    - crashing_waves
    - hearts_swelling
    # draft-ins a human obviously takes:
    - graceful_retreat
    - swelling_overture
  # Guest Cast package: a mixed Companion ensemble (all share Spotlight v5),
  # plus the Spotlight machinery. Draft-gated high-ceiling; luck-gated is the
  # access-plus-machinery assembly, not same-character depth.
  spotlight_weighted:
    - chevreuse_interdiction_fire
    - chevreuse_interdiction_fire
    - chevreuse_vanguards_valor
    - chevreuse_bursting_grenades
    - lynette_box_trick
    - an_invitation
    - guest_list
    - limelight
    - stage_lights
    - shared_billing
    - top_billing
    - leading_role
    - standing_ovation
    - directors_cut
    - encore_performance
    - undercurrent
    # draft-ins (R16 re-author: a human takes the scaling engine first —
    # top_billing displaced courtroom_drama):
    - graceful_retreat
    - commanding_gaze
  fanfare_weighted:
    # COMPENSATION PASS (2026-07-28): the three new common readers replace
    # three blind Encore batteries, one for one. THE SWAP IS THE DIAGNOSIS
    # APPLIED -- this package was the evidence for it, holding six blind
    # generators and one common reader, and the sprint's whole thesis is that
    # a deck of batteries with no common-tier readers is what the 0.5% is.
    # OUT: one curtain_up (the pair was two copies of the same 0-cost blind
    # battery), ebb_and_flow, tempo_change.
    # SWAPPED, NOT ADDED, deliberately: this package is the tier-0 seven-axis
    # deck, so growing it from 17 to 20 cards would move every axis score by
    # deck size and the new cards would be credited for it. A one-for-one swap
    # keeps the count and makes the axis movement attributable to the cards.
    # THIS MOVES THE fanfare_weighted A2 BAND, which is already flagged stale
    # above and stays stale. It does NOT move the run-level fanfare winrate
    # arm: that arm DRAFTS from the pool by archetype weight, so the new
    # commons reach it through their `archetypes: [fanfare, ...]` tags and
    # would have done so with this package untouched.
    - applause_line
    - held_breath
    - breathless
    - curtain_up
    - suffering_for_art
    - dramatic_entrance
    - crowd_work
    - audience_participation
    - crescendo
    - showstopper
    - florid_cadenza
    - hearts_swelling
    - rapturous_applause
    - universal_revelry
    # draft-ins:
    - poised_riposte
    - graceful_retreat
    - quick_change
  # §8 acceptance probes (watchlist configs, NOT archetype decks — the
  # melt_stack pattern):
  # Criterion 1: self-carry (pump own kit, self-Spotlight) must NOT beat
  # Salon/Spotlight at median draft quality.
  self_carry:
    - poised_riposte
    - poised_riposte
    - torrential_turn
    - crescendo
    - showstopper
    - high_tide
    - universal_revelry
    - hearts_swelling
    - curtain_up
    - suffering_for_art
    - rapturous_applause
    - star_of_the_show
    - fortissimo_guard
    - quick_change
    - macaron_break
    - deep_breath
  # Criterion 2 delete-test probe: the Spotlight deck's companions WITHOUT
  # her machinery cards. If this wins like spotlight_weighted does, the
  # companions are carrying — SUPPORT_CARRY, real failure, no carve-outs.
  spotlight_companions_only:
    - chevreuse_interdiction_fire
    - chevreuse_interdiction_fire
    - chevreuse_vanguards_valor
    - chevreuse_bursting_grenades
    - lynette_box_trick
    - lynette_enigmatic_feint
    - charlotte_freezing_point
    - charlotte_enduring_frosthelm
    - graceful_retreat
    - commanding_gaze
