# Furina — sheet pass 1 (furina-kickoff-v0.1.md governs; statline CLEARED
# by redpen 2026-07-20). Her cards are rows in docs/prototype-surface.yaml.
# Declared 7-axis targets (kickoff §2): A1 1.0-1.5 (load-bearing weakness),
# A2 ~3.0, A3 ~2.5, A4 4.3 (elite), A5 3.7, A6 4.2 (elite), A7 ~2.0
# (declared weakness). Exactly two elite axes: A4 + A6.
id: furina
name: "Furina"
hp: 78                   # RATIFIED (R17, 2026-07-20) at 60; RAISED to 78 by
                         # sitting slate 2026-08-29: "we forgot that Furina
                         # and Kokomi are canonically HP-scalers, so it's
                         # weird to give them lower HP pools than the average
                         # of the canonical characters. Klee being low makes
                         # total sense, but Furina should probably be
                         # medium-high and Kokomi be high, relative to the
                         # base cast." Derived, not picked: base cast is
                         # Ironclad 80 / Defect 75 / Regent 75 / Silent 70 /
                         # Necrobinder 66 (game_ref/*_char_facts.yaml), median
                         # 75, top 80. "Medium-high" = above the median and
                         # below Kokomi's 80.
nation: fontaine         # §4.1 reward weighting: Fontaine is her half
element: hydro
cadence: skill           # Skill-grade (kickoff §1): only Skill/Burst-tagged
                         # cards apply hydro; engine rule in effects._element_for
burst_max: 70            # RATIFIED (R17, 2026-07-20): particles from skill
                         # tags (5), reactions (5), Salon ticks (2/member/
                         # turn), Encore spend (1/point). Klee=40, nuke~90.
fanfare: true            # Fanfare cap = FANFARE_CAP_FRACTION x maxHP
# The shipped kit Burst left with the shipped sheets (legacy cleanup stage 6).
# Her starting relic is Salon Solitaire, whose rule is `furina_stage.open_combat`;
# the shipped Ethereal Spotlight hook (a selector card each turn) is gone
# (legacy cleanup stage 6), as it is in C#.
relic_hooks: []
# Identity constraint (kickoff §2 shape): her sustain must dominate her
# frontload. DEMOTED by R204 (2026-08-24) -- it was hard on starter and the
# archetype median and a warn on packages; it is now reported on every deck of
# every run through `axes.identity_flags` and gates nothing.
constraints: ["A4_sustain>A1_frontload"]
# The kit's ten (legacy cleanup stage 6: the shipped starter, its battery
# packages and their calibration bands left with the shipped sheets).
# `loader._starter_ids` deals the same list.
starting_deck:
  - strike
  - strike
  - strike
  - strike
  - defend
  - defend
  - defend
  - defend
  - proto_fs_curtain_rise
  - proto_fs_standing_ovation
