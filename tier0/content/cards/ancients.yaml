# ANCIENT-rarity cards (R127, EB-30m) -- exactly one per roster character.
#
# `ancient` is the BASE GAME's rarity, not an invention of this repo: the
# extracted reference pools carry four of them (Break, Corruption, Suppress,
# Wraith Form) and they are already invisible to every pool for the same
# reason these three are. What is new here is the roster's own Ancients.
#
# INVISIBILITY IS THE ABSENCE, not a filter. `rarity: ancient` has no row in
# C.RARITY_ODDS, so rewards.character_pool, shop.shop_offer and the transform
# branch all skip these three for free -- exactly the way `rarity: event`
# keeps colorless_event.yaml out of every pool. That mirrors the game side,
# where reward rolls, transforms and shop inventory filter CardRarity.Ancient
# upstream in the decompiled CardFactory (tools/lint_ancient_coverage.py's
# docstring carries the citation and the softlock that produced it).
#
# THE SINGLE DOOR is the act-2 Darv event's Dusty Tome, modelled in
# tier05/content/events.yaml. It grants the character's Ancient ALREADY
# UPGRADED (C# DustyTome.AfterObtained upgrades what it grants), which is why
# tools/lint_handwritten_parity.py's ANCIENT_WITNESS reads these cards at
# their upgraded numbers. The character -> ancient map is tier0/roster.ANCIENTS,
# the sim twin of KleeCode/RosterAncientCards.cs.
#
# WHY A SIDE-SHEET AND NOT docs/<char>-cards.yaml: the C# classes are
# hand-written (JumpyDumptyMkOmega.cs, PrincessOfWatatsumi.cs,
# AllTheWorldsAStage.cs), so codegen must never see these rows -- a sheet row
# would make tools/gen_klee_cards.py try to emit a class that already exists.
# Same discipline as the ref-deck sheets beside this file. The numbers are
# therefore DOUBLE-PINNED instead: against ANCIENT_WITNESS, which reads the
# C# directly, by tier0/tests/test_eb30m_ancients.py.
#
# NO `character:` FIELD, deliberately -- see the paragraph below.
#
# THE CHARACTER-FIELD DECISION (EB-30m, resolved against the C# and the two
# engine reads that could have cared).
#
#   (a) KLEE'S PYRO -- matches, characterless. Her three random hits apply
#       Pyro through `effects._element_for`, which keys on the PLAYER's
#       cadence and element, never on `card.character`. JumpyDumptyMkOmega is
#       `IElementalCard` with `Element => Element.Pyro` and carries no
#       CharacterId at all, so an untagged row here is the exact mirror.
#
#   (b) FURINA'S SPOTLIGHT -- diverges, knowingly. `effects.is_spotlighted`
#       and `center_stage_active` DO key on `card.character`, and
#       AllTheWorldsAStage/PrincessOfWatatsumi are `ICharacterCard`. Under a
#       Center Stage designation the C# card is Spotlighted and this row is
#       not, so a drafted Spotlight-texture power (discount, first-play draw,
#       per-play Encore) will not fire on the one turn the Ancient is played.
#
# (b) is left divergent rather than bought back with a `character:` tag,
# because the tag's cost is wider than the bug: it would admit an
# acquisition-only card into every `card.character == <id>` census in the
# repo -- the pinned 76/82 pool shapes, the type quota, and Furina's
# no-passive-accrual sheet guard all read exactly that query, and each is a
# claim about the RATIFIED pool that an Ancient is deliberately outside of.
# One un-modelled Spotlight interaction on one Power card is the narrower
# cost. It is not silent: tier0/tests/test_eb30m_ancients.py pins the
# divergence so it stays a known quantity, and the trade is flagged for
# [USER] rather than settled here.

- id: jumpy_dumpty_mk_omega
  name: "Jumpy Dumpty Mk.Omega"
  cost: 2
  type: attack
  rarity: ancient         # not in RARITY_ODDS -> never offered as loot
  effects:
    # 12 x3 at RE-PICKED random targets (the `random_enemy` spec is resolved
    # per hit inside the times loop), then one 12-damage Bomb on EVERY enemy.
    # Precedent row for the attack half: klee-cards.yaml kaboom_beetle_swarm.
    - {op: damage, amount: 12, target: random_enemy, times: 3}
    - {op: place_bomb, bomb_damage: 12, target: all_enemies}

- id: princess_of_watatsumi
  name: "Princess of Watatsumi"
  cost: 1
  type: power
  rarity: ancient
  effects:
    # R127's Kokomi half: the one per-turn Charge accrual her resource law
    # otherwise bans. 3 rather than Furina's 5 because Charge is banked and
    # never spent, so it compounds against the Kurage pulse multiplier
    # instead of adding to a total.
    - {op: apply_power, power: charge_per_turn, amount: 3, target: self}

- id: all_the_worlds_a_stage
  name: "All the World's a Stage"
  cost: 1
  type: power
  rarity: ancient
  effects:
    # R127's Furina half: the per-turn Encore trickle the Encore-trickle ban
    # otherwise forbids. Its tick is pinned ABOVE the Salon upkeep in
    # effects.player_turn_start_triggers -- that ordering is EB-2's stated
    # parity target, not an accident of insertion order.
    - {op: apply_power, power: encore_per_turn, amount: 5, target: self}
