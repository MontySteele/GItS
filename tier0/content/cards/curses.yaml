# Curses (§11 event layer, 2026-07-24) -- permanent deck cards, unlike the
# combat-scoped clogs in engine/statuses.py.
#
# The distinction is the whole point. A status is injected by an enemy and
# vanishes when the fight ends (the run layer rebuilds the player from
# deck_ids each fight). A curse is added to deck_ids by an EVENT and rides the
# rest of the run, which is what makes "heal to full" options cost something.
# Without them the generous half of every event is free money and the sim
# would read events as pure upside.
#
# rarity: curse keeps them out of every draft pool for free -- rewards.py
# filters on `rarity in C.RARITY_ODDS`, and curse is not one of them. They are
# likewise never offered by shops and cannot be upgraded.
#
# Semantics are the real cards'. `character: null` on purpose: curses belong
# to nobody, and the ownership filter never sees them because the rarity check
# excludes them first.

- id: curse_clumsy
  name: "Clumsy"
  cost: 0
  type: status            # engine: type == "status" is UNPLAYABLE
  rarity: curse
  tags: [ethereal]        # exhausts from hand at end of turn (real: Ethereal)

- id: curse_guilty
  name: "Guilty"
  cost: 0
  type: status
  rarity: curse           # plain unplayable clog; it just circulates

- id: curse_poor_sleep
  name: "Poor Sleep"
  cost: 0
  type: status
  rarity: curse
  retain: true            # sticks in hand across turns -- strictly worse than
                          # a clog, because it never cycles away

- id: curse_spore_mind
  name: "Spore Mind"
  cost: 1
  type: skill             # NOT unplayable: the real card is a 1-cost Exhaust
  rarity: curse           # curse, so you may burn a whole energy to be rid of
  exhaust: true           # it. Modeled exactly: playable, does nothing, gone.

- id: curse_bad_luck
  name: "Bad Luck"
  cost: 0
  type: status
  rarity: curse
  status_eot_damage: 13   # "at the end of your turn, if this is in your Hand,
                          # lose 13 HP" -- blockable, same funnel as Burn.
                          # UNIMPLEMENTED (§10.9): Eternal (cannot be removed).
                          # Ours CAN be removed, so this curse is modeled
                          # SOFTER than the real card, not harsher.

- id: curse_decay
  name: "Rot of the Chasm"
  # RENAMED from "Decay" by R231 (2026-08-30), the S4-G11 eye-read
  # taking Grave of the Forgotten's Nameless Cairn variant. This curse
  # has exactly one grantor -- that event -- so the Liyue name is scoped
  # to it. The id, cost, type and rarity are untouched.
  cost: 0
  type: status
  rarity: curse
  # UNCERTAIN, flagged rather than guessed: StS1's Decay dealt 2 end-of-turn
  # damage, and the StS2 wiki page shows only Unplayable with no damage line.
  # Shipped as a plain clog -- the conservative read. If the real card does
  # carry the tick, this is SOFTER than real, which is the safe direction for
  # a curse we hand out.

# --- The Trial's three curses (act 3, §11.2) -------------------------------
# All three are Unplayable on the wiki. Regret carries no further keyword and
# is therefore EXACT. Shame and Doubt each list one extra keyword in their
# infobox (Frail / Weak) with no rules text anywhere on the page saying when it
# applies -- on draw? while held? at combat start? Rather than guess a trigger
# we ship them as plain clogs and say so: both are SOFTER than real, the same
# safe direction as Decay. The missing half is one line of rules text away.

- id: curse_normality
  name: "Normality"
  cost: 0
  type: status
  rarity: curse
  # Field of Man-Sized Holes' Resist branch (R82 reopened, 2026-08-10). The
  # first curse in this file whose real rules text we can express EXACTLY
  # rather than softening: "You cannot play more than 3 cards this turn" is a
  # hand-read cap (engine/state.Card.status_play_cap ->
  # combat.card_playable), not a rider on a trigger the wiki never publishes.
  # The one gap is the real card's REPLAY exemption, named at the reading
  # site -- and it errs harsh rather than soft, unlike Decay/Shame/Doubt.
  status_play_cap: 3

- id: curse_regret
  name: "Regret"
  cost: 0
  type: status
  rarity: curse           # plain unplayable clog -- EXACT, no rider to miss

- id: curse_shame
  name: "Shame"
  cost: 0
  type: status
  rarity: curse
  # UNCERTAIN: infobox also lists Frail. Trigger unpublished -> not modeled.

- id: curse_doubt
  name: "Doubt"
  cost: 0
  type: status
  rarity: curse
  # UNCERTAIN: infobox also lists Weak. Trigger unpublished -> not modeled.
