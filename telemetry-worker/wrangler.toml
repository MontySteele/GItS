# Teyvat Spire run telemetry Worker. No secrets live here.
# Deploy steps: telemetry-worker/README.md ("Deploy").
name = "gits-telemetry"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Request logging stays off: the Worker keeps nothing about a request beyond
# the row it inserts, and dashboard logs would hold request metadata.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "gits-telemetry"
# Created 2026-10-16 (`npx wrangler d1 create gits-telemetry`).
database_id = "b65c1371-9a6f-4a79-a0ab-b3e200fed7a6"
migrations_dir = "migrations"

# Per-client-IP burst limit (Workers Rate Limiting binding). The key is a hash
# of the IP; the counter lives in Cloudflare's limiter, never in D1.
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Daily retention sweep (src/index.ts, scheduled()).
[triggers]
crons = ["17 4 * * *"]

[vars]
RETENTION_DAYS = "365"
INSTALL_RUNS_PER_DAY = "60"
