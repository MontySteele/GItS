# Furina combat-layer fence config -- config #2, animation sprint 2 Track B1
# (2026-07-24).
#
# SOURCE CHOICE, recorded because it is not the obvious one. The user-supplied
# render is the Wikipedia article image (227x440, fair-use reduced at both en
# and zh; no full-resolution copy exists on that chain). The same artwork IS
# held at full resolution as art/raw/Furina_Card_2.png (1080x2160) -- but with
# the branded plate composited BEHIND it, so using it would mean building a
# matte to strip logo/emblem/border before any fencing could start. The
# shipped combat layers live in a 240x280 box, so cutting from 227x440 is a
# DOWNSCALE, not a compromise: at 280 tall she is 0.64x of source. The full-res
# twin earns its keep on the B4 stills, which need crops, not cutouts.
#
# The render is a single connected component -- zero satellites -- so the
# free-floater pass finds nothing and every boundary here is hand-fenced,
# exactly as the sprint plan predicted for a clean cutout.

character: furina
source: ImageGen/images/furina/model/furina_wikipedia_cutout.png   # 227x440
out_dir: ImageGen/images/furina/model/layers
file_prefix: furina
alpha_threshold: 16
combat_box: [240, 280]     # same box Klee ships in, and the box the static
                           # Furina combat_model.png already used
master_pad: 4
combat_pad: 2

# z-order back->front: coat_back / sword / body / hat (sprint plan B1).
# dilate_priority is front-most-wins for the shared outline pixels along a
# fence, which is the same ordering here.
layers:
  - {id: 1, name: coat_back, dilate_priority: 1}
  - {id: 2, name: sword,     dilate_priority: 2}
  - {id: 3, name: body,      dilate_priority: 3}
  - {id: 4, name: hat,       dilate_priority: 4}

# Contours below were measured off the artwork rather than eyeballed: the
# leg/coat boundary is the first navy pixel scanning out from the leg centre
# column, and the sword assembly's extent is the cyan-glow mask. Digitising
# this figure by eye failed twice (a seed landed in background, and the blade
# was traced running down-RIGHT when it actually runs down-LEFT).
fences:
  width: 3
  lines:
    # Hat + gold crown + hanging plume, cut off the hair. Enters from the
    # background gap between the ahoge curl and the crown, follows the hat's
    # underside right-and-down, then rides the plume's left edge out.
    - name: hat | body
      points: [[139, 0], [136, 12], [132, 20], [136, 30], [142, 38],
               [148, 45], [153, 51], [158, 57], [163, 62], [167, 70],
               [171, 80], [175, 92], [179, 104], [184, 116], [190, 128]]

    # Sword: the hilt / guard / hydro-emblem assembly ONLY. The thin lower
    # blade (a ~3px cyan line from (67,270) to (92,336)) is deliberately left
    # on the coat layer -- it is embedded in the coat train with navy on both
    # sides, so moving it independently would tear a 70px-long seam for an
    # element two pixels wide at combat scale. The assembly is the bright,
    # ornate, silhouette-carrying part and is what the glow-pulse reads on.
    # The assembly's left side IS the silhouette edge, so this fence
    # terminates on the image border at both ends rather than tracing a noisy
    # left leg: flood fill cannot leave the array, so the border closes it.
    - name: sword assembly (border-closed)
      points: [[0, 130], [10, 132], [20, 138], [30, 146], [36, 156],
               [41, 166], [47, 176], [52, 186], [57, 196], [62, 206],
               [66, 216], [69, 226], [72, 236], [73, 246], [71, 256],
               [66, 264], [58, 269], [40, 272], [20, 274], [0, 274]]

    # Coat train vs. body, left branch: from the background pocket under her
    # right sleeve, in to her hip, then down her right leg's measured contour
    # and out through the background gap beside her sock.
    - name: coat_back | body (left)
      points: [[46, 175], [56, 181], [66, 186], [76, 192], [86, 199],
               [92, 208],
               [94, 216], [81, 224], [83, 232], [86, 240], [89, 248],
               [92, 256], [95, 264], [97, 272], [100, 280], [107, 288],
               [110, 296], [112, 308], [113, 318], [112, 326],
               # Cut LEFT across her ankle: the coat's lower column (navy,
               # x 88-112) touches her sock ruffle in the contiguous run at
               # y 328-336, and that join is the one place the body flood can
               # reach the train's left lobe -- it goes down the leg, across
               # the feet, and back up. Below y~338 coat and sock are already
               # separated by background, so the fence exits there.
               [107, 331], [99, 335], [93, 341], [88, 347], [82, 352]]

    # Coat train vs. body, right branch: down her left side from above the
    # train's right lobe, then her left leg's measured contour, exiting where
    # the lobe ends and the leg becomes the silhouette edge (~y 302).
    - name: coat_back | body (right)
      points: [[157, 154], [153, 164], [151, 174], [149, 184], [148, 194],
               [140, 204], [138, 212], [136, 220], [139, 228], [140, 236],
               [136, 244], [133, 252], [131, 260], [129, 268], [129, 276],
               [133, 284], [137, 292], [140, 300], [144, 302], [150, 306]]

seeds:
  - {layer: hat,       at: [155, 30]}
  - {layer: sword,     at: [40, 205]}    # the hydro emblem
  - {layer: body,      at: [130, 90]}    # her hair
  - {layer: coat_back, at: [60, 290]}    # the train's left lobe
  - {layer: coat_back, at: [170, 215]}   # the train's right lobe

unreached_layer: body     # enclaves cut off from every seed stay with her

# The render is one connected component; the satellite pass has nothing to do.
# Declared explicitly so the tool does not error on an undeclared satellite if
# a future re-cut of this source produces one.
satellites:
  low_saturation_layer: body
  saturation_threshold: 35
  other_layer: body

# Sized for the idle amplitudes in klee-mod/pck-src/furina/model/combat.tscn.
# A layer is inpainted only under the layers IN FRONT of it (z is
# coat_back < sword < body < hat), because those are the only ones that can
# uncover it when they move. The coat's counter-sway is the big mover, so it
# gets the deepest fill; the sword's motion is carried by a glow pulse rather
# than travel, so a shallow fill is ample.
fill_behind:
  - {layer: coat_back, radius: 14, covered_by: [sword, body]}
  - {layer: sword,     radius: 8,  covered_by: [body]}
  - {layer: body,      radius: 6,  covered_by: [hat]}
