# Azhdaha -- bespoke boss rig, motion pass two.
#
# Three layers. HEAD is the front head, the red eyes and the golden crest, in
# the lower left; BODY is the crystalline back filling the middle and upper
# left; TAIL is the branch-like growth reaching into the top right corner.
#
# Coordinates are specific to this plate revision
# (ImageGen/images/teyvat/creature_visuals/azhdaha.png, 240x280). If the plate
# is re-cut, re-digitize.

character: azhdaha
source: ImageGen/images/teyvat/creature_visuals/azhdaha.png
out_dir: ImageGen/images/teyvat/creature_visuals/azhdaha/layers
file_prefix: azhdaha
layer_path: "{name}.png"
manifest_path: tools/combat_layer_fences/teyvat/azhdaha.layers.json
alpha_threshold: 16
# The layers stack back up to the plate exactly (`--verify` gates on it).
recompose_exact: true
master_pad: 4

# Declared BACK TO FRONT: a Godot sibling drawn later is drawn in front, and
# the head overlaps the back it grows out of.
layers:
  - {id: 1, name: body, dilate_priority: 1}
  - {id: 2, name: tail, dilate_priority: 2}
  - {id: 3, name: head, dilate_priority: 3}

fences:
  width: 3
  lines:
    - name: body | tail (under the branch)
      points: [[108, 70], [132, 52], [158, 44], [186, 50], [204, 64],
               [216, 84], [226, 104], [239, 116]]
    - name: body | head (over the crest and along the snout)
      points: [[0, 152], [25, 141], [52, 140], [78, 150], [102, 166],
               [118, 186], [130, 206], [150, 212], [170, 214], [186, 222],
               [190, 240], [186, 260], [180, 279]]

seeds:
  - {layer: head, at: [40, 200]}
  - {layer: tail, at: [135, 25]}
  - {layer: body, at: [60, 90]}

unreached_layer: body

# One free-floating island, a chip of the back at x[135,152] y[151,162].
satellites:
  low_saturation_layer: body
  saturation_threshold: 1000
  other_layer: body

fill_behind:
  - {layer: body, radius: 10, covered_by: [head, tail], min_cover_alpha: 255}
