# The All-Devouring Narwhal -- bespoke boss rig, motion pass two.
#
# Three layers. BODY is the whale itself, head and horn to the left; FLUKE is
# the tail curling into the top right; FIN is the long lower fin sweeping
# across the bottom.
#
# Coordinates are specific to this plate revision
# (ImageGen/images/teyvat/creature_visuals/all_devouring_narwhal.png, 240x280).
# If the plate is re-cut, re-digitize.

character: all_devouring_narwhal
source: ImageGen/images/teyvat/creature_visuals/all_devouring_narwhal.png
out_dir: ImageGen/images/teyvat/creature_visuals/all_devouring_narwhal/layers
file_prefix: all_devouring_narwhal
layer_path: "{name}.png"
manifest_path: tools/combat_layer_fences/teyvat/all_devouring_narwhal.layers.json
alpha_threshold: 16
# The layers stack back up to the plate exactly (`--verify` gates on it).
recompose_exact: true
master_pad: 4

layers:
  - {id: 1, name: body,  dilate_priority: 1}
  - {id: 2, name: fluke, dilate_priority: 2}
  - {id: 3, name: fin,   dilate_priority: 3}

fences:
  width: 3
  lines:
    - name: body | fluke (the tail root)
      points: [[168, 0], [172, 28], [176, 56], [182, 84], [192, 106],
               [206, 122], [222, 132], [239, 138]]
    - name: body | fin (the lower fin root)
      points: [[0, 246], [30, 236], [62, 226], [96, 220], [130, 218],
               [162, 222], [190, 232], [214, 246], [239, 258]]

seeds:
  - {layer: body,  at: [120, 120]}
  - {layer: fluke, at: [210, 40]}
  - {layer: fin,   at: [120, 250]}

unreached_layer: body

satellites:
  low_saturation_layer: body
  saturation_threshold: 1000
  other_layer: body

fill_behind:
  - {layer: body, radius: 10, covered_by: [fluke, fin], min_cover_alpha: 255}
