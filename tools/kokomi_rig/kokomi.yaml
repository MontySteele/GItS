# Kokomi's combat scene. `python -m tools.kokomi_rig gen` turns this file plus
# the committed frame manifest (tools/char_render/kokomi_frames.json, written
# by tools/char_render/pack.py) into klee-mod/pck-src/kokomi/model/combat.tscn
# and merchant_character.tscn, byte-identically on every run.
#
# THE CONTRACT this file must keep is the router's (CreatureAnimationRouter.cs):
# Visuals/Facing, Bounds, CenterPos, IntentPos, AnimationPlayer, AnimationTree,
# the seven states. Every state plays a frame sheet of the official model
# (tools/char_render/kokomi_clips.py, phase A, 2026-10-14); Furina's scene
# (tools/furina_rig) is the template. Phase A has no signature clip: card
# clips wait until her build is final.
#
# THE MODEL. `sheets` are the Sprite2D children of Visuals/Facing/Model, back
# to front. Each frame is an AtlasTexture (region = its rect on its page,
# margin = its offset in the clip's cell). `fx.attack` is the water jet off
# her open hand, a neutral heat layer over the attack that
# KleeMod.Vfx.ElementTrail colours (Hydro at rest).
model:
  sheets: [idle, idle_low, attack, hurt, death, cast]

# Animations. A track drives one property of the model:
#   model: a path under Visuals/Facing/Model ("" is Model itself)
#   keys:  [[time, value, transition?], ...]   (transition: Godot easing)
#
# THE CLOCK is the rendered one: every clip's length is its manifest length
# (attack 1.0 s, hurt 0.8, death 2.2, cast 1.0), inside the base skeletons'
# census (Klee's paper: attack 0.93-1.5 s, cast 0.97-1.8, hurt 0.73-1.0, die
# 1.87-4.17).
animations:
  idle:
    length: 2.8
    loop: true
    sheet: idle

  idle_low:
    length: 3.0
    loop: true
    sheet: idle_low
    tracks:
      - {model: "", prop: modulate, keys: [[0, [0.92, 0.9, 0.9, 1]], [3.0, [0.92, 0.9, 0.9, 1]]]}

  # The push of water from her open hand: the hit lands at full extension
  # (frame 8, 0.4 s).
  attack:
    length: 1.0
    sheet: attack

  hurt:
    length: 0.8
    sheet: hurt
    tracks:
      - {model: "", prop: modulate, keys: [[0, [1, 1, 1, 1]], [0.05, [1, 0.45, 0.4, 1]], [0.35, [1, 1, 1, 1]]]}

  # She sinks to her knees, held from 1.6 s, then fades as the other kits do.
  death:
    length: 2.2
    sheet: death
    tracks:
      - {model: "", prop: modulate, keys: [[0, [1, 1, 1, 1]], [0.12, [1, 0.62, 0.6, 1]], [0.6, [1, 1, 1, 1]], [1.7, [1, 1, 1, 1]], [2.2, [1, 1, 1, 0]]]}

  # A plan set in motion: the far hand lifted, calling the tide.
  cast:
    length: 1.0
    sheet: cast

  power:
    length: 1.0
    sheet: cast
    tracks:
      - {model: "", prop: modulate, keys: [[0, [1, 1, 1, 1], 0.5], [0.38, [1.1, 1.3, 1.5, 1], 1.6], [1.0, [1, 1, 1, 1]]]}
