# Klee's combat scene. `python -m tools.klee_rig gen` turns this file plus the
# committed frame manifest (klee_frames.json, written by tools/klee_render/
# pack.py) into klee-mod/pck-src/klee/model/combat.tscn, byte-identically on
# every run.
#
# THE CONTRACT this file must keep is the router's (CreatureAnimationRouter.cs):
# Visuals/Facing, Bounds, CenterPos, IntentPos, AnimationPlayer, AnimationTree,
# the seven states plus `setoff`. Every state plays a frame sheet of the
# official model on the base game's clock (below).
#
# Until 2026-10-13 this file also specified a Skeleton2D rig of the old
# floating-bombs splash (bones, skin rules, five cut layers), which `setoff`
# cross-faded to. The owner retired it: "I tried doing a Set off that
# triggered the old splash art, and I regret keeping that around - let's pivot
# to animations based on the new model instead." git keeps it (the commit
# that made this change).

# ---------------------------------------------------------------------------
# THE MODEL (milestone 2, 2026-10-12). Klee is drawn from frame sheets
# rendered off the official model (tools/klee_render; the model itself never
# enters the repo). `sheets` are the Sprite2D children of Visuals/Facing/Model,
# back to front; their cells, counts, times and feet anchors come from the
# committed manifest klee_frames.json. A state names the sheet it plays
# (`sheet`), at the times the renderer drew; a one-shot longer than its frames
# holds the last one.
# ---------------------------------------------------------------------------
model:
  sheets: [idle, idle_low, attack, hurt, death, cast, setoff]

# ---------------------------------------------------------------------------
# Animations. A track drives one property of the model:
#   model: a path under Visuals/Facing/Model ("" is Model itself)
#   keys:  [[time, value, transition?], ...]   (transition: Godot easing)
#
# THE CLOCK is the base game's (review/active/klee-visual-paper-2026-10-12.md,
# from the census of the five base skeletons): attack ~1.0 s, cast ~1.0 s,
# hurt ~0.8 s, death ~2.0 s, loops at their rendered length. Cross-fades are
# on the state machine (rig.py xfade).
# ---------------------------------------------------------------------------
animations:
  idle:
    length: 2.0
    loop: true
    sheet: idle

  idle_low:
    length: 2.4
    loop: true
    sheet: idle_low
    tracks:
      - {model: "", prop: modulate, keys: [[0, [0.92, 0.88, 0.88, 1]], [2.4, [0.92, 0.88, 0.88, 1]]]}

  attack:
    length: 1.0
    sheet: attack

  hurt:
    length: 0.8
    sheet: hurt
    tracks:
      - {model: "", prop: modulate, keys: [[0, [1, 1, 1, 1]], [0.05, [1, 0.45, 0.4, 1]], [0.35, [1, 1, 1, 1]]]}

  death:
    length: 2.0
    sheet: death
    tracks:
      - {model: "", prop: modulate, keys: [[0, [1, 1, 1, 1]], [0.12, [1, 0.62, 0.6, 1]], [0.6, [1, 1, 1, 1]], [1.5, [1, 1, 1, 1]], [2.0, [1, 1, 1, 0]]]}

  cast:
    length: 1.0
    sheet: cast

  power:
    length: 1.0
    sheet: cast
    tracks:
      - {model: "", prop: modulate, keys: [[0, [1, 1, 1, 1], 0.5], [0.38, [1.45, 1.2, 0.85, 1], 1.6], [1.0, [1, 1, 1, 1]]]}

  # Set Off: a hop with both fists thrown up in a cheer, eyes squeezed happy
  # (clips.SETOFF), landing back in stance A. One clip per Set Off play: the
  # router absorbs the attack/cast the same play sends (AbsorbedBy).
  setoff:
    length: 0.85
    sheet: setoff
