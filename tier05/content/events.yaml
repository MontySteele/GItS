# Event pool (§11). Source + full 46-event catalogue:
# docs/archive/sts2-map-and-events-research.md §2, docs/sts2-events-harvest.txt.
#
# CURATION RULE: an event ships only if every one of its options is expressible
# with real ops. No option is ever approximated to get an event in -- the
# skipped list is at the bottom of this file and in the research doc §3, and
# skipping loudly is the house rule. Numbers are the wiki's, exactly.
#
# Effect grammar (tier05/events.py):
#   heal: N            heal N HP (capped at max)
#   heal_frac: F       heal F of MISSING hp (1.0 = to full)
#   hp: -N             lose N HP (can kill; that is the real game's rule)
#   max_hp: +-N        move max HP (hp follows a loss down)
#   gold: [lo, hi]     gain (or lose, if negative) gold, rolled in the band
#   gold_all: true     lose ALL gold
#   card_reward: N     an ordinary reward screen, N offers, drafter picks
#   card_screens: N    N INDEPENDENT reward screens ("gain 2 card rewards")
#   pick_cards: {of: M, take: N}   choose N of M random pool cards
#   add_card: <id>     add one NAMED card (an event-only colorless card)
#   add_ancient: true  add THIS character's Ancient, UPGRADED (the Dusty
#                      Tome; map is tier0/roster.ANCIENTS). Carrying this key
#                      also gates the whole event: a character with no
#                      Ancient never rolls it (events.pool_for)
#   random_card: {type: t, cost: c, n: N}   add N random pool cards matching
#                      the filter; the option is LOCKED if nothing matches
#   remove: N          remove N cards (worst-first, drafter's valuation)
#   upgrade: N         upgrade N cards (on-plan first)
#   upgrade_random: N  upgrade N RANDOM cards (the escalating-ladder shape)
#   downgrade_random: N   un-upgrade N random upgraded cards
#   duplicate_deck: true  append a copy of the whole deck (resolves FIRST)
#   transform: N       remove N cards, add N random of the same rarity
#   transform_starter_into: <id>   choose ONE STARTER card (rarity basic) and
#                      transform it into the NAMED card, IN PLACE. Distinct
#                      from `transform:` in both halves: the victim comes from
#                      the starters only, and the replacement is named rather
#                      than rolled. LOCKED when no starter is left
#                      (tier05/events.py::_starter_targets, which also records
#                      how that lock is narrower than the game's event-level
#                      one). EB-83, Wood Carvings
#   curse: <id>        add a curse to the deck
#   relic: N           grant N random relics from the run's relic pool
#                      (`true` means 1)
#   relic_id: <id>     grant one NAMED relic from the closed event pool
#   potion: N          grant N random potions (slot-permitting)
#   spend_potion: true requires a held potion; consumes it
#   requires_gold: N   option is unavailable below N gold
#   escalate: <id>     after resolving, offer this event again (the ladder)
#   enchant: {name: n, amount: X}   attach the NAMED enchantment to one deck
#                      card, permanently (R82 reopened, [USER] 2026-08-10).
#                      The vocabulary is tier0/content/enchantments.CATALOG
#                      and it holds exactly the names these events grant. The
#                      TARGET is the drafter's best legal card, where legal =
#                      the enchantment's own type rule (Sharp wants an
#                      Attack, Soul's Power wants a card that Exhausts) and
#                      the base game's "one enchantment per card, never
#                      replaced". No legal target LOCKS the option, which is
#                      the rule the wiki states on these events verbatim.
#   if_no_enchant_target: true   offer this option only when every enchant
#                      option on the event is locked (Self-Help Book's
#                      "Move On is only available if you have no valid cards")
#
# Event-level keys:
#   hidden: true       reachable only by `escalate`, never rolled directly
#   also_acts: [N,..]  ALSO appears in these (1-based) acts. For the real
#                      events that span acts without being all-acts events.
#   variants: [{name, options}, ...]   one event that randomly selects one
#                      sub-scenario per visit (The Trial's three trials).
#                      Exactly one variant is rolled at the visit.

act1:
  - id: jungle_maze_adventure
    name: "Jungle Maze Adventure"
    options:
      - {label: "Solo Quest", gold: [135, 165], hp: -18}
      - {label: "Join Forces", gold: [35, 65]}

  - id: tablet_of_truth
    name: "Tablet of Truth"
    # The escalating ladder, exactly: -3 / -6 / -12 / -24 max HP, each buying
    # one random upgrade. Stage 5 (all-but-1 max HP for a whole-deck upgrade)
    # is SKIPPED, flagged: it needs an "all but 1" max-HP op and is a
    # degenerate branch no sane policy takes.
    options:
      - {label: "Smash", heal: 20}
      - {label: "Decipher", max_hp: -3, upgrade_random: 1,
         escalate: tablet_of_truth_2}

  - id: tablet_of_truth_2
    name: "Tablet of Truth (stage 2)"
    hidden: true                      # reachable only by escalation
    options:
      - {label: "Give Up"}
      - {label: "Decipher", max_hp: -6, upgrade_random: 1,
         escalate: tablet_of_truth_3}

  - id: tablet_of_truth_3
    name: "Tablet of Truth (stage 3)"
    hidden: true
    options:
      - {label: "Give Up"}
      - {label: "Decipher", max_hp: -12, upgrade_random: 1,
         escalate: tablet_of_truth_4}

  - id: tablet_of_truth_4
    name: "Tablet of Truth (stage 4)"
    hidden: true
    options:
      - {label: "Give Up"}
      - {label: "Decipher", max_hp: -24, upgrade_random: 1}

  - id: brain_leech
    name: "Brain Leech"
    also_acts: [2]                    # Overgrowth + Underdocks + Hive
    # APPROXIMATION, flagged: "Rip the Leech Off" gives a COLORLESS card
    # reward on the wiki. We have no colorless loot pool (the two colorless
    # cards we author are event-only), so it draws from the character pool
    # like any other screen. Shape right, colour wrong.
    options:
      - {label: "Share Knowledge", pick_cards: {of: 5, take: 1}}
      - {label: "Rip the Leech Off", hp: -5, card_reward: 3}

  - id: room_full_of_cheese
    name: "Room Full of Cheese"
    also_acts: [2]                    # Overgrowth + Underdocks + Hive
    options:
      - {label: "Gorge", pick_cards: {of: 8, take: 2}}
      # The Chosen Cheese (+1 max HP at end of combat) is not a relic we
      # model, so this option grants a plain random relic instead -- the ONE
      # substitution in this file, and it is flagged rather than silent.
      - {label: "Search", hp: -14, relic: true}

  - id: wellspring
    name: "Wellspring"
    options:
      - {label: "Bottle", potion: 1}
      - {label: "Bathe", remove: 1, curse: curse_guilty}

  - id: unrest_site
    name: "Unrest Site"
    options:
      - {label: "Rest Anyways", heal_frac: 1.0, curse: curse_poor_sleep}
      - {label: "Kill the Trees", max_hp: -8, relic: true}

  - id: whispering_hollow
    name: "Whispering Hollow"
    options:
      - {label: "Exchange Gold", gold: [-50, -50], potion: 2,
         requires_gold: 50}
      - {label: "Hug the Tree", hp: -9, transform: 1}

  - id: morphic_grove
    name: "Morphic Grove"
    options:
      - {label: "Group", gold_all: true, transform: 2}
      - {label: "Loner", max_hp: 5}

  - id: aroma_of_chaos
    name: "Aroma of Chaos"
    options:
      - {label: "Let Go", transform: 1}
      - {label: "Maintain Control", upgrade: 1}

  - id: byrdonis_nest
    name: "Byrdonis Nest"
    # "Take the Egg" gives a quest card, which we do not model -- so only the
    # Eat option ships and the event is a one-option floor. Flagged in §3.
    options:
      - {label: "Eat the Egg", max_hp: 7}

  - id: sapphire_seed
    name: "Sapphire Seed"
    # R82 REOPENED ([USER], 2026-08-10, M7). The event resists drama rather
    # than mapping: both options are pure upside and the only tension is
    # now-versus-later, which is exactly the trade the HP valuation is built
    # to read (heal + upgrade, or a permanent per-card Energy refund).
    # `sown` takes no amount -- the wiki prints no number on it.
    options:
      - {label: "Consume", heal: 9, upgrade: 1}
      - {label: "Plant and Nourish", enchant: {name: sown}}

  - id: luminous_choir
    name: "Luminous Choir"
    options:
      - {label: "Reach into the Flesh", remove: 2, curse: curse_spore_mind}
      - {label: "Offer Tribute", gold: [-149, -99], relic: true,
         requires_gold: 149}

  - id: wood_carvings
    name: "Wood Carvings"
    # EB-68's LAST unconverted event, converted 2026-09-02 under EB-83. It was
    # in the skip list below for eleven months of repo time on three separate
    # blockers, and every one of them had to be cleared by somebody else
    # first:
    #
    #   Bird and Torus name two BASE-GAME colorless cards (Peck, Toric
    #     Toughness). Design principles §4.7 forbids shipping those, and R184
    #     ([USER], 2026-08-12) ruled RESKIN rather than amending §4.7 -- so
    #     they arrive as `tengu_flurry` and `chinju_ward`, function-for-
    #     function and number-for-number, named at the R231 eye-read
    #     (2026-08-30). Both rows and their decompiled citations are in
    #     tier0/content/cards/colorless_event.yaml.
    #   Torus additionally needed an ENGINE op nothing had: "gain that much
    #     Block at the start of your next 2 turns" is two numbers, and
    #     `block_next_turn` is a one-shot bank. `block_at_turn_start` was
    #     built FIRST AND ALONE for it on EB-82's admission rule (2026-08-26)
    #     and has been inert since; `chinju_ward` is its first printed
    #     carrier.
    #   Snake grants SLITHER, which randomises a card's cost on draw. That
    #     hook was built alone in the same window and stayed out of the
    #     enchantment CATALOG on that module's own rule -- a row serves a
    #     granting event, and this is the granting event.
    #
    # THE OPTIONS ARE THE HARVEST'S, verbatim (docs/sts2-events-harvest.txt
    # line 430), and the labels are the base game's rather than the gallery's
    # Teyvat reskins -- the gallery is a flavor artifact for [USER]'s eye and
    # every other row in this file carries the harvest's own label.
    #
    # NO OPTION IS APPROXIMATED. Snake's lock is the wiki's own parenthetical
    # ("Locked if no cards can be enchanted with Slither") and falls out of
    # `_enchant_targets` for free; the two transform branches carry the same
    # lock shape on their own rule.
    options:
      - {label: "Bird", transform_starter_into: tengu_flurry}
      - {label: "Snake", enchant: {name: slither}}
      - {label: "Torus", transform_starter_into: chinju_ward}

# --- act 2: the Hive ------------------------------------------------------
# Brain Leech and Room Full of Cheese also land here via `also_acts`, so the
# reachable act-2 pool is 5 own/shared + 3 all-acts.
#
# The Hive is the act the admission rule bites hardest: 8 of its 21 events are
# built on Enchant, Divine, Debt, quest cards or named relics whose effects
# need hooks we do not have. Every one of them is named in the skip list at the
# bottom with the SPECIFIC missing mechanic, so the list reads as a backlog
# rather than an apology.
act2:
  - id: colossal_flower
    name: "Colossal Flower"
    # The gold ladder. Each rung forfeits the previous rung's nectar, so the
    # payouts are alternatives, not a running total: 35 / 75 / 135, at 5 / 6 /
    # 7 HP. The bottom of the ladder is Pollinous Core, which we can express
    # EXACTLY (every 4 turns, draw 2 -- an existing hook), which is the only
    # reason this event ships at all.
    options:
      - {label: "Extract Nectar", gold: [35, 35]}
      - {label: "Reach Deeper", hp: -5, escalate: colossal_flower_2}

  - id: colossal_flower_2
    name: "Colossal Flower (level 2)"
    hidden: true
    options:
      - {label: "Extract Nectar", gold: [75, 75]}
      - {label: "Reach Deeper", hp: -6, escalate: colossal_flower_3}

  - id: colossal_flower_3
    name: "Colossal Flower (level 3)"
    hidden: true
    options:
      - {label: "Extract Nectar", gold: [135, 135]}
      - {label: "Enter the Center", hp: -7, relic_id: pollinous_core}

  - id: infested_automaton
    name: "Infested Automaton"
    # Two forced draws from disjoint slices of the character's own pool. Both
    # options lock themselves if the slice is empty, which is the real rule
    # and matters here: a character with no Power cards genuinely cannot take
    # Study.
    options:
      - {label: "Study", random_card: {type: power}}
      - {label: "Touch the Core", random_card: {cost: 0}}

  - id: bugslayer
    name: "Bugslayer"
    # Both cards are published with exact numbers and are authored in
    # tier0/content/cards/colorless_event.yaml. KNOWN LIMITATION: the HP
    # valuation scores any named card at a flat CARD_HP, so the pick falls to
    # the drafter's own tiebreak -- and its static-power term saturates for
    # both of these. The card that lands is therefore near-arbitrary even
    # though the card itself is exact. Visible, not hidden.
    options:
      - {label: "Learn Extermination Technique", add_card: exterminate}
      - {label: "Learn Squash Technique", add_card: squash}

  - id: field_of_man_sized_holes
    name: "Field of Man-Sized Holes"
    # R82 REOPENED ([USER], 2026-08-10, M7). Both branches are now exact.
    # Enter Your Hole is Perfect Fit, which is a SHUFFLE placement rather
    # than an on-play rider -- it rides `enchant_top_of_draw` at the engine's
    # two shuffle sites (combat.surface_innate and
    # state.shuffle_discard_into_draw), sharing innate's placement.
    # Resist adds Normality, and Normality is the first curse in
    # tier0/content/cards/curses.yaml expressed EXACTLY rather than softened:
    # its 3-card turn cap is a real hand read, not a guessed trigger.
    options:
      - {label: "Enter Your Hole", enchant: {name: perfect_fit}}
      - {label: "Resist", remove: 2, curse: curse_normality}

  - id: stone_of_all_time
    name: "Stone of All Time"
    # R82 REOPENED ([USER], 2026-08-10, M7). "Lose a random potion" is
    # `spend_potion` -- which is exactly a random held potion, consumed for
    # real (NC-8 / R116) -- so Drink and Lift locks itself when the bag is
    # empty, the real rule. Push is Vigorous 8 on an Attack: a first-play-
    # per-combat flat rider, which is why it needed its own field rather
    # than the shipped flat one.
    options:
      - {label: "Drink and Lift", spend_potion: true, max_hp: 10}
      - {label: "Push", hp: -6, enchant: {name: vigorous, amount: 8}}

  - id: symbiote
    name: "Symbiote"
    also_acts: [3]                    # Hive + Glory, per the wiki's own line
    # R82 REOPENED ([USER], 2026-08-10, M7). Corrupted is the one enchantment
    # in the converted set that is a COST as well as a gain: +50% damage on
    # the card, 2 HP every time it is played. The HP half rides the shipped
    # `enchant_effects` list (a self-damage row, Inky's pipe); the damage
    # half needed a multiplier. The option valuation cannot see the recurring
    # HP cost -- it prices an enchantment as one upgrade, flat -- so this
    # option reads slightly better to the policy than it plays. Stated here
    # rather than corrected with an invented number.
    options:
      - {label: "Approach", enchant: {name: corrupted}}
      - {label: "Kill with Fire", transform: 1}

  - id: darv
    name: "Darv"
    # THE SINGLE ANCIENT DOOR (R127 / EB-30m). The Ancient met at the start
    # of an act; his event rolls the Dusty Tome roughly half the time, and
    # the Tome draws a random Ancient-rarity card from YOUR OWN pool and
    # grants it already upgraded. Reward rolls, transforms and shop inventory
    # all filter Ancient rarity out upstream, so this is the only way one of
    # those three cards ever enters a deck.
    #
    # MODELLED MINIMALLY, and that is a statement rather than a shortcut: the
    # event BODY is base-game (Darv and DustyTome live in the decompiled
    # core, not in klee-mod/), so the repo has no authored text, cost or boon
    # table to copy. What the mod owns -- and what this row therefore
    # mirrors exactly -- is the grant: RosterAncientCards.cs says which card,
    # DustyTome.AfterObtained says it arrives upgraded. The real event offers
    # a choice of three boons of which the Tome is one; here it is one take
    # and one walk-away, so the ~50% Tome roll is NOT modelled and this pool
    # entry is strictly more generous than the game. Logged, not hidden: the
    # boon table is the thing to add when the base-game side is extracted.
    #
    # Darv also appears in the act-3 pool in the real game. Filed here only
    # until the act-3 half is authored, because a run must not be able to
    # meet the Tome twice and hold two Ancients.
    options:
      - {label: "Accept the Dusty Tome", add_ancient: true}
      - {label: "Leave"}

# --- act 3: Glory ---------------------------------------------------------
# Still the thinnest pool -- 3 own + 3 all-acts -- and the reason is a
# finding, not an oversight: Glory's events are relic-shaped. Five of its
# eight pay out in a named event relic (Forgotten Soul, Big Mushroom,
# Fragrant Mushroom, Royal Poison, History Course), and under the no-
# substitution rule an event whose relic we cannot express exactly does not
# ship. Forgotten Soul is the first of those five to convert (EB-82, its hook
# built first as unused machinery); the other four are ONE hook away each and
# are itemised in the skip list. Act 3 is still where the event layer is most
# worth extending next.
act3:
  - id: grave_of_the_forgotten
    name: "Grave of the Forgotten"
    # EB-82. Both branches are exact, and neither invents anything:
    #   Accept  -> Forgotten Soul, "whenever you Exhaust a card, deal 1 damage
    #     to a random enemy". The relic is admitted under the `event:` header
    #     rule in relics.yaml because `damage_per_exhaust` was BUILT FIRST
    #     (2026-08-12) and is dispatched from the one exhaust funnel -- this
    #     conversion arms an existing hook rather than inventing one inline.
    #   Confront -> Decay plus Soul's Power ("this card loses Exhaust"), which
    #     un-sets a printed field and needs no engine surface at all.
    # The wiki's lock -- "Confront is locked if you have no cards with Exhaust
    # that can be Enchant" -- is NOT a special case here: it falls out of the
    # enchantment's own eligibility rule, which `available` already enforces
    # for every enchant option (`_enchant_targets` empty -> option dropped).
    # Decay is the shipped plain clog, SOFTER than real if the base card does
    # carry StS1's end-of-turn tick (curses.yaml says so at the row).
    # KNOWN, not corrected: the valuation prices the relic at a flat RELIC_HP
    # and cannot see that Forgotten Soul is worth far more to an Exhaust deck
    # than to any other, exactly as it cannot tell one named card from
    # another. Inventing a per-relic number here would be a tune.
    # FLAVOR: RULED (R231, 2026-08-30) at the S4-G11 eye-read. The conversion
    # takes the gallery's variant 1, THE NAMELESS CAIRN (Liyue / Wangsheng
    # Funeral Parlor): the two option labels below, the relic renamed
    # "Lingering Soul" (relics.yaml, event: header) and the curse renamed
    # "Rot of the Chasm" (tier0 curses.yaml). Both of those rows have exactly
    # one grantor -- this event -- so the rename is scoped to it. No mechanic,
    # id, cost or effect moved; this is a NAME pass only.
    options:
      - {label: "Accept the Lingering Soul", relic_id: forgotten_soul}
      - {label: "Recite the True Name", curse: curse_decay,
         enchant: {name: souls_power}}

  - id: the_trial
    name: "The Trial"
    # One event, three sub-trials, one rolled per visit (see `variants` in
    # events.py). Every verdict is a curse-for-payout trade, which is what
    # makes this the act's best test of whether curses are priced right.
    variants:
      - name: "Merchant Trial"
        options:
          - {label: "DECIDE: Guilty", curse: curse_regret, relic: 2}
          - {label: "DECIDE: Innocent", curse: curse_shame, upgrade: 2}
      - name: "Noble Trial"
        options:
          - {label: "DECIDE: Guilty", heal: 10}
          - {label: "DECIDE: Innocent", curse: curse_regret, gold: [300, 300]}
      - name: "Nondescript Trial"
        options:
          - {label: "DECIDE: Guilty", curse: curse_doubt, card_screens: 2}
          - {label: "DECIDE: Innocent", curse: curse_doubt, transform: 2}

  - id: reflections
    name: "Reflections snoitcelfeR"
    # Downgrade resolves before upgrade, the order the wiki states -- so a
    # card knocked down by the first half can be picked back up by the second.
    # Shatter is the single most violent deck op in the game and the reason
    # `duplicate_deck` values at exactly zero: doubling a deck copies its bad
    # cards too and dilutes every draw, so the attached curse is what actually
    # decides the option.
    options:
      - {label: "Touch a Mirror", downgrade_random: 2, upgrade_random: 4}
      - {label: "Shatter", duplicate_deck: true, curse: curse_bad_luck}

# --- all acts -------------------------------------------------------------
all:
  - id: this_or_that
    name: "This or That?"
    options:
      - {label: "This", hp: -6, gold: [57, 57]}
      - {label: "That", curse: curse_clumsy, relic: true}

  - id: slippery_bridge
    name: "Slippery Bridge"
    # "the card in the above option is randomized" -- i.e. pay 3 HP to re-roll
    # which card the removal targets. Modeled as: take the offered removal, or
    # pay 3 HP for the drafter's own worst-card choice.
    options:
      - {label: "Overcome", remove_random: 1}
      - {label: "Hold On", hp: -3, remove: 1}

  - id: self_help_book
    name: "Self-Help Book"
    # R82 REOPENED ([USER], 2026-08-10, M7). An all-acts event (research §2.1;
    # the harvest page states no location) and the purest test of the enchant
    # op: no HP, no gold, no numbers at all -- three enchantments on their own
    # eligibility rules and a null branch whose availability is the INVERSE of
    # theirs. Each reading is offered only while a legal target for ITS
    # enchantment is still in the deck, and Move On appears only when none of
    # the three has one, which is the `if_no_enchant_target` key.
    #
    # EB-85 (2026-08-13) moved two of the three gates, because tier0's rules
    # were narrower than the game's: Nimble is not Skill-only (any card that
    # GainsBlock) and Swift has no card restriction whatsoever. "Read the
    # Entire Book" is therefore live on essentially every deck now, where it
    # used to need a Power -- Klee's printed starter has none, so that
    # reading was unreachable at run start for the whole of RUNTEMPLATE 10.
    #
    # KNOWN LIMITATION, measured not assumed (400 klee runs, seed 0-399):
    # every enchantment prices at a flat ENCHANT_HP, so all three readings
    # score identically and the tie falls to declaration order -- Sharp wins
    # every time a deck holds an Attack, which is every time. Nimble and
    # Swift are therefore reachable content that the POLICY never reaches,
    # exactly the shape of the Bugslayer note above. The fix is a per-
    # enchantment valuation, which is a tuning decision with no measurement
    # behind it yet; visible here rather than papered over with a number.
    options:
      - {label: "Read the Back", enchant: {name: sharp, amount: 2}}
      - {label: "Read a Random Passage", enchant: {name: nimble, amount: 2}}
      - {label: "Read the Entire Book", enchant: {name: swift, amount: 2}}
      - {label: "Move On", if_no_enchant_target: true}

  - id: the_future_of_potions
    name: "The Future of Potions?"
    options:
      - {label: "Insert Potion", spend_potion: true, card_reward: 3,
         upgraded: true}
      - {label: "Leave"}

# --- SKIPPED, and why (research doc §3) ----------------------------------
# NO SUBSTITUTIONS RULE (§11.2): where an event pays out a NAMED relic we
# cannot express, the event is skipped -- it does not fall back to "a random
# relic". The one pre-existing exception is Room Full of Cheese above, which
# shipped before this rule and is flagged in place. Every entry below names
# the specific missing mechanic, so this list is an engine backlog with
# per-item costs, not a shrug.
#
# Enchant IS a mechanic we have, as of R82 reopened ([USER], 2026-08-10, M7).
#     Five of the seven enchant events converted this pass and are in the
#     pools above: Sapphire Seed (act 1), Field of Man-Sized Holes,
#     Stone of All Time, Symbiote (act 2 / act 2+3), Self-Help Book (all).
#     The vocabulary is tier0/content/enchantments.CATALOG -- NINE named
#     enchantments, exactly the ones these events grant, no registry and no
#     enchantment economy. Two events did NOT convert in that pass, and
#     neither was blocked on Enchant. BOTH HAVE SINCE CONVERTED, so all seven
#     enchant events are in the pools above and this paragraph is history:
#   Grave of the Forgotten   CONVERTED (EB-82, act 3 above). It was blocked
#       on a RELIC and not on the enchant op: its Accept branch hands out
#       Forgotten Soul -- "whenever you Exhaust a card, deal 1 damage to a
#       random enemy" -- and the admission rule (see the `event:` header in
#       tier05/content/relics.yaml) forbids inventing the hook inline. So
