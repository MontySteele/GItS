# The common relic pool (relic-content pass). Real StS2 wiki numbers, each
# expressed as a list of relic_effects dicts keyed by `hook` (mirroring the
# card DSL's `op` idiom). Combat-scoped hooks are consumed by
# tier0/engine/relics.py off Player.relic_effects; run-scoped hooks are applied
# in tier05/relics.py + tier05/model.py. See MEMORY / workflow spec.
#
# LAYER BOUNDARY: nothing here touches the frozen tier0 battery. Battery players
# carry no relic_effects, so every relic code path is a dead branch there.

# --- COMMON pool: shared by both characters (the reward/loot pool). ----------
common:
  anchor:
    name: "Anchor"
    effects:
      - {hook: combat_start_block, amount: 10}

  vajra:
    name: "Vajra"
    effects:
      - {hook: combat_start_power, power: strength, amount: 1}

  blood_vial:
    name: "Blood Vial"
    effects:
      - {hook: combat_start_heal, amount: 2}

  lantern:
    name: "Lantern"
    effects:
      - {hook: combat_start_energy, amount: 1}

  bag_of_preparation:
    name: "Bag of Preparation"
    effects:
      - {hook: combat_start_draw, amount: 2}

  bag_of_marbles:
    name: "Bag of Marbles"
    effects:
      - {hook: combat_start_enemy_power, power: vulnerable, amount: 1}

  red_mask:
    name: "Red Mask"
    effects:
      - {hook: combat_start_enemy_power, power: weak, amount: 1}

  festive_popper:
    name: "Festive Popper"
    effects:
      - {hook: combat_start_aoe, amount: 9}

  gorget:
    name: "Gorget"
    # `plating` already exists in refpowers.py -- combat_start_power routes it
    # through powers.apply_power like any other power.
    effects:
      - {hook: combat_start_power, power: plating, amount: 4}

  happy_flower:
    name: "Happy Flower"
    effects:
      - {hook: every_n_turns_energy, n: 3, amount: 1}

  pendulum:
    name: "Pendulum"
    effects:
      - {hook: every_n_turns_draw, n: 3, amount: 1}

  centennial_puzzle:
    name: "Centennial Puzzle"
    effects:
      - {hook: on_first_hp_loss_draw, amount: 3}

  strike_dummy:
    name: "Strike Dummy"
    # substring match against card id OR name (engine folds it in before
    # strength/vulnerable). Lowercase 'strike' matches our snake_case ids.
    effects:
      - {hook: card_name_damage_bonus, substring: strike, amount: 3}

  # --- run-scoped commons (applied in tier05, never handed to combat) --------
  strawberry:
    name: "Strawberry"
    effects:
      - {hook: on_pickup_maxhp, amount: 7}

  amethyst_aubergine:
    name: "Amethyst / Aubergine"
    effects:
      - {hook: gold_per_fight, amount: 15}

  meal_ticket:
    name: "Meal Ticket"
    effects:
      - {hook: shop_heal, amount: 15}

  regal_pillow:
    name: "Regal Pillow"
    effects:
      - {hook: post_rest_heal, amount: 15}

  venerable_tea_set:
    name: "Venerable Tea Set"
    effects:
      - {hook: post_rest_energy, amount: 2}

  war_paint:
    name: "War Paint"
    # upgrade 2 random Skills on pickup (run-layer deck op).
    effects:
      - {hook: pickup_upgrade, kind: skill, count: 2}

  whetstone:
    name: "Whetstone"
    effects:
      - {hook: pickup_upgrade, kind: attack, count: 2}

  book_of_five_rings:
    name: "Book of Five Rings"
    effects:
      - {hook: book_of_five_rings, per: 5, heal: 20}

  potion_belt:
    name: "Potion Belt"
    # Deferred from W1. Run-scoped: on pickup it raises the run's held-potion
    # capacity by 2 (handled in tier05/relics.py + model.py). Inert unless the
    # run also grants potions -- a grant_relics-only run holds it harmlessly.
    effects:
      - {hook: potion_slots, amount: 2}

  red_skull:
    name: "Red Skull"
    # Ironclad-ONLY: while at/below 50% max HP, +3 Strength. Combat-scoped
    # conditional_power; owner-gated so a non-Ironclad holder gets nothing.
    owner: [ref_ironclad, real_ironclad]
    effects:
      - {hook: conditional_power, power: strength, amount: 3, when: hp_below, threshold: 0.5}

# --- NEOW persistent relics (define now; the run-start PICK is W2). ----------
neow:
  booming_conch:
    name: "Booming Conch"
    # On ELITE fights only: model injects combat_start_draw + combat_start_energy
    # into that fight's effects.
    effects:
      - {hook: elite_combat_start, draw: 2, energy: 1}

  fishing_rod:
    name: "Fishing Rod"
    # Every 3rd normal (N) combat won: upgrade a random upgradable deck card.
    effects:
      - {hook: fishing_rod, per: 3}

  golden_pearl:
    name: "Golden Pearl"
    effects:
      - {hook: gold_on_pickup, amount: 150}

  # --- W2: three more CODEABLE Neow boons so pick-1-of-3 is meaningful. Only
  # positive, codeable boons are added -- curse/transform/colorless/cross-
  # character boons are OUT OF SCOPE this pass (unshipped mechanics; logged
  # here rather than faked) and are deliberately absent from the pool.
  ossified_relic:
    name: "Ossified Relic"          # Neow max-HP boon
    effects:
      - {hook: on_pickup_maxhp, amount: 8}

  hand_of_greed:
    name: "Hand of Greed"           # bigger gold boon (> golden_pearl's 150)
    effects:
      - {hook: gold_on_pickup, amount: 250}

  astrolabe:
    name: "Astrolabe"               # "gain a random Common relic" at pickup
    effects:
      - {hook: grant_random_common}

# --- ANCIENT boons (§10.1, RATIFIED 2026-07-23): the act-boundary pick. -----
# After each NON-FINAL act boss the Ancient heals 100% of missing HP (that
# part is structural, in tier05/model.py) and offers a 1-of-3 pick from this
# pool. Representative sample of the REAL StS2 Act-2/3 Ancient boons (wiki
# harvest 2026-07-23, docs/archive/act2-act3-roster-research.md), ratified sampling
# rule: only boons that map 1:1 onto EXISTING hooks. Transform / UI-choice /
# card-content boons are out of scope (skip-loudly, §10.9). Wiki caveat: the
# 100%-missing-HP heal number is from the Mobalytics guide; the wiki proper
# confirms the choice-of-3 but not the heal fraction.
ancient:
  sand_castle:
    name: "Sand Castle"             # Orobas (Act 2): upgrade 6 random cards
    effects:
      - {hook: pickup_upgrade, count: 6}

  touch_of_orobas_klee:
    name: "Touch of Orobas"         # Orobas (Act 2): upgrade your STARTER relic
    # MODELLED NARROWLY AND ON PURPOSE ([USER] ruling 2026-07-26, option 1).
    # Vanilla's Touch of Orobas swaps the starting relic for an upgraded form,
    # so what it DOES depends entirely on who holds it -- there is no single
    # effect to model. Rather than build a relic-upgrade table for three known
    # cases, each character's variant is its own owner-gated entry: this row,
    # `touch_of_orobas_kokomi` and `touch_of_orobas_furina` below. The day
    # there is a FOURTH roster character wanting one is the day the table
    # earns itself; three siblings that share no effect vocabulary do not.
    #
    # Klee's upgraded form is Dodoco Tales (displayed as "Explosive Frags"
    # until R69 renamed it off the card): her per-detonation Spark income
    # is UNCHANGED (the relic keeps the base behaviour) and she banks a fixed
    # opening windfall. The doubling that was tried first was rejected at
    # red-pen -- it compounds with every bomb in the deck, where this dilutes
    # across a long fight. Measured before ratification, act-2 acquisition,
    # generous case: spark +2.3pt, demolition +7.1, reaction +5.0.
    owner: [klee]
    effects:
      - {hook: combat_start_spark, amount: 3}

  touch_of_orobas_kokomi:
    name: "Pearl of Insight"        # Orobas (Act 2): Kokomi's upgraded starter
    # Sibling of touch_of_orobas_klee above; same ruling, same narrow shape.
    # C# `PearlOfInsightRelic` (klee-mod/KleeCode/Relics/UpgradedStarterRelics.cs).
    #
    # DOUBLED PER-EXHAUST ACCRUAL, and it REPLACES the base rate rather than
    # adding to it -- the funnel picks one value or the other
    # (`KokomiResourceHooks.ExhaustCharge/ExhaustBurst`), so these are RATES,
    # not riders. CHARGE_PER_EXHAUST 1 -> 2 and KOKOMI_BURST_PER_EXHAUST 2 -> 4.
    #
    # RATIFIED INVARIANT (R190, 2026-08-13): the doubling is PERMANENT and
    # holds in BOTH engines. The two amounts below are literals -- YAML cannot
    # compute -- so they are PINNED rather than derived, by
    # tools/lint_constant_parity.py's INVARIANTS block, which asserts each is
    # exactly 2x its tier0 base constant and fails the build otherwise. The C#
    # side is now a literal too (`PearlOfInsightRelic`), MIRRORED against these
    # rows by value, so the whole chain is checked: C# literal == this row ==
    # 2x tier0 base.
    #
    # BEFORE R190 NOTHING CHECKED THE MIDDLE OF THAT CHAIN. C# derived its
    # numbers by expression, this file wrote them as literals, and the parity
    # lint filed both C# members under UNMIRRORED as underivable -- so moving a
    # base constant moved the mod and left the sim granting the old rate, with
    # no gate anywhere. EB-74's §3f found the hole while costing lever-2
    # candidate B (CHARGE_PER_EXHAUST 1 -> 2), which is precisely the change
    # that would have walked into it. Anyone moving a base rate now moves four
    # numbers and the lint says so.
    #
    # Shape UNLIKE Klee's on purpose, and the difference is the C#'s, not a
    # modelling choice: hers is a RATE where his is a windfall. The rate that
    # was rejected at red-pen was a rate on a DETONATION economy, which
    # compounds with every bomb in the deck; an exhaust rate is paid once per
    # card the deck spends and is bounded by the deck's own card economy.
    #
    # A no-op with a lying tooltip until EPOCH 2 / D1 (audit sec.1.1): these
    # constants existed C#-side and were read by nothing except the relic's own
    # description string, so the panel promised doubled accrual and the funnel
    # granted the base rate. The sim half is this row; the engine reads it at
    # the funnel (tier0/engine/relics.py `exhaust_accrual`), never restating
    # the numbers at the grant site, which is how the two came to disagree.
    #
    # The companion reward slot rides along UNCHANGED and needs no row here:
    # it is a C#-side card-reward hook with no tier05 counterpart, and the sim
    # never removes a starter's own hooks.
    owner: [kokomi]
    effects:
      - {hook: charge_per_exhaust, amount: 2}
      - {hook: burst_per_exhaust, amount: 4}

  touch_of_orobas_furina:
    name: "The Curtain Never Falls"  # Orobas (Act 2): Furina's upgraded starter
    # Sibling of the two rows above. RATIFIED 2026-07-26 as red-pen ruling R2,
    # a [USER] design superseding all three worksheet options and deliberately
    # OVERRIDING the sprint's "no new behaviour in a starter upgrade" rule by
    # user authority. C# `CurtainNeverFalls`
    # (klee-mod/KleeCode/Relics/UpgradedStarterRelics.cs).
    #
    # THE ONLY ROW IN THIS FILE WITH NO NUMBER, because the relic has none: it
    # is a FLAG. Every gate lives in C# `SpotlightSystem`, keyed off
    # `BothModes`, and the sim mirrors that shape -- the hook carries no
    # amount and `tier0/engine/relics.py spotlight_both_modes` is the single
    # place the four Spotlight readers ask about it. A relic that is a flag
    # cannot drift from the system that reads it.
    #
    # WHAT IT DOES, all three halves ruled together:
    #   1. Both Spotlight modes permanently in force -- her cards mint Fanfare
    #      (Center Stage) AND Companions are multiplied (Guest Cast).
    #   2. R2 reading 1 ([USER], ruled during implementation): the upgrade
    #      removes the modes' EXCLUSIVITY, never their TARGETING. No numeric
    #      boost leaks onto her own cards and her Companions still mint no
    #      Fanfare. What she gains is that she never has to choose.
    #   3. Conditions keying off "moved the Spotlight this turn" are ALWAYS
    #      ON. Not a side effect -- with the selector gone there is no
    #      designation event left to move, so without it every selector-payoff
    #      card on her sheet would become dead text the moment the relic was
    #      taken, and the upgrade would silently subtract from her pool.
    # And the cost, which is real: THE SELECTOR CARD STOPS ARRIVING. With both
    # modes on it has nothing left to choose.
    #
    # THIS ROW CLOSES A GAP THE C# RECORDED AGAINST ITSELF. `CurtainNeverFalls`
    # shipped saying "SIM PARITY: NOT MODELLED ... tier05 has no Spotlight-mode
    # model to make always-on", so a tier-0.5 Furina never received the upgrade
    # and its value was unpriced. The premise was the inaccurate half: tier0
    # models the modes exactly (`Player.spotlight`, one designation at a time),
    # and what was missing was not a model but the always-on read.
    owner: [furina]
    effects:
      - {hook: spotlight_both_modes}

  yummy_cookie:
    name: "Yummy Cookie"            # Tezcatara (Act 2): upgrade 4 cards
    effects:
      - {hook: pickup_upgrade, count: 4}

  very_hot_cocoa:
    name: "Very Hot Cocoa"          # Tezcatara (Act 2): +4 energy at combat start
    effects:
      - {hook: combat_start_energy, amount: 4}

  paels_blood:
    name: "Pael's Blood"            # Pael (Act 2): +1 draw at each turn start
    effects:
      - {hook: every_n_turns_draw, n: 1, amount: 1}

  prismatic_gem:
    name: "Prismatic Gem"           # +1 energy at each turn start
    # The real pools carry THREE +1-energy-per-turn boons (Prismatic Gem /
    # Blessed Antler / Philosopher's Stone) -- the class that replaces STS1's
    # energy boss-relics. The shipped sample had none, which the Ironclad-0.6%
    # diagnosis (2026-07-23) measured as the single largest player-power
    # distortion in the 3-act world. Prismatic Gem is the one whose rider
    # ("card rewards show other colors") is faithfully a no-op in a
    # single-character pool, so it maps 1:1 onto the existing hook -- the
    # ratified sampling rule. Antler (3 Dazed at combat start) and Stone
    # (enemies +1 Str) need new hooks: §10.9 backlog, never faked.
    effects:
      - {hook: every_n_turns_energy, n: 1, amount: 1}

  looming_fruit:
    name: "Looming Fruit"           # Nonupeipe (Act 3): +31 max HP
    effects:
      - {hook: on_pickup_maxhp, amount: 31}

  signet_ring:
    name: "Signet Ring"             # Nonupeipe (Act 3): +999 gold
    effects:
      - {hook: gold_on_pickup, amount: 999}

  diamond_diadem:
    name: "Diamond Diadem"          # Nonupeipe (Act 3): 20 block at combat start
    # UNIMPLEMENTED (§10.9): the real Diadem's block survives into the next
    # turn; modeled as plain start-of-combat block.
    effects:
      - {hook: combat_start_block, amount: 20}

# --- EVENT relics (§11.2). A closed pool: never rolled as loot, never offered
# by Neow or an Ancient. The ONLY way to hold one is an event option naming it
# (`relic_id:` in tier05/content/events.yaml), which is the real game's rule --
# each of these has exactly one source event.
#
# ADMISSION RULE, and it is strict: an event relic ships only if its published
# effect maps onto a hook the engine ALREADY honors. Nothing here gets a new
# hook, and no event ever substitutes a generic relic for a named one -- an
# event whose relic we cannot express is skipped, and events.yaml names the
# missing hook. That list is currently longer than this one; see §11.2.
event:
  pollinous_core:
    name: "Pollinous Core"          # Colossal Flower (Hive), Enter the Center
    # "Every 4 turns, it will draw 2 additional cards at the start of the
    # turn." -> every_n_turns_draw fires on turn % n == 0, i.e. turns 4/8/12.
    # EXACT: no rider, no approximation.
    effects:
      - {hook: every_n_turns_draw, n: 4, amount: 2}

# --- SKIP: relics whose mechanic tier0 lacks. NOT faked -- listed here so the
# loader emits a loud UNIMPLEMENTED warning naming the missing mechanic, and
# get_relic() refuses to hand back a hollow relic. (House rule: never
# approximate a DSL gap silently.)
skip:
  bronze_scales:
    name: "Bronze Scales"
    # REASON UPDATED 2026-07-27 (Silent coverage pass), on the same precedent
    # as oddly_smooth_stone below: "Thorns power (retaliation damage) is
    # absent from tier0" went stale the moment ThornsPower landed in
    # refpowers.on_damage_received, and a stale skip reason is the quiet lie
    # this list exists to prevent. The mechanic gap is closed; what remains
    # is the same [USER] ruling, because un-skipping arms a relic and moves
    # the tier 0.5 measurement world.
    missing: "Thorns now exists (2026-07-27); un-skipping is a [USER]
      ruling because it arms a relic and moves the tier 0.5 world"
  oddly_smooth_stone:
    name: "Oddly Smooth Stone"
    # REASON UPDATED 2026-07-27 (Silent anchor C-3), on juzu_bracelet's
    # precedent: the old text -- "Dexterity power (block scaling) is absent
    # from tier0" -- went stale the moment Dexterity landed in
    # powers.modify_block_gained, and a stale skip reason is the quiet lie
    # this list exists to prevent. The MECHANIC gap is closed and the hook it
    # would need (combat_start_power) already exists. What remains is not a
    # gap at all: un-skipping arms a knob that changes the tier 0.5
    # measurement world, and that is a [USER] ruling, not a side effect of
    # a parity pass. It stays skipped until ruled -- see the Silent anchor
    # sprint log's open asks.
    missing: "Dexterity now exists (2026-07-27); un-skipping is a [USER]
      ruling because it arms a relic and moves the tier 0.5 world"
  juzu_bracelet:
    name: "Juzu Bracelet"
    # REASON UPDATED (§11.2). The old text -- "no ?-room / non-combat events
    # exist in the run model" -- went stale the moment §11 shipped Unknown
    # rooms and events, and a stale skip reason is the quiet lie this list
    # exists to prevent. The real remaining gap is narrower: Unknown rooms
    # resolve in maps.resolve_unknown, which has no channel to the run's held
    # relics, so nothing a relic says can bias the pity table.
    missing: "held relics have no channel into maps.resolve_unknown"
