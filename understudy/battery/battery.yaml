# THE REQUALIFICATION BATTERY — M62 (5), pass mark R223. See
# `understudy/qualify.py` for what each category asks; the pass mark is the
# `threshold:` block at the foot of this file and it is [USER]'s, not the
# tool's.
#
# EVERY ITEM IS A SEALED PACKET FROM A CLOSED ROUND. Nothing here stages a
# board, launches a game or writes into the turn directory it names; the
# packets are read-only inputs (R101b) and the battery's own output lands
# elsewhere. FOUR closed rounds contribute, and both characters do, so a seat
# cannot qualify by having been tuned on one character's vocabulary:
#
#   kokomi-slice1   (Companions, R213 E1 r1)  — 4 items, all in costs
#   kokomi-slice2   (Charge, R213 E1)         — 6 items, targets and intent
#   klee-slice1-r3  (Sparks, R213 E2 r3)      — 2 items, targets
#   klee-sparks-r1  (the alt-cost re-author)  — 6 items, all three categories
#
# Ten Kokomi boards to eight Klee ones, and no category is single-character
# except `costs`, for the reason its rule states below.
#
# HOW THE BOARDS WERE PICKED, so a later reader can add to the set on the same
# rule rather than by taste:
#
#   targets — the hand must hold BOTH an aimed card and a card that aims at
#     nobody, or the item can only be failed in one direction and "always name
#     an enemy" would pass it.
#   costs   — THE LEDGER'S QUESTION, and this rule is R232's (2026-08-30). A
#     board qualifies when its packet hands the per-play bank/price chain
#     something concrete to be wrong about:
#       (a) the packet prints an ENERGY BANK in its `## You` block. The
#           ledger's first `energy_before` and every link after it are scored
#           against that number, so a board without one asks nothing.
#       (b) the hand prints at least TWO DISTINCT NON-ZERO COSTS THAT ARE
#           JOINTLY AFFORDABLE out of that bank. A real line then moves the
#           bank by two DIFFERENT amounts — a chain, not a single subtraction,
#           and not a reader who subtracts the same number twice by reflex and
#           happens to land right.
#       (c) across the six, BOTH SPARK SHAPES APPEAR: at least two boards
#           where the packet prints a Spark bank, so the Spark half of every
#           entry is scored (chain, never negative), and at least two where it
#           prints none, so the Spark half is required NULL and a reader who
#           invents a bank fails.
#     WHAT THIS RULE REPLACED, and why the six moved (`EB-211`, ruled by
#     R232). The old rule asked only that the hand print two non-zero costs,
#     "so a 'free' claim has something to be wrong about" — written for a
#     check that could only fire on a POSITIVE misread in prose. The category
#     gained a second half on 2026-08-30: a per-play price ledger scored
#     against the printed costs and the printed bank, so silence FAILS. Four
#     of the old six do not ask that question. `kokomi-slice2-t02` and `-t06`
#     print an Energy bank of 2 against costs of 1, 1, 1 and 2, so no two
#     DIFFERENT prices are jointly payable; `klee-slice1-r3-t03` and `-t04`
#     print no non-zero cost but 1, and the whole round prints none — every
#     line over them reads 2 -> 1 -> 0, which a reflex-subtractor gets right
#     without reading anything. They are preserved below as the
#     `free-claim-regression` set and are NOT scored.
#     THE ROUND MIX IS THE PRICE OF THE RULE, stated rather than smoothed.
#     Klee's printed vocabulary is cheap — Sparks are her second currency, so
#     her hands are mostly 0s and 1s — and only two sealed Klee boards in the
#     record clear (b) at all. Both are here, and they are the two that carry
#     the Spark bank. The Klee vocabulary is carried battery-wide by `targets`
#     (four of six) and `intent` (two of six).
#   intent  — the packet must TELEGRAPH an attack (`misreads.intent_damages`
#     is non-empty), so question four has a telegraph to be sensitive to.
#
# Six per category is the floor `qualify.MIN_ITEMS_PER_CATEGORY` enforces.
#
# THE PASS MARK IS PER CATEGORY, NOT A TOTAL, so a seat cannot buy a blind
# spot back with the two categories it still reads: targets is the one that
# returned the seat (`EB-203`), and it is scored at par.

items:
  # ------------------------------------------------------------- targets ---
  - {id: T1, category: targets, turn_id: kokomi-slice2-t01,
     why: "2 aimed, 2 targetless in one hand"}
  - {id: T2, category: targets, turn_id: kokomi-slice2-t05,
     why: "2 aimed, 2 targetless in one hand"}
  - {id: T3, category: targets, turn_id: klee-slice1-r3-t05,
     why: "one aimed card among three that aim at nobody"}
  - {id: T4, category: targets, turn_id: klee-slice1-r3-t06,
     why: "one aimed card among three that aim at nobody"}
  - {id: T5, category: targets, turn_id: klee-sparks-r1-t03,
     why: "2 aimed, 3 targetless; the AoE sinks are the trap"}
  - {id: T6, category: targets, turn_id: klee-sparks-r1-t07,
     why: "3 aimed, 1 targetless — the board EB-203 was found on"}

  # --------------------------------------------------------------- costs ---
  # R232 (2026-08-30) re-picked these six against the ledger's question. Two
  # of the old six meet it and were KEPT; the four that did not are in the
  # regression set below.
  - {id: C1, category: costs, turn_id: kokomi-slice1-t03,
     why: "bank 3; six priced cards and NOT ONE free, so every entry has to
       move the bank, and Ring 2 + Water's Edge 1 spends it exactly"}
  - {id: C2, category: costs, turn_id: kokomi-slice1-t05,
     why: "bank 3; the same hand with the Rare printed at 3 — 1+2, or the
       Rare alone, so 'minus one each play' is wrong two different ways"}
  - {id: C3, category: costs, turn_id: kokomi-slice1-t06,
     why: "bank 3; two FREE cards among four priced, so the chain has to hold
       the bank still across a 0-cost play and still pay 1 then 2"}
  - {id: C4, category: costs, turn_id: kokomi-slice1-t09,
     why: "bank 3; one free card, Itto at 2 beside four 1s — a zero step and
       two different prices in the same line"}
  - {id: C5, category: costs, turn_id: klee-sparks-r1-t04,
     why: "bank 3, SPARK 3; four priced cards none free, Oath 2 + Kaboom 1 is
       the whole bank, and the printed Spark bank makes the Spark half live —
       kept from the old six"}
  - {id: C6, category: costs, turn_id: klee-sparks-r1-t05,
     why: "bank 3, SPARK 1; Oath 2 beside two 1s and a free Ka-pow, over a
       Spark bank of ONE — a Spark chain that goes negative fails here —
       kept from the old six"}

  # -------------------------------------------------------------- intent ---
  - {id: I1, category: intent, turn_id: kokomi-slice2-t03,
     why: "a telegraphed attack"}
  - {id: I2, category: intent, turn_id: kokomi-slice2-t04,
     why: "a telegraphed attack"}
  - {id: I3, category: intent, turn_id: kokomi-slice2-t07,
     why: "a telegraphed attack"}
  - {id: I4, category: intent, turn_id: kokomi-slice2-t08,
     why: "a telegraphed attack"}
  - {id: I5, category: intent, turn_id: klee-sparks-r1-t01,
     why: "a telegraphed attack on the opening board"}
  - {id: I6, category: intent, turn_id: klee-sparks-r1-t08,
     why: "a telegraphed attack on the second dry-bank board"}

# ---------------------------------------------------------------------------
# THE FREE-CLAIM REGRESSION SET — the `costs` six AS THEY STOOD before R232,
# kept whole and LABELLED, not deleted.
#
# WHAT THEY ARE. Six boards picked under the old rule: the hand prints at
# least two non-zero costs, so a reader who volunteers "X is free" has
# something to be wrong about. That is exactly what `misreads.free_card_
# misreads` still checks, and the check still ships as the FIRST half of
# `score_costs`. These are the sharpest boards in the record for that half,
# and deleting them would throw away the only curated evidence of what the
# category used to catch.
#
# WHAT THEY ARE NOT. THEY ARE NOT SCORED, AND THEY DO NOT COUNT TOWARD R223'S
# MARK. `qualify.load_battery` reads `items:` and nothing else, so a battery
# run never sees this list; `qualify.load_regression` reads it for a caller
# that wants it by name, and `tier0/tests/test_seat_instruments.py` pins the
# separation in both directions. R232, on the re-pick: "Preserve the old six
# as a labeled 'free-claim regression' set if useful, but remove them from
# R223 qualification scoring."
#
# `C5` and `C6` above are the two of these six that also meet the new rule and
# were kept in the battery. They appear twice on purpose: this list is the OLD
# SELECTION AS IT STOOD, and editing the survivors out of it would make it a
# different record.
free_claim_regression:
  - {id: X1, category: costs, turn_id: kokomi-slice2-t02,
     why: "four priced cards, none free"}
  - {id: X2, category: costs, turn_id: kokomi-slice2-t06,
     why: "four priced cards, none free"}
  - {id: X3, category: costs, turn_id: klee-slice1-r3-t03,
     why: "two priced cards beside a 0-cost one"}
  - {id: X4, category: costs, turn_id: klee-slice1-r3-t04,
     why: "two priced cards beside a 0-cost one"}
  - {id: X5, category: costs, turn_id: klee-sparks-r1-t04,
     why: "four priced cards; the Spark bank invites a 'free' claim"}
  - {id: X6, category: costs, turn_id: klee-sparks-r1-t05,
     why: "three priced cards; the Rare Power is short of its price"}

# ---------------------------------------------------------------------------
# THE PASS MARK — R223 (2026-08-29). [USER], answering the pick list (every
# category >= 5/6 | total >= 15/18 | targets 6/6 and the other two >= 4/6),
# verbatim: "targets 6/6, others >= 4/6 works for me".
#
# All three must hold. There is no total, and no trading one category off
# against another.
#
# COSTS STAYS AT 4 THROUGH R232 (2026-08-30), deliberately and on the record.
# The ledger made the category materially harder, and R232 then re-picked its
# six boards on top of that; moving the mark in the same step would have
# changed the boards AND the bar at once, and a failure afterwards would be
# impossible to attribute. R232: "I would not raise the threshold
# simultaneously: the ledger test is already materially harder, and changing
# both the boards and the pass mark would make any failure difficult to
# interpret. Keep 4/6 for the first properly selected run, then revisit only
# with accumulated evidence." The revisit is therefore EVIDENCE-gated, not
# scheduled: it wants runs against these six, not an argument.
threshold:
  owner: R223
  targets: 6
  costs: 4
  intent: 4
