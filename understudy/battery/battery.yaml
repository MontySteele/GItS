# THE REQUALIFICATION BATTERY — M62 (5), pass mark R223. See
# `understudy/qualify.py` for what each category asks; the pass mark is the
# `threshold:` block at the foot of this file and it is [USER]'s, not the
# tool's.
#
# EVERY ITEM IS A SEALED PACKET FROM A CLOSED ROUND. Nothing here stages a
# board, launches a game or writes into the turn directory it names; the
# packets are read-only inputs (R101b) and the battery's own output lands
# elsewhere. Three rounds contribute equally so a seat cannot qualify by
# having been tuned on one character's vocabulary:
#
#   kokomi-slice2   (Charge, R213 E1)      — 2 items per category
#   klee-slice1-r3  (Sparks, R213 E2 r3)   — 2 items in two categories
#   klee-sparks-r1  (the alt-cost re-author) — 2 items per category
#
# HOW THE BOARDS WERE PICKED, so a later reader can add to the set on the same
# rule rather than by taste:
#
#   targets — the hand must hold BOTH an aimed card and a card that aims at
#     nobody, or the item can only be failed in one direction and "always name
#     an enemy" would pass it.
#   costs   — the hand must print at least two non-zero costs, so a "free"
#     claim has something to be wrong about.
#     THIS RULE IS OWED A RE-PICK (`EB-211`, 2026-08-30). The category gained
#     a second half — a per-play price ledger scored against the printed costs
#     and the printed bank, so silence FAILS — and these six were picked for
#     the first half alone. Which sealed boards best ask "can this reader track
#     a bank across a line", and whether R223's mark of 4 survives a category
#     twice as hard, are [USER]'s: the write-up is
#     `review/active/klee-sparks-2026-08-29.md` section 26. Nothing below was
#     swapped in the meantime and all six remain scorable.
#   intent  — the packet must TELEGRAPH an attack (`misreads.intent_damages`
#     is non-empty), so question four has a telegraph to be sensitive to.
#
# Six per category is the floor `qualify.MIN_ITEMS_PER_CATEGORY` enforces.
#
# THE PASS MARK IS PER CATEGORY, NOT A TOTAL, so a seat cannot buy a blind
# spot back with the two categories it still reads: targets is the one that
# returned the seat (`EB-203`), and it is scored at par.

items:
  # ------------------------------------------------------------- targets ---
  - {id: T1, category: targets, turn_id: kokomi-slice2-t01,
     why: "2 aimed, 2 targetless in one hand"}
  - {id: T2, category: targets, turn_id: kokomi-slice2-t05,
     why: "2 aimed, 2 targetless in one hand"}
  - {id: T3, category: targets, turn_id: klee-slice1-r3-t05,
