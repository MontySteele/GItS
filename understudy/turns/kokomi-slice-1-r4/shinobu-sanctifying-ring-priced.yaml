# KOKOMI SLICE 1, ROUND 4. One half of a MATCHED PAIR (group B).
#
# WHY THERE IS A ROUND 4 FOR THIS GROUP. Round 3's pair read RETURNED this arm
# and named its own repair in the reviewer's words: it was *"played, but the
# bundled AOE removal plus Block remained intent-insensitive; the extra cost
# removed only a follow-up"*, and the round's summary said the shape needs a
# board where *"paying for Block did not compete with the card's decisive
# two-enemy removal"*.
#
# THE DIAGNOSIS, PLAINLY. Round 3's group B carried two bodies at THREE HP,
# which is the all-enemy hit's own number. So the card removed two enemies
# outright whatever else was true, the removal alone justified playing it, and
# the four Block rode in free -- there was no turn in which the Block had to be
# worth anything. A grader saying "a different telegraph would not have changed
# it" was reading the board correctly.
#
# THE ROUND-4 REPAIR, AND IT IS ONE NUMBER. The two non-attacking bodies go
# from 3 HP to 6 HP. Everything else on this board is round 3's, unchanged:
# same seed, same player HP, same Charge, same energy, same attacker behind the
# same hand. The SEED is the exception and it is forced: round 3's seed does
# not reproduce its fight on this game build (see MANIFEST.md), so group B is
# on a fresh roll and the attacker's HP and Block are written explicitly rather
# than inherited from the body the roll happens to draw.
#
# WHAT THAT ONE NUMBER DOES. Three damage no longer removes anything. The card
# stops being a board clear and becomes what it actually prints -- chip damage
# spread three ways, plus Block -- so the reason to play it has to be the Block
# and the telegraph, which is the arm. The removal is still AVAILABLE, just not
# from this card: Water's Edge (6) kills one of the small bodies and All
# Streams Flow (9) kills the other, for two energy. That is now the competing
# line, and choosing between it and the card is a choice about the incoming
# attack rather than a choice with only one side.
#
# NO LETHAL LINE AND NO BOARD CLEAR, on either half. The attacker sits at 9 HP
# behind 8 Block -- an effective 17 against a three-energy single-target
# ceiling of 15 -- so the best line leaves it alive on 2 and its telegraph
# always lands. Clearing both small bodies costs two energy, which leaves one,
# and this card costs three; so no line ends the fight either.
#
# WHAT THE PAIR ASKS. The shipped twin costs 2 and therefore buys the
# all-enemy hit, the Block AND a 1-cost attack in the same three energy. This
# card is the same effects at 3, so playing it IS the turn. The extra energy is
# the price of the Block, stated in the cost line rather than bundled, and what
# the funnel is being asked is whether that price changes how the turn plays.
#
# THREE ENERGY is the smallest budget on which both shapes are affordable: at
# two this shape is not a hard choice, it is a dead card, and a dead card is
# not an arm.
#
# THE TURN ID IS DELIBERATELY OPAQUE: it is printed into the design-blind
# packet, so a word like `priced` inside one would tell the grader which arm
# they were holding. MANIFEST.md is the map.

id: kokomi-slice1-r4-t04
character: KLEEMOD-KOKOMI

prototype: true

# The pair's seed, carried over from round 3's group B so that the only thing
# that moved between the rounds is the one number this header names.
seed: R7W86HG7WHUD

# EB-165's door: the dealt hand is emptied to the bottom of the draw pile
# before the grants below, so the packet shows exactly these cards.
exact_hand: true

notes: |
  16/70 HP, no Block, 3 energy, a Charge bank of 8, and three enemies, two of
  which telegraph an attack.

# STAGING RULE, for the operator and not for the grader: the telegraph is
# generated with the encounter, and defence is worth nothing against an intent
# that is not an attack. If the live telegraph is not an attack, re-roll the
# seed and stage again rather than recording the divergence.
#
# The list below is folded VERBATIM into the design-blind packet, so it carries
# mechanical facts about the staging ONLY -- never why the board was built,
# never which card is being looked at. The rationale lives in the header above,
# where no grader reads.
assumptions:
  - "THE HAND BELOW IS THE WHOLE HAND. The cards the game dealt at the
     start of this fight were moved to the bottom of the draw pile before
     these were granted, so what is printed here is what was set up and
     nothing else."
  - "The encounter is GENERATED. This file can write the enemies' HP and
     Block and cannot write their INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board declares a
     telegraphed ATTACK as the falsifier's input. If the live intent
     differs, the closeness reading is a reading of the DECLARED board and
     the packet is a picture of the LIVE one; they are two records, not
     one."
  - "Every card is granted unupgraded. An upgrade moves printed numbers, so
     an upgraded grant is a different board."
  - "Charge is written to 8 through the registered resource. All Streams
     Flow to the Sea reads it at one point per two Charge."
  - "The player has no Strength and the enemies carry no aura, Vulnerable
     or Weak. A reaction on top of a hit would move every number the
     falsifier scores."
  - "The board carries THREE living enemies rather than one."

staging:
  - give: {card: KLEEMOD-PROTO_SHINOBU_SANCTIFYING_RING_PRICED, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-WATERS_EDGE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-ALL_STREAMS_FLOW, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 16}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_resource: {name: KLEEMOD_CHARGE, amount: 8}
  # THE TWO NON-ATTACKING BODIES, AT SIX -- THE ROUND-4 CHANGE, AND THE ONLY
  # ONE. Round 3 wrote them to 3, the all-enemy hit's own number, so the card
  # removed both whatever else was true and its Block rode in free. At 6 the
  # hit leaves them standing and the card has to be bought for its Block.
  #
  # Addressed by `highest_hp` twice rather than by name, because a display
  # name is the one spelling that changes when a seed is re-rolled. On the
  # pinned fight the two are the largest bodies on the board and the attacker
  # is the smallest, so the first write takes the larger of the two and the
  # second takes the other.
  - set_hp: {who: highest_hp, amount: 6}
  - set_hp: {who: highest_hp, amount: 6}
  # AND THE ATTACKER IS KEPT OUT OF LETHAL REACH. The single-target ceiling on
  # this hand is 15 (Water's Edge 6 + All Streams Flow 9). This seed's attacker
  # is a Twig Slime (S), which generates at 9/9, and `set_hp` clamps at a
  # creature's own maximum -- so HP alone cannot reach past 9 and the Block is
  # what does the work. NINE behind EIGHT is an effective 17 against that
  # ceiling of 15, so the best single-target line leaves it alive on 2.
  #
  # Round 3 used 10 behind 6 for exactly this property and this round would
  # have too; the eight is forced by the smaller body this seed draws, not
  # chosen. The property is identical and only the arithmetic reaching it moved.
  #
  # WHY BLOCK AS WELL AS HP. `set_hp` clamps at the creature's own maximum, so
  # HP alone cannot always reach the durability a board needs. Block is the one
  # verb in the grammar that raises effective durability past that maximum, and
  # it is what round 3 used after a write of 16 came back as 10.
  #
  # THE ORDER MATTERS: after the two writes above the board reads
  # <attacker> / 6 / 6, and the attacker is the largest body left, so
  # `highest_hp` now names IT. That is why these two steps come third.
  - set_hp: {who: highest_hp, amount: 9}
  - set_block: {who: highest_hp, amount: 8}
  - read: "the staged board"

# The tier0 mirror. Read ONLY by `closeness`; never by the packet,
# which reads the live game. The parser refuses this file if the hand
# here and the hand staged above are not the same multiset of cards.
board:
  character: kokomi
  pilot: generic
  hp: 16
  max_hp: 70
  block: 0
  energy: 3
  turn: 3
  resources:
    charge: 8
  hand:
    - proto_shinobu_sanctifying_ring_priced
    - waters_edge
    - all_streams_flow
  enemies:
    - name: "Twig Slime (S)"
      hp: 9
      max_hp: 9
      block: 8
      intent: {kind: attack, amount: 4}
    - name: "Leaf Slime (M)"
      hp: 6
      max_hp: 32
      block: 0
      intent: {kind: inject, status: slimed, count: 2}
    - name: "Leaf Slime (S)"
      hp: 6
      max_hp: 15
      block: 0
      intent: {kind: attack, amount: 3}
