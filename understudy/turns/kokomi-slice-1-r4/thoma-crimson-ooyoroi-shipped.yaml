# KOKOMI SLICE 1, ROUND 4. One half of a MATCHED PAIR (group C).
#
# WHY THERE IS A ROUND 4 FOR THIS GROUP. Round 3's pair read RETURNED the
# `either` arm on this group and named its own repair, in the reviewer's
# words: the arm was *"seriously weighed, but Block mode sacrificed twelve
# damage for three Block and never became competitive on this board"*, and
# what it needs is *"a stronger or more discriminating board"*.
#
# The diagnosis under that sentence is about the HAND, not about the card.
# Round 3's group C held FOUR cards -- the card under test plus two Water's
# Edge and All Streams Flow -- against THREE energy. The three 1-cost attacks
# alone came to 21 damage, so the turn had a full line that never touched the
# card at all, and the Block mode was not losing a decision to the card's own
# other mode: it was losing to the rest of the hand.
#
# THE ROUND-4 REPAIR, AND IT IS ONE CHANGE. One Water's Edge leaves the hand.
# The hand is now the card (2) plus Water's Edge (1) plus All Streams Flow (1)
# against three energy, and every worthwhile line goes THROUGH the card:
#
#   with the card, its damage half:  8 + All Streams 9      = 17 damage
#   with the card, its Block half:   3 Block + All Streams 9 =  9 damage
#   without the card at all:         6 + 9 = 15 damage, one energy idle
#
# So the card is played on every line worth playing, the two modes are 8
# damage apart rather than twelve, and the question the turn asks is the
# card's own question instead of the hand's.
#
# THE ENEMY IS AT 24, ABOVE THE 17 THIS BOARD CAN PRODUCE. No line is lethal,
# on either half. Round 1's group A showed what a guaranteed kill does to the
# fourth question -- the intent stops mattering because the enemy never acts --
# so every line here ends with the hit landing.
#
# THE PLAYER IS AT 14 OF 70 AGAINST A TELEGRAPHED 12. Without Block the turn
# ends at 2; with the three Block it ends at 5. That is the point of the
# repair: at 22/70 three Block was a rounding error, and here it doubles what
# is left standing.
#
# THIS IS THE SHIPPED CONTROL. The shipped companion deals its damage AND
# gains its Block on one play for one cost, so this half's best line is 17
# damage and 3 Block together -- strictly more than either prototype mode can
# buy. That bundle is the subsidy the slice exists to price, and this file is
# the picture of it.
#
# THE TURN ID IS DELIBERATELY OPAQUE: it is printed into the design-blind
# packet, so a word like `shipped` inside one would tell the grader which arm
# they were holding. MANIFEST.md is the map.

id: kokomi-slice1-r4-t01
character: KLEEMOD-KOKOMI

# The pair's seed, carried over from round 3's group C so that the only things
# that moved between the rounds are the ones this header names.
seed: XVE3PVZEPT

# EB-165's door: the dealt hand is emptied to the bottom of the draw pile
# before the grants below, so the packet shows exactly these cards.
exact_hand: true

notes: |
  14/70 HP, no Block, 3 energy, a Charge bank of 8, and one enemy at 24 HP
  telegraphing a heavy single hit.

# STAGING RULE, for the operator and not for the grader: the telegraph is
# generated with the encounter, and defence is worth nothing against an intent
# that is not an attack. If the live telegraph is not an attack, re-roll the
# seed and stage again rather than recording the divergence.
#
# The list below is folded VERBATIM into the design-blind packet, so it carries
# mechanical facts about the staging ONLY -- never why the board was built,
# never which card is being looked at. The rationale lives in the header above,
# where no grader reads.
assumptions:
  - "THE HAND BELOW IS THE WHOLE HAND. The cards the game dealt at the
     start of this fight were moved to the bottom of the draw pile before
     these were granted, so what is printed here is what was set up and
     nothing else."
  - "The encounter is GENERATED. This file can write the enemies' HP and
     Block and cannot write their INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board declares a
     telegraphed ATTACK as the falsifier's input. If the live intent
     differs, the closeness reading is a reading of the DECLARED board and
     the packet is a picture of the LIVE one; they are two records, not
     one."
  - "Every card is granted unupgraded. An upgrade moves printed numbers, so
     an upgraded grant is a different board."
  - "Charge is written to 8 through the registered resource. All Streams
     Flow to the Sea reads it at one point per two Charge."
  - "The player has no Strength and the enemies carry no aura, Vulnerable
     or Weak. A reaction on top of a hit would move every number the
     falsifier scores."

staging:
  - give: {card: KLEEMOD-THOMA_CRIMSON_OOYOROI, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-WATERS_EDGE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-ALL_STREAMS_FLOW, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 14}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_resource: {name: KLEEMOD_CHARGE, amount: 8}
  - set_hp: {who: first, amount: 24}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

# The tier0 mirror. Read ONLY by `closeness`; never by the packet,
# which reads the live game. The parser refuses this file if the hand
# here and the hand staged above are not the same multiset of cards.
board:
  character: kokomi
  pilot: generic
  hp: 14
  max_hp: 70
  block: 0
  energy: 3
  turn: 3
  resources:
    charge: 8
  hand:
    - thoma_crimson_ooyoroi
    - waters_edge
    - all_streams_flow
  enemies:
    - name: "Nibbit"
      hp: 24
      max_hp: 45
      block: 0
      intent: {kind: attack, amount: 12}
