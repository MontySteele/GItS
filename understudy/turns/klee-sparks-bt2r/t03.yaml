# KLEESPARK-BT2, BOARD C. THE BOMBS SIT, AND THE ENEMY SWINGS.
#
# See `t01`'s header for what the round is and what R229 settled.
#
# WHAT THIS BOARD IS. The other half of R229's return condition. `t01` asks
# whether the refund arrives IMMEDIATELY; this one asks whether the price
# costs anything ACROSS THE TURN AND THE NEXT when it does not. There is no
# Attack and no `detonate` in this hand, so three Bombs bought here SIT: they
# pay nothing this turn, they pop at the start of the next one
# (`tier0/engine/combat.py`'s turn-start sweep), and only then does the relic
# hand the 3 Sparks back.
#
# So the reader is choosing between a payout that is one whole enemy turn away
# and a defence they need RIGHT NOW, and the enemy is telegraphing 16 into 24
# HP. That is what "meaningful incoming damage" is here: not flavour, a
# number that makes the Block lines a real alternative to the bank.
#
#   the Energy, and it does not stretch:   Spirited Away 2 + Duck and Cover 1
#                                          = 12 + 5 = 17 Block, exactly 3
#                                          Energy and nothing else played
#                                          Mine Toss 1 + Duck and Cover 1
#                                          = 5 Block, a Bomb, 1 Energy spare
#   the bank:                              3 Bombs at 5 for NEXT turn, or a
#                                          bank held and nothing to hold it
#                                          for on this board
# The hand costs 0 + 1 + 1 + 2 + 0 = 4 Energy against 3, so the trade is
# forced rather than nominal.
#
# THE NEXT TURN IS READ, AND THAT IS NEW. `replay_next_turn: true` makes the
# replay end the turn after the graded line and take ONE MORE READING. A
# staged single turn has no next turn (packet sec.11.6 item 1), which is why
# `KLEESPARK-BT1` could say nothing about a delayed refund; this board buys
# exactly one turn of it and no more. The enemy takes its telegraphed swing in
# between, which is why the HP below is written where it is: 24 against a
# telegraphed 16 survives every line on this board, blocked or not.
#
# NO LINE HERE IS LETHAL, and none is close: the body is 55 and nothing in
# this hand deals damage on this turn at all.
#
# THIS BOARD MAKES NO EXCLUSIVITY CLAIM: there is one Spark-priced use in the
# hand, and one use is not a claim about anything.

id: klee-sparks-bt2r-t03
character: KLEEMOD-KLEE

# Pinned before the round. `klee-sparks-bt1-t03`'s seed, recorded ONE-BODY on
# a Klee run.
seed: YX7PB48WR7R4

exact_hand: true

prototype: true

slots:
  - C2

replay_next_turn: true

forecast:
  - >-
    If you spend 3 Sparks on Bag of Tricks this turn, what number will your
    Spark bank show at the very END of this turn?
  - >-
    What will your Spark bank show at the START of your next turn, on the
    line you are about to play?
  - >-
    How much damage, if any, will the enemy have taken by the start of your
    next turn, on the line you are about to play?

notes: |
  24/62 HP, no Block, 3 energy, a Spark bank of exactly 3, and one enemy
  telegraphing an attack for 16. The hand costs 4 Energy in total and holds
  no Attack.

assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The Spark bank is written to 3 through SPARK_POWER, which is how the
     live game holds Sparks. 3 is the mode's printed price exactly."
  - "The run carries Klee's starting relic and no other. It is printed on
     the page: that relic pays 1 Spark for every Bomb that detonates, and
     a reader who cannot see it cannot do the turn's arithmetic."
  - "The encounter is GENERATED. This file can write the enemy's HP and
     Block and cannot write its INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board below
     declares a telegraphed ATTACK as the falsifier's input."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "No Bomb is on the board when the turn starts. Every Bomb the packet
     shows is one this turn's line places."
  - "The player has no Strength and the enemy carries no aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."
  - "The turn is ended after the graded line and the board is read once
     more, so the reading that follows is taken after the enemy has taken
     its telegraphed turn."

# Needs a dev build carrying the prototype rows (klee-mod/build/deploy_proto.ps1).

staging:
  - give: {card: KLEEMOD-PROTO_SPARK_MODE_BOMBS, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-MINE_TOSS, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-DUCK_AND_COVER, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-SPIRITED_AWAY, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-RUN_AWAY, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 24}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_power: {who: player, name: SPARK_POWER, amount: 3}
  - set_hp: {who: first, amount: 55}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

resource_round:
  claim: >-
    One Spark-priced use in hand, no detonator and no Attack, so the price
    buys a payout one whole enemy turn away. No exclusive pair is claimed.

board:
  character: klee
  pilot: demolition
  hp: 24
  max_hp: 62
  block: 0
  energy: 3
  turn: 4
  resources:
    sparks: 3
  hand:
    - proto_spark_mode_bombs
    - mine_toss
    - duck_and_cover
    - spirited_away
    - run_away
  enemies:
    - name: "Act 1 enemy"
      hp: 55
      max_hp: 55
      block: 0
      intent: {kind: attack, amount: 16}
