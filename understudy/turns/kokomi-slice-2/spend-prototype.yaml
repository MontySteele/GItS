# KOKOMI SLICE 2 (R217 F, executing R213 E1). One half of a MATCHED PAIR.
#
# HOW TO READ A PAIR. The files of a pair declare the SAME board -- same HP,
# same Block, same energy, same Charge, same enemy, same alternatives in hand
# -- and differ in EXACTLY ONE CARD: the one under test. If the boards
# differed anywhere else, a change in how the turn plays could be attributed
# to the staging instead of to the card.
#
# THE SEED IS PART OF THE PAIR. The encounter is GENERATED, so the first half
# staged DISCOVERS a seed; every other half of that pair must then be staged
# with `--seed <that run_seed>` or the halves are two different fights.
# MANIFEST.md carries the seed once one exists. Nothing here is staged.
#
# THE TURN ID IS DELIBERATELY OPAQUE. It is printed into the design-blind
# packet the grader reads, so a word like "spend" or "threshold" inside an id
# would tell the grader which arm they were holding. The FILENAME names the
# arm, because only the tooling and the packet-writer read filenames.
# MANIFEST.md is the map between them.
#
# NOTHING HERE IS A CLAIM THAT ANY ARM IS BETTER. The funnel refuses turns and
# never rates them (R213's first guard), and the designer of these rows may
# not grade them.
#
# THE QUESTION THIS SLICE ASKS (R213 E1, routed here by R217 F): Charge is
# uncapped and never spent, and the 2026-08-26 playtest found her best turn is
# "spam companion cards to block until you can hit with the Charge". Slice 1
# priced Companion Block and could not answer the other half -- whether there
# is a payoff besides waiting. Each pair below sets a shipped card that READS
# the bank and keeps it against a prototype that SPENDS it.
#
# EVERY BOARD TELEGRAPHS AN ATTACK. Defence is worth nothing against any other
# intent, and what the bank is worth against an incoming hit is half the
# question.
#
# NO LINE ON ANY BOARD IS LETHAL. Each enemy's HP is written above the largest
# total damage its board can produce at true values, so "just kill it" is never
# the answer that ends the turn. The arithmetic is per board in MANIFEST.md.
#
# ONE FLAT-BLOCK COMPETITOR, deliberately: Coral Guard (5 Block for 1) is in
# hand wherever it is not the card under test, because a Charge payoff that
# nothing competes with is not a decision. It is the ONLY standalone Block on
# these boards -- a second one would make "defend" the obvious answer by
# arithmetic rather than by choice.
#
# ARM 1: DOES THE BANK BUY ANYTHING NOW? (R213 E1.)
#
# WHY THIS BOARD. TWO energy against three 1-cost cards and one 2-cost card, so
# the turn buys two plays at most and the last energy is contested. The card
# under test is the turn's Charge payoff either way, and it is the only thing
# that moves between the halves:
#
#   SHIPPED: 5 damage plus one per two Charge, single target -- and the bank
#     is still there next turn, and the turn after that.
#   PROTOTYPE: a flat hit paid for with six Charge, and the bank is gone.
#
# GYORIN FORMATION is on the board because it is the third answer the bank
# already has: Block that READS the bank without spending it, at 2 energy, so
# taking it is the whole turn. With a heavy hit telegraphed, "hold the bank and
# armour up" is a real line, and a spend that cannot beat it has been asked a
# fair question.

id: kokomi-slice2-t02
character: KLEEMOD-KOKOMI

exact_hand: true

prototype: true

notes: |
  48/70 HP, no Block, 2 energy, a Charge bank of 8, and one
  enemy at 34 HP telegraphing an attack.

# STAGING RULE, for the operator and not for the grader: the telegraph is
# generated with the encounter, and defence is worth nothing against an intent
# that is not an attack. If the live telegraph is not an attack, re-roll the
# seed and stage again rather than recording the divergence.
#
# The list below is folded VERBATIM into the design-blind packet, so it carries
# mechanical facts about the staging ONLY -- never why the board was built,
# never which card is being looked at. The rationale lives in the header above,
# where no grader reads.
assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The encounter is GENERATED. This file can write the enemy's HP and
     Block and cannot write its INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board below
     declares a telegraphed ATTACK as the falsifier's input. If the live
     intent differs, the closeness reading is a reading of the DECLARED
     board and the packet is a picture of the LIVE one; they are two
     records, not one."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "Charge is written to 8 through the registered resource. All Streams Flow to the Sea reads it at one point per two Charge."
  - "The player has no Strength and the enemy carries no aura, Vulnerable
     or Weak. A reaction on top of a hit would move every number the
     falsifier scores."

# This file cannot be staged until a dev build carrying the prototype rows is
# deployed (klee-mod/build/deploy_proto.ps1). Until then it is closeness-only,
# which needs no game.
staging:
  - give: {card: KLEEMOD-PROTO_CHARGE_SPEND_STRIKE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-CORAL_GUARD, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-WATERS_EDGE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-GYORIN_FORMATION, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 48}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 2}
  - set_resource: {name: KLEEMOD_CHARGE, amount: 8}
  - set_hp: {who: first, amount: 34}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

# The tier0 mirror. Read ONLY by `closeness`; never by the packet,
# which reads the live game. The parser refuses this file if the hand
# here and the hand staged above are not the same multiset of cards.
board:
  character: kokomi
  pilot: generic
  hp: 48
  max_hp: 70
  block: 0
  energy: 2
  turn: 3
  resources:
    charge: 8
  hand:
    - proto_charge_spend_strike
    - coral_guard
    - waters_edge
    - gyorin_formation
  enemies:
    - name: "Act-1 attacker"
      hp: 34
      max_hp: 46
      block: 0
      intent: {kind: attack, amount: 14}
