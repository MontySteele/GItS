# EB-169's RED FIXTURE: a board the preflight must refuse.
#
# A turn is only half of the refusal -- the other half is a register entry, and
# the shipped register is EMPTY because the defect it was built for (EB-164) is
# closed. So this file is paired in `tier0/tests/test_staged_turn.py` with a
# one-entry FIXTURE register naming `all_streams_flow`, which reconstructs
# exactly the situation round 2 of the Kokomi slice was in: a board staging a
# card whose printed face the repo already knew was wrong.
#
# It lives under `fixtures/` so `all_turns()` never returns it -- this is a
# board that must NOT be stageable, and a red fixture that turned up in
# `check`'s own sweep would be a red fixture failing the suite it belongs to.
#
# Nothing here is a turn anybody plays: the hand is two cards, the enemy is a
# single written-down body, and no verdict, packet or reading was ever taken
# on it.

id: open-face-defect-fixture
character: KLEEMOD-KOKOMI

notes: |
  Two cards, one of which a fixture register calls defective. The only
  question this board is asked is whether the funnel refuses it before
  launching a game.

assumptions:
  - "A fixture board, staged by no one. The enemy's HP and Block are written
     down and its telegraph is whatever the game drew, so nothing here is a
     reading of anything."

staging:
  - give: {card: KLEEMOD-ALL_STREAMS_FLOW, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-CORAL_GUARD, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 40}
  - set_energy: {amount: 2}
  - set_hp: {who: first, amount: 20}
  - read: "the staged board"

board:
  character: kokomi
  pilot: generic
  hp: 40
  max_hp: 70
  block: 0
  energy: 2
  turn: 1
  hand:
    - all_streams_flow
    - coral_guard
  enemies:
    - name: "Act-1 attacker"
      hp: 20
      max_hp: 20
      block: 0
      intent: {kind: attack, amount: 6}
