# KLEESPARK-BT1, BOARD B. ONE BOMB SUFFICES, BECAUSE THE BANK HAS A BETTER HOME.
#
# See t01's header for what the round is, what Quick Fuse is doing in the hand,
# and what the slot machinery cannot see.
#
# WHAT THIS BOARD IS. `t01` WITH ONE CARD SWAPPED. The bank is the same 3, the
# enemy is the same 40, the Energy is the same 3, and Kaboom! has become
# *Firework Finale* (`proto_spark_finisher`, 0 Energy, Spend 3 Sparks, 18 to
# one). So the bank of 3 now buys EXACTLY ONE of two things -- the card's
# priced mode, or the whole of another card -- and the arithmetic says which.
#
# THIS IS THE DECLINE HALF OF THE ROUND'S MATCHED PAIR, and it is the only
# shape in which a staged single turn can ask "one Bomb is enough". A staged
# board has no memory and no next turn (packet sec.11.6 item 1, and
# `KLEESPARK-R2`'s sec.13.1 erratum, which established that this instrument
# cannot ask for a HOLD and can only ask for a choice BETWEEN SINKS). So
# "one Bomb suffices" is posed here as what it actually is on one turn: the
# expensive mode is the WORSE buy, and the free mode plus the rival sink is the
# better one.
#
# THE ARITHMETIC, PRINTED SO THE FALSIFIER IS NOT A MATTER OF OPINION.
#   free mode + Finale -> 1 Bomb at 5, Quick Fuse detonates      =  5
#                         plus Firework Finale                   = +18  -> 23
#   priced mode        -> 3 Bombs at 5, Quick Fuse detonates      = 15
#                         Finale is then UNAFFORDABLE (bank 0)    -> 15
# Both lines cost 1 Energy of 3, so Duck and Cover is affordable on either and
# the choice is not an Energy one. NO LINE HERE IS LETHAL: the enemy is set to
# 40 and the largest total is 23.
#
# WHY THE RIVAL IS Firework Finale AND NOT SOMETHING CHEAPER. Its price is 3 --
# the mode's price exactly -- so the two candidates consume the same bank and
# the comparison is about VALUE and not about change left over. A cheaper rival
# would let a reader buy both and there would be no board.
#
# THE SLOT THIS BOARD SITS UNDER IS B2: a bank at or above 3 WITH at least one
# other affordable Spark-priced card in hand. It is the only board of the round
# that carries a second sink.

id: klee-sparks-bt1-t02
character: KLEEMOD-KLEE

# Pinned before the round (MANIFEST.md). `klee-sparks-r2-t02`'s seed, recorded
# ONE-BODY on a Klee run.
seed: R805DJ56LZHM

exact_hand: true

prototype: true

slots:
  - B2

notes: |
  42/62 HP, no Block, 3 energy, a Spark bank of exactly 3, and one enemy
  telegraphing an attack.

assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The Spark bank is written to 3 through SPARK_POWER, which is how the
     live game holds Sparks. 3 is BOTH candidates' price exactly, so the
     bank buys one of them and not both."
  - "The encounter is GENERATED. This file can write the enemy's HP and
     Block and cannot write its INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board below
     declares a telegraphed ATTACK as the falsifier's input."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "No Bomb is on the board when the turn starts. Every Bomb the packet
     shows is one this turn's line places."
  - "The player has no Strength and the enemy carries no aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."

# Needs a dev build carrying the prototype rows (klee-mod/build/deploy_proto.ps1).

staging:
  - give: {card: KLEEMOD-PROTO_SPARK_MODE_BOMBS, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_SPARK_FINISHER, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-QUICK_FUSE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-DUCK_AND_COVER, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 42}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_power: {who: player, name: SPARK_POWER, amount: 3}
  - set_hp: {who: first, amount: 40}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

board:
  character: klee
  pilot: demolition
  hp: 42
  max_hp: 62
  block: 0
  energy: 3
  turn: 4
  resources:
    sparks: 3
  hand:
    - proto_spark_mode_bombs
    - proto_spark_finisher
    - quick_fuse
    - duck_and_cover
  enemies:
    - name: "Act 1 enemy"
      hp: 40
      max_hp: 40
      block: 0
      intent: {kind: attack, amount: 11}
