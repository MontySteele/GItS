# KLEESPARK-BT1, BOARD A. THREE BOMBS PAY, AND THE BANK CAN BUY THEM.
#
# THE ROUND. `EB-224`'s staging round for *Bag of Tricks*
# (`proto_spark_mode_bombs`, 0 Energy, Skill, Uncommon) -- the first row in the
# tree whose price sits at the HEAD OF A MODE rather than at the card's top
# level, admitted by R225's amended Spark-cost clause and built on `EB-182`'s
# mode-price machinery. The registration is
# `review/active/klee-sparks-2026-08-29.md` sec.21 and
# `docs/current/EXPERIMENTS.md` -> `KLEESPARK-BT1`.
#
# WHAT THIS BOARD IS. A bank of exactly 3 -- the price -- one enemy that cannot
# be killed this turn, and NO other card in hand that prices itself in Sparks.
# So the bank has exactly one home, the priced mode, and the only question the
# board asks is whether three Bombs are worth the whole bank when three Bombs
# plainly pay. It is the TAKE half of this round's matched pair; `t02` is the
# DECLINE half, and it differs from this board by one swapped card.
#
# THE ARITHMETIC, PRINTED SO THE FALSIFIER IS NOT A MATTER OF OPINION.
#   priced mode -> 3 Bombs at 5, then Quick Fuse detonates      = 15
#                  plus Kaboom!                                 = +7   -> 22
#   free mode   -> 1 Bomb at 5, then Quick Fuse detonates       =  5
#                  plus Kaboom!                                 = +7   -> 12
# Both lines cost 1 Energy of 3 (Bag of Tricks and Quick Fuse are both 0), so
# Duck and Cover is affordable on either and the choice is not an Energy one.
# NO LINE HERE IS LETHAL: the enemy is set to 40 and the largest total is 22.
#
# BOMBS DETONATE AT THE START OF THE PLAYER'S TURN (`combat.py`'s turn-start
# sweep), so a Bomb placed now is next turn's damage unless something detonates
# it. Quick Fuse (0 Energy, shipped Common, `detonate` on one enemy) is in hand
# for exactly that reason: it makes the Bomb payload READABLE ON THIS TURN
# rather than a promise the packet cannot show. It is a SHIPPED card and prices
# no Sparks, so it moves neither the bank nor any slot.
#
# THE SLOT THIS BOARD SITS UNDER IS B1: a bank at or above the mode's price of
# 3, with NO other affordable Spark-priced card in hand.
#
# WHAT THE SLOT MACHINERY CANNOT SEE, DISCLOSED HERE. `slot_plan._spark_prices`
# reads a TOP-LEVEL `spend_spark` and nothing else, so *Bag of Tricks* -- whose
# spend sits at a mode head, which is the whole point of the row -- is INVISIBLE
# to `affordable_spark_uses`. That is why B1's predicate reads
# `affordable_spark_uses == 0` on a board that plainly holds a priced mode. The
# reading is "no OTHER Spark sink", and it is stated here rather than left for a
# later reader to trip over.

id: klee-sparks-bt1-t01
character: KLEEMOD-KLEE

# Pinned before the round (MANIFEST.md). `klee-sparks-r2-t01`'s seed, recorded
# ONE-BODY on a Klee run. Every board of this round wants one body.
seed: JH4T8MSN10KS

exact_hand: true

prototype: true

slots:
  - B1

notes: |
  42/62 HP, no Block, 3 energy, a Spark bank of exactly 3, and one enemy
  telegraphing an attack.

assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The Spark bank is written to 3 through SPARK_POWER, which is how the
     live game holds Sparks. 3 is the mode's printed price exactly."
  - "The encounter is GENERATED. This file can write the enemy's HP and
     Block and cannot write its INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board below
     declares a telegraphed ATTACK as the falsifier's input."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "No Bomb is on the board when the turn starts. Every Bomb the packet
     shows is one this turn's line places."
  - "The player has no Strength and the enemy carries no aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."

# Needs a dev build carrying the prototype rows (klee-mod/build/deploy_proto.ps1).

staging:
  - give: {card: KLEEMOD-PROTO_SPARK_MODE_BOMBS, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-QUICK_FUSE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-KABOOM, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-DUCK_AND_COVER, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 42}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_power: {who: player, name: SPARK_POWER, amount: 3}
  - set_hp: {who: first, amount: 40}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

board:
  character: klee
  pilot: demolition
  hp: 42
  max_hp: 62
  block: 0
  energy: 3
  turn: 4
  resources:
    sparks: 3
  hand:
    - proto_spark_mode_bombs
    - quick_fuse
    - kaboom
    - duck_and_cover
  enemies:
    - name: "Act 1 enemy"
      hp: 40
      max_hp: 40
      block: 0
      intent: {kind: attack, amount: 11}
