# KLEESPARK-BT1, BOARD D. BELOW THE PRICE, WITH A WAY UP INSIDE THE TURN.
#
# See t01's header for what the round is, what Quick Fuse is doing in the hand,
# and what the slot machinery cannot see.
#
# WHAT THIS BOARD IS. `t03` with Kaboom! swapped for *Powder Pop*
# (`proto_pop_spark`, 0 Energy, place 1 Bomb dealing 5 AND gain 1 Spark). The
# bank is 2 -- one short -- and the hand contains the one Spark the mode needs.
# So the priced mode is unaffordable AT THE MOMENT THE HAND IS READ and
# affordable AFTER ONE FREE PLAY, and the board asks whether the price is
# legible enough to be PLANNED TOWARD rather than only reacted to.
#
# WHY THIS BOARD EXISTS AND IS NOT A DUPLICATE OF `t03`. `t03` asks whether the
# unaffordable mode is correctly WITHHELD. This one asks whether affordability
# RECOMPUTES: `EB-182`'s filter runs when the choose-a-card screen is built, so
# a bank raised earlier in the same turn must open the mode. Those are two
# different halves of one rule and a single board cannot carry both.
#
# THE ARITHMETIC.
#   Powder Pop -> priced mode -> Quick Fuse
#        Powder Pop places 1 Bomb at 5 and takes the bank 2 -> 3
#        the priced mode spends 3 and places 3 more Bombs at 5
#        Quick Fuse detonates FOUR Bombs                          = 20
#   free mode -> Powder Pop -> Quick Fuse
#        two Bombs at 5, detonated                                = 10
#        and the bank ends at 3 with nothing left to spend it on
# All three cards are 0 Energy, so the whole line costs nothing and Duck and
# Cover is not in this hand. NO LINE HERE IS LETHAL: the enemy is set to 40.
#
# THE SLOT THIS BOARD SITS UNDER IS B3, with `t03`: a bank BELOW the mode's
# price of 3, with no other affordable Spark-priced card in hand. `Powder Pop`
# prints `gain_spark` and no `spend_spark`, so it is a MAKER and adds nothing
# to `affordable_spark_uses`.

id: klee-sparks-bt1-t04
character: KLEEMOD-KLEE

# Pinned before the round (MANIFEST.md). `klee-sparks-r2-t05`'s seed, recorded
# ONE-BODY on a Klee run.
seed: XT4BE7LFY5XH

exact_hand: true

prototype: true

slots:
  - B3

notes: |
  42/62 HP, no Block, 3 energy, a Spark bank of 2 -- one short of the mode's
  price -- and one enemy telegraphing an attack.

assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The Spark bank is written to 2 through SPARK_POWER. Powder Pop is the
     only card in hand that can raise it, and it raises it by exactly 1."
  - "The encounter is GENERATED. This file can write the enemy's HP and
     Block and cannot write its INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board below
     declares a telegraphed ATTACK as the falsifier's input."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "No Bomb is on the board when the turn starts. Every Bomb the packet
     shows is one this turn's line places."
  - "The player has no Strength and the enemy carries no aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."

# Needs a dev build carrying the prototype rows (klee-mod/build/deploy_proto.ps1).

staging:
  - give: {card: KLEEMOD-PROTO_SPARK_MODE_BOMBS, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_POP_SPARK, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-QUICK_FUSE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-KABOOM, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 42}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_power: {who: player, name: SPARK_POWER, amount: 2}
  - set_hp: {who: first, amount: 40}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

board:
  character: klee
  pilot: demolition
  hp: 42
  max_hp: 62
  block: 0
  energy: 3
  turn: 4
  resources:
    sparks: 2
  hand:
    - proto_spark_mode_bombs
    - proto_pop_spark
    - quick_fuse
    - kaboom
  enemies:
    - name: "Act 1 enemy"
      hp: 40
      max_hp: 40
      block: 0
      intent: {kind: attack, amount: 11}
