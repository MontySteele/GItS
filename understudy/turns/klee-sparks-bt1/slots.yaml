# `KLEESPARK-BT1` -- the counting slots of the round's slate, machine-readable.
#
# WRITTEN BEFORE THE ROUND, and its ceilings computed by
# `local_tester round --plan-only` over these four boards before a single board
# was staged, which is what `EB-202` exists to make possible.
#
# WHAT IS AND IS NOT IN HERE. This file holds COUNTING slots -- a slot with an
# integer threshold and a predicate a board's DECLARED half can answer. The
# slate's replay predictions (`P4`, `P5`) are counted off `execute-*.json`
# rather than off a board's shape, so they carry no board predicate and do not
# belong here; they name their boards in the slate instead.
#
# THE ONE THING THIS FILE CANNOT SEE, STATED RATHER THAN LEFT TO BE FOUND.
# `slot_plan._spark_prices` reads a TOP-LEVEL `spend_spark` op and nothing
# else. *Bag of Tricks* prices itself at a MODE HEAD -- which is the entire
# reason `EB-224` exists -- so the row is INVISIBLE to `spark_use_count`,
# `affordable_spark_uses`, `min_spark_price` and `affordable_spark_price_sum`
# on every board of this round. Every predicate below is therefore written
# about the OTHER Spark-priced cards in hand, and `affordable_spark_uses == 0`
# reads "no other Spark sink", never "no Spark sink". The four boards' banks
# and the mode's price of 3 are compared against INTEGER LITERALS for the same
# reason: 3 is a number this file knows and `min_spark_price` is not. Making
# `slot_plan` mode-aware is engineering work this round does not do and does
# not need; it is reported as a candidate row and nothing is minted here.
#
# THE CEILINGS, computed by hand and checked against `slot_plan.ceiling` at
# plan time:
#
#   B1  the price is affordable, no rival sink   t01              ceiling 1, threshold 1
#   B2  the price is affordable, a rival sink    t02              ceiling 1, threshold 1
#   B3  the price is NOT affordable              t03, t04         ceiling 2, threshold 2
#
# EVERY THRESHOLD EQUALS ITS CEILING, which is what "the minimum that answers
# the question" costs: each board is the only one of its kind in the round, so
# a MISS on any of them is a real MISS about the card rather than a sampling
# accident. What `EB-202` forbids is the other direction -- a threshold ABOVE
# the ceiling, which `KLEESPARK-R1`'s `P1` carried at 4 against 3.

slots:
  - id: B1
    threshold: 1
    question: >-
      Is the priced mode AFFORDABLE with no rival -- a Spark bank at or above
      the mode's price of 3, and no OTHER Spark-priced card in hand the bank
      could buy instead?
    predicate:
      - {left: spark_bank, op: ">=", right: 3}
      - {left: affordable_spark_uses, op: "==", right: 0}

  - id: B2
    threshold: 1
    question: >-
      Is the priced mode affordable AND CONTESTED -- a Spark bank at or above
      3 with at least one other affordable Spark-priced card in hand, so the
      bank buys one of them and not both?
    predicate:
      - {left: spark_bank, op: ">=", right: 3}
      - {left: affordable_spark_uses, op: ">=", right: 1}

  - id: B3
    threshold: 2
    question: >-
      Is the priced mode UNAFFORDABLE -- a Spark bank below the mode's price
      of 3, with no other affordable Spark-priced card in hand either?
    predicate:
      - {left: spark_bank, op: "<", right: 3}
      - {left: affordable_spark_uses, op: "==", right: 0}
