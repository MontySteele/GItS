# KOKOMI SLICE 1 (R216). One half of a MATCHED PAIR.
#
# HOW TO READ A PAIR. The files of a pair declare the SAME board -- same HP,
# same Block, same energy, same Charge, same enemies, same alternatives in
# hand -- and differ in EXACTLY ONE CARD: the one under test. That is the
# whole design. If the boards differed anywhere else, a change in how the turn
# plays could be attributed to the difference instead of to the card, and the
# slice would have measured its own staging.
#
# THE SEED IS PART OF THE PAIR. The encounter is GENERATED, so the first half
# staged is the one that DISCOVERS a seed; every other half of that pair must
# then be staged with `--seed <that run_seed>` or the halves are two different
# fights. MANIFEST.md carries the seed once it exists.
#
# THE TURN ID IS DELIBERATELY OPAQUE. It is printed into the design-blind
# packet the grader reads, so "priced" or "either" inside an id would tell the
# grader which arm it was holding -- the one thing a blind grade cannot
# survive. The FILENAME names the arm, because only the tooling and the
# packet-writer read filenames. MANIFEST.md is the map between them.
#
# NOTHING HERE IS A CLAIM THAT ANY ARM IS BETTER. The funnel refuses turns and
# never rates them (R213's first guard), and the designer of these rows may
# not grade them.
#
# ARM 1: PEARL BARRAGE'S COUNTING BASIS (R215 C).
#
# WHY THIS BOARD. Two energy against two 1-cost cards and two FREE cards, and
# both free cards are rotations: Gorou's opener Exhausts ITSELF, and Send the
# Runner Exhausts one card you pick. So the turn can put up to three cards in
# the pile without spending energy on any of them.
#
# That is what separates the two shapes, and nothing else on this board does.
# The SHIPPED card reads the cost of the ONE card you chose to Exhaust, so its
# question is "which of my cards am I willing to burn" -- and here the only
# answers worth anything are the Block or the finisher. The WHOLE-TURN shape
# reads the count, so its question is "how many rotations can I fit", and it
# does not care which card went.
#
# TWO energy, not three, because three buys everything on this board and a
# turn where every card is playable has no second line to be close to. At two
# the last energy goes to the Block OR to the Charge reader, which is the
# attack/defend tension the slice exists to look at.

id: kokomi-slice1-t01
character: KLEEMOD-KOKOMI

notes: |
  48/70 HP, no Block, 2 energy, a Charge bank of 8, and one enemy
  at 34 HP telegraphing a heavy single hit.

# STAGING RULE, for the operator and not for the grader: the telegraph is
# generated with the encounter, and defence is worth nothing against an intent
# that is not an attack. If the live telegraph is not an attack, re-roll the
# seed and stage again rather than recording the divergence.
#
# The list below is folded VERBATIM into the design-blind packet, so it carries
# mechanical facts about the staging ONLY -- never why the board was built,
# never which card is being looked at. The rationale lives in the header above,
# where no grader reads.
assumptions:
  - "THE GAME DEALS ITS OWN OPENING HAND ON TOP OF THIS ONE.
     The staged hand is the declared one PLUS whatever the seat drew,
     and there is no dev door that empties a hand yet. The packet is a
     picture of the live hand; `closeness --observed` scores the live
     hand; the declared board below is the smaller reading available
     with no game running."
  - "The encounter is GENERATED. This file can write the enemies' HP and
     Block and cannot write their INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board below
     declares a telegraphed ATTACK as the falsifier's input. If the live
     intent differs, the closeness reading is a reading of the DECLARED
     board and the packet is a picture of the LIVE one; they are two
     records, not one."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "Charge is written to 8 through the registered resource. All Streams
     Flow to the Sea reads it at one point per two Charge."
  - "The player has no Strength and the enemies carry no aura, Vulnerable
     or Weak. A reaction on top of a hit would move every number the
     falsifier scores."

staging:
  - give: {card: KLEEMOD-PEARL_BARRAGE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-GOROU_INUZAKA_CHARGE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-SEND_THE_RUNNER, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-CORAL_GUARD, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-ALL_STREAMS_FLOW, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 48}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 2}
  - set_resource: {name: KLEEMOD_CHARGE, amount: 8}
  - set_hp: {who: first, amount: 34}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

# The tier0 mirror. Read ONLY by `closeness`; never by the packet,
# which reads the live game. The parser refuses this file if the hand
# here and the hand staged above are not the same multiset of cards.
board:
  character: kokomi
  pilot: generic
  hp: 48
  max_hp: 70
  block: 0
  energy: 2
  turn: 3
  resources:
    charge: 8
  hand:
    - pearl_barrage
    - gorou_inuzaka_charge
    - send_the_runner
    - coral_guard
    - all_streams_flow
  enemies:
    - name: "Act-1 attacker"
      hp: 34
      max_hp: 46
      block: 0
      intent: {kind: attack, amount: 14}
