# KLEESPARK-BT3, BOARD A. THE BOMBS SIT, AND NOTHING ELSE PLACES ONE.
#
# THE ROUND. `EB-224`'s THIRD staged round for *Bag of Tricks*
# (`proto_spark_mode_bombs`, 0 Energy, Skill, Uncommon). It exists for ONE
# reason: R230 (2026-08-30) ruled the arm's redesign pick at option (3) —
# *Bag of Tricks* is a BRIDGE and its refund loop is the card's point — and
# ruled at the same time that `F2`, R229's second predicate, must be REPAIRED
# before it is posed again. The registration in prose is
# `review/active/klee-sparks-2026-08-29.md` sec.25; the round this one repairs
# is `KLEESPARK-BT2` THE RERUN at sec.24.9.
#
# THE DEFECT R230 NAMED, IN ITS OWN WORDS. `klee-sparks-bt2r`'s `F2` required
# the Spark bank to read EXACTLY 3 at the start of the next turn. That board
# also granted *Mine Toss*, which places a Bomb of its own, so the proposed
# line put FOUR Bombs on the board and *Pounding Surprise* paid FOUR. The
# reader forecast 4 and was right; the predicate would have failed it anyway.
# R230: *"a re-posed `F2` must grade the refund ATTRIBUTABLE TO Bag of Tricks'
# own Bombs — at least 3 — or else the extra Bomb source must leave the board
# entirely."*
#
# THIS BOARD TAKES THE SECOND REPAIR, WHICH IS THE ONE WITH NO ARITHMETIC IN
# IT. *Mine Toss* is GONE. Nothing in this hand places a Bomb except the mode
# under test, and the board starts with no Bomb on it, so every Spark the
# relic pays back next turn is attributable to *Bag of Tricks* by
# construction rather than by subtraction. A predicate that has to attribute a
# refund is a predicate that can be argued about; this one cannot.
#
# THE ONE OTHER CHANGE, DISCLOSED. Dropping a 1-Energy card from
# `klee-sparks-bt2r-t03`'s hand would have left 3 cards costing 3 Energy
# against 3 available, and `EB-236`'s `no_forced_trade` refuses a board whose
# Energy pays for the whole hand — correctly, since seven of eight
# `KLEESPARK-BT1` forms were refused `intent_insensitive` on exactly that.
# So the ENERGY drops 3 -> 2 and the trade stays forced: the hand costs
# 0 + 1 + 2 + 0 = 3 against 2. No card is added; the board is `t03` minus the
# confound, with the Energy moved by the minimum that keeps the question live.
#
#   the Energy, and it does not stretch:  Spirited Away 2  = 12 Block, all of
#                                         it, nothing else played
#                                         Duck and Cover 1 = 5 Block, 1 spare
#   the bank:                             3 Bombs at 5 for NEXT turn, or a
#                                         bank held and nothing on this board
#                                         to hold it for
#
# WHY THE DELAYED HALF IS STILL WORTH ASKING AFTER R230. The ruled design
# intent claims the mode "demands three Sparks of up-front liquidity — real
# liquidity, locked up, and unavailable to anything else until it is
# released". That claim is a claim about a COST, and it has never been graded:
# `F2` came back UNREACHED three rounds running. This board is where it is
# asked, on a hand with no detonator, against a telegraphed 16 into 24 HP.
#
# THE NEXT TURN IS READ. `replay_next_turn: true` ends the turn after the
# graded line and takes ONE MORE READING, which is the only way a staged
# single turn can say anything about a refund that arrives later.
#
# NO LINE HERE IS LETHAL, and none is close: nothing in this hand deals any
# damage on this turn at all, and the three Bombs pop next turn for 15 against
# a body of 40.
#
# THIS BOARD MAKES NO EXCLUSIVITY CLAIM: there is one Spark-priced use in the
# hand, and one use is not a claim about anything.
#
# `EB-240`'s `expects:` BLOCK IS DECLARED HERE, AND IT IS NEW. The published
# `klee-sparks-bt2r` boards each wrote `set_hp: {who: first, amount: 55}` and
# were read at 45 / 46 / 40, and each asserted in prose that the run carried
# "Klee's starting relic and no other" while the page printed two. Neither
# moved a grade there (sec.24.9.10) and neither is repeated here: this board
# writes NO enemy HP, declares the body the seed is recorded at, and declares
# both relics the staging path actually produces.

id: klee-sparks-bt3-t01
character: KLEEMOD-KLEE

# Pinned before the round. `klee-sparks-bt2r-t03`'s seed, recorded ONE-BODY on
# a Klee run three rounds running, and recorded at a body of 40.
seed: YX7PB48WR7R4

exact_hand: true

prototype: true

slots:
  - C1

replay_next_turn: true

# The pre-commit questions, printed at the TOP of the page and answered
# BEFORE the line (`EB-236` item (d) and `EB-239`'s field). Asked
# CONDITIONALLY and in printed vocabulary, so that asking them does not
# recommend a line.
forecast:
  - >-
    If you spend 3 Sparks on Bag of Tricks this turn, what number will your
    Spark bank show at the very END of this turn?
  - >-
    What will your Spark bank show at the START of your next turn, on the
    line you are about to play?
  - >-
    How much damage, if any, will the enemy have taken by the start of your
    next turn, on the line you are about to play?

notes: |
  24/62 HP, no Block, 2 energy, a Spark bank of exactly 3, and one enemy
  telegraphing an attack for 16. The hand costs 3 Energy in total, holds no
  Attack, and holds nothing that places a Bomb except the card under test.

assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The Spark bank is written to 3 through SPARK_POWER, which is how the
     live game holds Sparks. 3 is the mode's printed price exactly."
  - "The run carries Klee's starting relic AND the run-start gift the
     staging path takes, and no others. Both are printed on the page. The
     starting relic pays 1 Spark for every Bomb that detonates, and a
     reader who cannot see it cannot do the turn's arithmetic; the gift
     does nothing inside a combat. The pair is DECLARED in this file and
     checked against the wire before the packet is written."
  - "The encounter is GENERATED. This file writes no enemy HP at all --
     it declares the body the seed is recorded at and the stage refuses
     on a different one, rather than writing a number the game may not
     take."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "No Bomb is on the board when the turn starts, and nothing in this
     hand places one except the card under test. Every Bomb the packet
     shows is one this turn's line placed with Bag of Tricks."
  - "The player has no Strength and the enemy carries no aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."
  - "The turn is ended after the graded line and the board is read once
     more, so the reading that follows is taken after the enemy has taken
     its telegraphed turn."

# `EB-240`. The structured half of the block above -- the facts a machine can
# compare against the wire, in a shape with one meaning. The stage REFUSES on
# a mismatch, which is the whole point of declaring them.
expects:
  relics:
    - "Pounding Surprise"
    - "Fishing Rod"
  hp:
    first: 40

# Needs a dev build carrying the prototype rows (klee-mod/build/deploy_proto.ps1).

staging:
  - give: {card: KLEEMOD-PROTO_SPARK_MODE_BOMBS, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-DUCK_AND_COVER, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-SPIRITED_AWAY, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-RUN_AWAY, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 24}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 2}
  - set_power: {who: player, name: SPARK_POWER, amount: 3}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

resource_round:
  claim: >-
    One Spark-priced use in hand, no detonator, no Attack and no other Bomb
    source, so the price buys a payout one whole enemy turn away and every
    Spark it hands back is the mode's own. No exclusive pair is claimed.

board:
  character: klee
  pilot: demolition
  hp: 24
  max_hp: 62
  block: 0
  energy: 2
  turn: 4
  resources:
    sparks: 3
  hand:
    - proto_spark_mode_bombs
    - duck_and_cover
    - spirited_away
    - run_away
  enemies:
    - name: "Act 1 enemy"
      hp: 40
      max_hp: 40
      block: 0
      intent: {kind: attack, amount: 16}
