# `KLEESPARK-BT3` -- the counting slots of the round's slate, machine-readable.
#
# WRITTEN BEFORE THE ROUND, and its ceilings computed by
# `local_tester round --plan-only` over these two boards before a single board
# is staged, which is what `EB-202` exists to make possible.
#
# ONE COUNTING SLOT, because the round asks ONE question on two boards. Both
# boards hold exactly one Spark-priced use -- the mode under test -- so
# `affordable_spark_uses` reads 1 on each (`EB-237` closed the defect that
# made the mode invisible to that count; `card_spark_prices` reads R225's
# amended clause in full, the top level OR the head of a `choose_one` mode).
#
#   C1  the priced mode is the only Spark sink   t01, t02   ceiling 2, threshold 2
#
# THE THRESHOLD EQUALS THE CEILING, which is what "the minimum that answers
# the question" costs. What `EB-202` forbids is the other direction -- a
# threshold ABOVE the ceiling, which `KLEESPARK-R1`'s `P1` carried at 4
# against 3.
#
# THE SLATE'S OWN PREDICTIONS ARE NOT IN HERE. `G1`-`G4` are counted off forms
# and off `execute-*.json` replay records rather than off a board's declared
# shape, so they carry no board predicate; they name their boards in the
# manifest's slate instead. This file holds COUNTING slots and nothing else.

slots:
  - id: C1
    threshold: 2
    question: >-
      Is the priced mode the ONLY affordable Spark sink -- a bank at or above
      3 and nothing else in hand that prices Sparks, so the question is what
      the bank buys rather than which sink it goes to?
    predicate:
      - {left: spark_bank, op: ">=", right: 3}
      - {left: affordable_spark_uses, op: "==", right: 1}
