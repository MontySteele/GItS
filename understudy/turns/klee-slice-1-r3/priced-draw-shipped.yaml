# KLEE SLICE 1, ROUND 3. THE BOARD IS RE-SET, AND THE REVIEWER SET IT.
#
# Round 2's pair read RETURNED this arm, and not on the card. Its words:
# "The board prices the prototype against 16 guaranteed damage and defense
# while offering three unknown, mostly unaffordable draws, and one grader
# consequently constructed an illegal comparison. This arm needs a board that
# can expose a real draw destination before whole-fight testing."
#
# That is a board defect with a named repair, so round 3 makes exactly the
# repair and nothing else: THE DRAW NOW HAS SOMEWHERE TO GO.
#
#   * ENERGY 4, not 2. On round 2's board the draw card ate half the turn and
#     left one energy for three cards. Here, playing the card under test leaves
#     THREE energy standing after it resolves.
#   * A HAND OF THREE, not four. Round 2 put Kaboom! on the board as well, so
#     the hand alone could absorb every point of energy and the drawn cards had
#     nothing left to be played with. The two cards that make the decision live
#     -- the paid Attack the free-Attack rule would otherwise take the bank
#     for, and the one standalone Block -- both stay.
#   * A DECLARED DRAW PILE. Three copies of a 1-energy Attack are granted to
#     the draw pile before the turn, on TOP of the pile the game already holds,
#     so the cards this board's draw reaches are real, cheap and affordable at
#     the energy that is left. The pile the live game holds is real either way;
#     what is new is that this file says what is in it.
#
# WHAT COULD NOT BE FIXED HERE, DISCLOSED RATHER THAN BURIED. The tier0 mirror
# `Board` has hp, block, energy, turn, resources, hand and enemies and NO DRAW
# PILE, so in the mirror both halves still draw from an empty pile and every
# draw is worth zero. The error runs ONE WAY -- the arm is UNDER-valued, so
# less likely to dominate, and dominance is the only thing the falsifier
# refuses -- and the fix is a `Board` field plus a line in `_state_from_board`,
# owed and unbuilt. The LIVE board has the real deck, so the blind packet and
# the replay are unaffected; it is the mirror alone that is blind. WHAT WAS
# ACTUALLY DRAWN IS RECORDED AT REPLAY, in the packet's round-3 section.
#
# THE SEED IS FRESH. A new board is a new fight: round 2's seed was pinned to
# round 2's enemy and energy, and reusing it would have carried a board this
# file no longer describes. The shipped half is staged first to discover the
# seed and it is then pinned onto both halves.
#
# KLEE SLICE 1 (R213 E2). One half of a MATCHED PAIR.
#
# HOW TO READ A PAIR. The files of a pair declare the SAME board -- same HP,
# same Block, same energy, same Spark bank, same enemy, same draw-pile grant,
# same alternatives in hand -- and differ in EXACTLY ONE CARD: the one under
# test. If the boards differed anywhere else, a change in how the turn plays
# could be attributed to the staging instead of to the card.
#
# THE TURN ID IS DELIBERATELY OPAQUE. It is printed into the design-blind
# packet the grader reads, so a word like "priced" or "draw" inside an id would
# tell the grader which arm they were holding. The FILENAME names the arm,
# because only the tooling and the packet-writer read filenames. MANIFEST.md is
# the map between them.
#
# NOTHING HERE IS A CLAIM THAT ANY ARM IS BETTER. The funnel refuses turns and
# never rates them (R213's first guard), and the designer of these rows may not
# grade them.
#
# THE QUESTION THIS SLICE ASKS (R213 E2): "Sparks mean free Attack" is reopened
# as likely upstream of Klee's Attack-spam identity. The engine puts it more
# sharply than the playtest did -- `combat.card_cost` zeroes ANY Attack at the
# threshold and `combat.play_card` debits the bank for it, both
# unconditionally -- so the bank has one destination and it is chosen for the
# player. This pair sets a shipped card that leaves the bank to the rule
# against a prototype that CHARGES the bank instead.
#
# THE BANK IS EXACTLY THREE, WHICH IS THE WHOLE POINT. Three is the free
# Attack's threshold and the prototype's price, so the bank buys exactly one of
# two things and the player must pick. A bank of four or more would let both
# happen and there would be no question left.
#
# THE BOARD TELEGRAPHS AN ATTACK. Defence is worth nothing against any other
# intent, and what the bank is worth against an incoming hit is half the
# question. If the live telegraph is not an attack, re-roll.
#
# NO LINE ON THIS BOARD IS LETHAL, and with a draw pile in play the arithmetic
# has to count what the draw can reach. The largest immediate total either half
# can produce is written out card by card in MANIFEST.md; the enemy's HP is set
# above it with the delayed Bomb counted as well.
#
# ONE FLAT-BLOCK COMPETITOR, deliberately: Duck and Cover (5 Block for 1),
# because a Spark payoff that nothing competes with is not a decision. It is
# the ONLY standalone Block here -- a second would make "defend" the answer by
# arithmetic rather than by choice.
#
# RAPID FIRE IS THE CONTROL, not filler. It is a 2-cost Attack, so at a bank of
# three the automatic rule makes it FREE and eats the bank -- exactly the
# alternative use of the bank the prototype competes against. Without a paid
# Attack on the board the free-Attack rule has nothing to spend itself on and
# the question cannot be asked at all.
#
# ARM 2: CAN THE BANK BUY VELOCITY INSTEAD OF AN ATTACK? (R213 E2.)
#
#   SHIPPED (this file): Eager to Help READS the bank, keeps it, and pays 2
#     cards for the bank merely existing -- the purest "watch it rise" face on
#     the sheet. The bank is still there afterwards for Rapid Fire.
#   PROTOTYPE: the draw is BOUGHT, at the free Attack's own price, so taking it
#     means Rapid Fire is not free this turn.

id: klee-slice1-r3-t03
character: KLEEMOD-KLEE

# The pair's seed, discovered by staging the SHIPPED half and then pinned onto
# BOTH halves, so a re-stage reproduces the same fight.
seed: 8D3369V27Z55

exact_hand: true

notes: |
  42/62 HP, no Block, 4 energy, a Spark bank of 3, and
  one enemy at 46 HP telegraphing an attack.

# STAGING RULE, for the operator and not for the grader: the telegraph is
# generated with the encounter, and defence is worth nothing against an intent
# that is not an attack. If the live telegraph is not an attack, re-roll the
# seed and stage again rather than recording the divergence.
#
# The list below is folded VERBATIM into the design-blind packet, so it carries
# mechanical facts about the staging ONLY -- never why the board was built,
# never which card is being looked at. The rationale lives in the header above,
# where no grader reads.
assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The draw pile is real and it is not empty. Three copies of a 1-energy
     Attack dealing 7 damage are added to it before the turn begins, and
     no card in the pile costs more than 2 energy. A card drawn this turn
     can therefore be played with the energy that is left."
  - "The encounter is GENERATED. This file can write the enemy's HP and
     Block and cannot write its INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board below
     declares a telegraphed ATTACK as the falsifier's input. If the live
     intent differs, the closeness reading is a reading of the DECLARED
     board and the packet is a picture of the LIVE one; they are two
     records, not one."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "The Spark bank is written to 3 through SPARK_POWER, which is how the
     live game holds Sparks. At 3 Sparks the next Attack played costs 0
     and consumes all 3."
  - "The player has no Strength and the enemy carries no aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."

staging:
  - give: {card: KLEEMOD-EAGER_TO_HELP, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-RAPID_FIRE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-DUCK_AND_COVER, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-KABOOM, pile: draw, upgraded: false, count: 3}
  - set_hp: {who: player, amount: 42}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 4}
  - set_power: {who: player, name: SPARK_POWER, amount: 3}
  - set_hp: {who: first, amount: 46}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

# The tier0 mirror. Read ONLY by `closeness`; never by the packet,
# which reads the live game. The parser refuses this file if the hand
# here and the hand staged above are not the same multiset of cards.
# The mirror has no draw pile -- see the header.
board:
  character: klee
  pilot: generic
  hp: 42
  max_hp: 62
  block: 0
  energy: 4
  turn: 3
  resources:
    sparks: 3
  hand:
    - eager_to_help
    - rapid_fire
    - duck_and_cover
  enemies:
    - name: "Seapunk"
      hp: 46
      max_hp: 46
      block: 0
      intent: {kind: attack, amount: 11}
