# FUNNEL BENCH 1 -- INSTRUMENT ONLY. A byte-for-byte copy of KLEESPARK-R2's
# board t06 (understudy/turns/klee-sparks-r2/t06.yaml) under a new id, so
# that a two-lane, two-read-worker round can be TIMED against R2's 372 s
# single-lane number without touching R2's published records. The seat
# sits in the SHADOW chair; nothing read here is a reading about a card.
#
# KLEESPARK-R2, BOARD F. THREE BODIES, AND BOTH SINKS PRICED AT TWO.
#
# See t01's header for what the round is and what the mirror cannot see, and
# t04's for why a three-body board pins its seed.
#
# WHAT THIS BOARD IS. Three enemies alive, a bank of 2, and two Spark-priced
# Attacks BOTH printed at 2: Dodoco Blast (seven to ALL) and Bang Bang! (five
# twice, at random). The bank buys exactly one of them, and the two cost the
# same, so the choice is entirely about what the board looks like rather than
# about arithmetic. It is the second S3 board (R221 B decides a slot on two
# agreeing grades, never one) and it is also the second S4 board -- Bang Bang!
# at a bank of exactly 2, which is the price question t03 asks in isolation.
#
# THE SLOTS THIS BOARD SITS UNDER ARE S1, S3 AND S4. S1: 2 >= 2 and 2 < 2 + 2.
# S3: three or more enemies, two or more affordable Spark uses. S4: bank == 2
# and the cheapest Spark price in hand == 2.
#
# THE SEED. `R7W86HG7WHUD` drew Twig Slime (S) + Leaf Slime (M) + Leaf Slime
# (S) on `kokomi-slice1-r4-t03` and `-t04`. The same caveat as t04 applies and
# is not repeated: those were Kokomi runs, the roll's character-independence is
# not established here, and the packet records what the game actually drew.
#
# NO LINE HERE IS LETHAL against the board: 7 to each of three 30 HP bodies, or
# 5 x2 at random, plus Kaboom! at 1 energy.

id: funnel-bench-1-t06
character: KLEEMOD-KLEE

# Pinned before the round (MANIFEST.md), and pinned for its ENCOUNTER.
seed: R7W86HG7WHUD

exact_hand: true

prototype: true

slots:
  - S1
  - S3
  - S4

notes: |
  40/62 HP, no Block, 3 energy, a Spark bank of 2, and three enemies alive.

assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The Spark bank is written to 2 through SPARK_POWER, which is how the
     live game holds Sparks."
  - "The encounter is GENERATED. This file can write each enemy's HP and
     can write only the FIRST enemy's Block, and it cannot write any
     intent or how many enemies there are -- the packet records whichever
     encounter and telegraphs the game actually drew."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "The player has no Strength and no enemy carries an aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."

# Needs a dev build carrying the prototype rows (klee-mod/build/deploy_proto.ps1).

staging:
  - give: {card: KLEEMOD-PROTO_SPARK_BLAST, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_SPARK_DOUBLE_TAP, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-KABOOM, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-DUCK_AND_COVER, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 40}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_power: {who: player, name: SPARK_POWER, amount: 2}
  - set_hp: {who: lowest_hp, amount: 30}
  - set_hp: {who: lowest_hp, amount: 30}
  - set_hp: {who: lowest_hp, amount: 30}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

board:
  character: klee
  pilot: demolition
  hp: 40
  max_hp: 62
  block: 0
  energy: 3
  turn: 5
  resources:
    sparks: 2
  hand:
    - proto_spark_blast
    - proto_spark_double_tap
    - kaboom
    - duck_and_cover
  enemies:
    - name: "Act 1 enemy (1)"
      hp: 30
      max_hp: 30
      block: 0
      intent: {kind: attack, amount: 8}
    - name: "Act 1 enemy (2)"
      hp: 30
      max_hp: 30
      block: 0
      intent: {kind: attack, amount: 6}
    - name: "Act 1 enemy (3)"
      hp: 30
      max_hp: 30
      block: 0
      intent: {kind: attack, amount: 6}
