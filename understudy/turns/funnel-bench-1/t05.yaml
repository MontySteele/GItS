# FUNNEL BENCH 1 -- INSTRUMENT ONLY. A byte-for-byte copy of KLEESPARK-R2's
# board t05 (understudy/turns/klee-sparks-r2/t05.yaml) under a new id, so
# that a two-lane, two-read-worker round can be TIMED against R2's 372 s
# single-lane number without touching R2's published records. The seat
# sits in the SHADOW chair; nothing read here is a reading about a card.
#
# KLEESPARK-R2, BOARD E. THE DRY SINK AGAIN, AT TWO DIFFERENT PRICES.
#
# See t01's header for what the round is and what the mirror cannot see.
#
# WHAT THIS BOARD IS. The second dry board, and the reason there are two: R221
# B DECIDES a slot on two or more agreeing grades, so a slot carried by one
# board can never be decided. This one holds TWO Spark-priced Attacks at two
# different prices -- Ka-pow! (1) and Firework Finale (3) -- against an empty
# bank, so the question is not "is this one card dead" but "is the whole Spark
# half of the hand dead".
#
# THE HAND HAS NO `gain_spark` ON IT, checked against docs/klee-cards.yaml the
# same way t02's is, and nothing in it places a Bomb either.
#
# THE SLOT THIS BOARD SITS UNDER IS S2: bank 0, at least one Spark-priced card
# in hand, none of them affordable.
#
# NO LINE HERE IS LETHAL. With both Spark Attacks unaffordable, the whole hand
# can produce two Kaboom! (2 energy, 14); the enemy's HP is set far above it.

id: funnel-bench-1-t05
character: KLEEMOD-KLEE

# Pinned before the round (MANIFEST.md). `klee-sparks-r1-t04`'s seed, which
# drew one body.
seed: XT4BE7LFY5XH

exact_hand: true

prototype: true

slots:
  - S2

notes: |
  36/62 HP, no Block, 3 energy, an EMPTY Spark bank, and one enemy
  telegraphing an attack.

assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The Spark bank is EMPTY, and the Spark power is absent rather than
     present at zero. Nothing has been played and nothing has detonated."
  - "The encounter is GENERATED. This file can write the enemy's HP and
     Block and cannot write its INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board below
     declares a telegraphed ATTACK as the falsifier's input."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "The player has no Strength and the enemy carries no aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."

# Needs a dev build carrying the prototype rows (klee-mod/build/deploy_proto.ps1).

staging:
  - give: {card: KLEEMOD-PROTO_SPARK_FINISHER, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_KABOOM_SINK, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-KABOOM, pile: hand, upgraded: false, count: 2}
  - give: {card: KLEEMOD-DUCK_AND_COVER, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 36}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_hp: {who: first, amount: 46}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

board:
  character: klee
  pilot: demolition
  hp: 36
  max_hp: 62
  block: 0
  energy: 3
  turn: 5
  resources:
    sparks: 0
  hand:
    - proto_spark_finisher
    - proto_kaboom_sink
    - kaboom
    - kaboom
    - duck_and_cover
  enemies:
    - name: "Act 1 enemy"
      hp: 46
      max_hp: 46
      block: 0
      intent: {kind: attack, amount: 11}
