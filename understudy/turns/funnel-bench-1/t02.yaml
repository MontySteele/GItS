# FUNNEL BENCH 1 -- INSTRUMENT ONLY. A byte-for-byte copy of KLEESPARK-R2's
# board t02 (understudy/turns/klee-sparks-r2/t02.yaml) under a new id, so
# that a two-lane, two-read-worker round can be TIMED against R2's 372 s
# single-lane number without touching R2's published records. The seat
# sits in the SHADOW chair; nothing read here is a reading about a card.
#
# KLEESPARK-R2, BOARD B. THE DRY SINK, AND NO GENERATOR IN HAND.
#
# See t01's header for what the round is and what the mirror cannot see.
#
# WHAT THIS BOARD IS. An empty Spark bank with a Spark-priced Attack in hand
# and NOTHING in hand that makes a Spark. `KLEESPARK-R1` staged two empty-bank
# boards (`t01`, `t08`) and BOTH of them held Powder Pop, so the reader could
# always answer "play the generator first" and the dry sink was never asked
# about on its own. That is P4's SPLIT half and packet sec.11.7 item 2 -- the
# sanity check R222 authorised. This board is the sanity check.
#
# THE SLOT THIS BOARD SITS UNDER IS S2: bank 0, at least one Spark-priced card
# in hand, and NONE of them affordable.
#
# THE HAND HAS NO `gain_spark` ON IT. Kaboom! (damage), Duck and Cover (block)
# and Jumpy Dumpty (damage, place bomb) are checked against docs/klee-cards.yaml
# -- none prints a Spark rider, and Jumpy Dumpty's Bomb is a Bomb, not a Spark.
# The Bomb can detonate later and give Sparks THEN; it gives none on this turn,
# which is the whole point of a dry board.
#
# NO LINE HERE IS LETHAL. The largest immediate total is Jumpy Dumpty (2
# energy, 8 x2 = 16) plus Kaboom! (1 energy, 7) = 23, with a Bomb at 6 landing
# later; the enemy's HP is set above all of it.

id: funnel-bench-1-t02
character: KLEEMOD-KLEE

# Pinned before the round (MANIFEST.md). `klee-sparks-r1-t01`'s seed, which
# drew one body.
seed: R805DJ56LZHM

exact_hand: true

prototype: true

slots:
  - S2

notes: |
  40/62 HP, no Block, 3 energy, an EMPTY Spark bank, and one enemy
  telegraphing an attack.

assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The Spark bank is EMPTY, and the Spark power is absent rather than
     present at zero. Nothing has been played and nothing has detonated."
  - "The encounter is GENERATED. This file can write the enemy's HP and
     Block and cannot write its INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board below
     declares a telegraphed ATTACK as the falsifier's input."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "The player has no Strength and the enemy carries no aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."

# Needs a dev build carrying the prototype rows (klee-mod/build/deploy_proto.ps1).

staging:
  - give: {card: KLEEMOD-PROTO_SPARK_STRIKE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-KABOOM, pile: hand, upgraded: false, count: 2}
  - give: {card: KLEEMOD-DUCK_AND_COVER, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-JUMPY_DUMPTY, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 40}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_hp: {who: first, amount: 46}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

board:
  character: klee
  pilot: demolition
  hp: 40
  max_hp: 62
  block: 0
  energy: 3
  turn: 4
  resources:
    sparks: 0
  hand:
    - proto_spark_strike
    - kaboom
    - kaboom
    - duck_and_cover
    - jumpy_dumpty
  enemies:
    - name: "Act 1 enemy"
      hp: 46
      max_hp: 46
      block: 0
      intent: {kind: attack, amount: 11}
