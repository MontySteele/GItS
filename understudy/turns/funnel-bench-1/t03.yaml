# FUNNEL BENCH 1 -- INSTRUMENT ONLY. A byte-for-byte copy of KLEESPARK-R2's
# board t03 (understudy/turns/klee-sparks-r2/t03.yaml) under a new id, so
# that a two-lane, two-read-worker round can be TIMED against R2's 372 s
# single-lane number without touching R2's published records. The seat
# sits in the SHADOW chair; nothing read here is a reading about a card.
#
# KLEESPARK-R2, BOARD C. BANG BANG! AT A BANK OF EXACTLY TWO, NO BOMB OUT.
#
# See t01's header for what the round is and what the mirror cannot see.
#
# WHAT THIS BOARD IS. The bank holds exactly 2 and the only Spark-priced card
# in hand is Bang Bang!, which is printed at 2. Nothing else in the hand makes,
# spends or reads a Spark, and NOTHING IN THE HAND PLACES A BOMB -- no Jumpy
# Dumpty, no Pop!, no Powder Pop -- so no detonation can move the bank while
# the graded line is being played. That is what makes this board the price
# arithmetic and nothing else: after Bang Bang! the bank must read 0.
#
# WHY IT IS HERE. `KLEESPARK-R1` never replayed a line that paid a price of 2
# on a bank of exactly 2, so whether a 2-priced row spends 2 -- rather than
# rounding, spending the bank, or refusing -- is unconfirmed on the live build.
# It is the one open price-arithmetic candidate in the arm.
#
# THE SLOT THIS BOARD SITS UNDER IS S4: bank == 2 and the CHEAPEST Spark price
# in hand == 2. It deliberately does NOT sit under S1: with one affordable use
# priced at exactly the bank, there is nothing to hold back for and the board
# poses no spend-versus-hold question. Two boards, two different questions.
#
# NO LINE HERE IS LETHAL. The largest immediate total is Bang Bang! (0 energy,
# 5 x2 = 10) plus two Kaboom! (2 energy, 14) = 24; the enemy's HP is set above
# it.

id: funnel-bench-1-t03
character: KLEEMOD-KLEE

# Pinned before the round (MANIFEST.md). `klee-sparks-r1-t02`'s seed, which
# drew one body.
seed: YX7PB48WR7R4

exact_hand: true

prototype: true

slots:
  - S4

notes: |
  38/62 HP, no Block, 3 energy, a Spark bank of 2, and one enemy
  telegraphing an attack.

assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The Spark bank is written to 2 through SPARK_POWER, which is how the
     live game holds Sparks."
  - "No Bomb is on the field. Nothing in this file places one and nothing
     in the hand places one, so no detonation can occur on this turn."
  - "The encounter is GENERATED. This file can write the enemy's HP and
     Block and cannot write its INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board below
     declares a telegraphed ATTACK as the falsifier's input."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "The player has no Strength and the enemy carries no aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."

# Needs a dev build carrying the prototype rows (klee-mod/build/deploy_proto.ps1).

staging:
  - give: {card: KLEEMOD-PROTO_SPARK_DOUBLE_TAP, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-KABOOM, pile: hand, upgraded: false, count: 2}
  - give: {card: KLEEMOD-DUCK_AND_COVER, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 38}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_power: {who: player, name: SPARK_POWER, amount: 2}
  - set_hp: {who: first, amount: 46}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

board:
  character: klee
  pilot: demolition
  hp: 38
  max_hp: 62
  block: 0
  energy: 3
  turn: 6
  resources:
    sparks: 2
  hand:
    - proto_spark_double_tap
    - kaboom
    - kaboom
    - duck_and_cover
  enemies:
    - name: "Act 1 enemy"
      hp: 46
      max_hp: 46
      block: 0
      intent: {kind: attack, amount: 11}
