# `KLEESPARK-R1` — the counting slots of the round's slate, machine-readable.
#
# WRITTEN AFTER THE ROUND, AND THAT IS EXACTLY WHY IT IS HERE. This file is
# EB-202's worked case, not a re-registration: the round is graded and its
# grade STANDS AS PUBLISHED (R101b). What it records is the predicate `P1` was
# always about, in a form a check can read, so the next round's threshold is
# tested against its own board set BEFORE the boards are staged rather than
# after the pair read.
#
# `P1` (packet §10.9, slate row 1): *does a graded turn contain a visible
# spend-versus-hold choice — two Spark uses competing, both affordable, in one
# hand?* Predicted YES on at least 4 of 8.
#
# "COMPETING" IS THE WORD THE PROSE COULD NOT HOLD. `MANIFEST.md` counted four
# boards on "two or more Spark uses in hand that the bank can each
# INDIVIDUALLY afford", which is true of `t02`, `t03`, `t06` and `t07`. `P1`
# asks something stricter: the bank must reach the cheapest use AND fall short
# of buying every use it could afford, or there is nothing to hold back for.
# Two clauses:
#
#   bank >= min_spark_price              — at least one use is reachable
#   bank <  affordable_spark_price_sum   — it cannot have them all
#
# On this set that qualifies `t02` (bank 1; 1 + 1), `t03` (bank 2; 1 + 2) and
# `t06` (bank 2; 1 + 2), and refuses `t07` (bank 4 pays 3 + 1 outright),
# `t01`/`t08` (bank 0, nothing reachable) and `t04`/`t05` (the Rare Power
# prices no Sparks through `spend_spark`, so the hand holds no priced use).
# **Ceiling 3, threshold 4** — the plan is refused, which is the row's lock.
#
# The other five slates rows are not here: `P2`–`P6` are graded off forms and
# replays rather than off a board's own shape, so there is no board predicate
# to state. This file holds COUNTING slots only, and a slot with no threshold
# does not belong in it.

slots:
  - id: P1
    threshold: 4
    question: >-
      Does a graded turn contain a visible spend-versus-hold choice — two
      Spark uses competing, both affordable, in one hand?
    predicate:
      - {left: spark_bank, op: ">=", right: min_spark_price}
      - {left: spark_bank, op: "<", right: affordable_spark_price_sum}
