# KLEESPARK-R1, TURN 6. THE TWO AoE SINKS, AND A BANK THAT PAYS ONE.
#
# See t01's header for what the round is and what the mirror cannot see.
#
# WHAT THIS BOARD IS. The Uncommon AoE sink (Dodoco Blast, priced at 2) beside
# the Common AoE sink (Tinder Toss, priced at 1), on a bank of 2. Both are
# affordable; together they cost 3 and the bank holds 2. The board is the
# arm's AoE half, which the other seven boards do not otherwise reach.
#
# THE ENEMY COUNT IS THE GAME'S AND NOT THIS FILE'S. An AoE card is worth what
# the encounter makes it worth, and the encounter is generated from the run
# seed. This file writes HP and Block for the enemies the seed produced and
# writes no enemy of its own; the packet records what was actually on screen,
# and the mirrored board below is written to match it after staging.
#
# NO LINE HERE IS LETHAL against the HP written below: the largest immediate
# total per enemy is Dodoco Blast (7) plus Tinder Toss (4) -- and the bank
# pays only one of them -- plus Kaboom! (7) on one target.

id: klee-sparks-r1-t06
character: KLEEMOD-KLEE

# The seed the GAME rolled on this turn's first staging, written back after
# the fact rather than placeheld before it, so a re-stage reproduces the
# fight. Recorded 2026-08-29 on the dev build 0.2.1481+proto.
seed: VG1MYKCZD93V

exact_hand: true

prototype: true

notes: |
  42/62 HP, no Block, 3 energy, a Spark bank of 2, and the encounter the
  seed drew.

assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The Spark bank is written to 2 through SPARK_POWER, which is how the
     live game holds Sparks."
  - "The encounter is GENERATED. This file can write each enemy's HP and
     Block and cannot write its INTENT or how many enemies there are --
     the packet records whichever encounter and telegraph the game
     actually drew."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "The player has no Strength and no enemy carries an aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."

staging:
  - give: {card: KLEEMOD-PROTO_SPARK_BLAST, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_SPARK_SWEEP, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-KABOOM, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-DUCK_AND_COVER, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 42}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_power: {who: player, name: SPARK_POWER, amount: 2}
  - set_hp: {who: first, amount: 46}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

board:
  character: klee
  pilot: demolition
  hp: 42
  max_hp: 62
  block: 0
  energy: 3
  turn: 4
  resources:
    sparks: 2
  hand:
    - proto_spark_blast
    - proto_spark_sweep
    - kaboom
    - duck_and_cover
  enemies:
    - name: "Act 1 enemy"
      hp: 46
      max_hp: 46
      block: 0
      intent: {kind: attack, amount: 11}
