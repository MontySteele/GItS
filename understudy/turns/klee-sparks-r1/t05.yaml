# KLEESPARK-R1, TURN 5. THE RARE POWER, ON A BANK THAT IS SHORT.
#
# See t01's header for what the round is and what the mirror cannot see.
#
# WHAT THIS BOARD IS. The Power's other half. Same card, same 2-energy cost,
# and a bank of 1 -- one third of a single conversion. The hand also holds the
# Basic sink (Ka-pow!, priced at 1), which the bank CAN pay, so the board is
# not simply "nothing is affordable": one thing is, and it is not the Power's.
#
# THIS IS THE SECOND AND LAST BOARD CARRYING THE POWER. t04 is the paying
# half. Nothing else differs between them except the bank and one card of
# filler, so a difference in how the two turns read is attributable to the
# bank rather than to the staging.
#
# WHAT THE PACKET DOES NOT TELL THE READER, and this is the point of the pair:
# neither file says which half it is. The bank is on the page and the price is
# on the face, and whether a reader can tell a payoff from a brick from those
# two facts alone is the question.
#
# NO LINE HERE IS LETHAL. The largest immediate total is Ka-pow! (0 energy,
# 7, paying the whole bank) plus Kaboom! (1 energy, 7) plus Kaboom! (1
# energy, 7) = 21.

