# KLEESPARK-R1, TURN 7. A DEEP BANK, AND THE EXPENSIVE SINK.
#
# See t01's header for what the round is and what the mirror cannot see.
#
# WHAT THIS BOARD IS. The bank has been allowed to climb to 4 -- the top of
# the range this round staged -- and the hand holds the most expensive sink on
# the surface (Firework Finale, priced at 3, Exhaust) beside the cheapest
# (Fwoosh!, priced at 1) and a generator (Powder Pop). 4 pays BOTH sinks, so
# this is deliberately NOT a competing-uses board: a round of eight that only
# ever showed banks too thin to buy twice would be a round about thin banks.
#
# THE GENERATOR IS IN HAND ON PURPOSE, because a deep bank is where holding
# has to be argued for rather than assumed. Powder Pop makes the bank 5 for 0
# energy and the reader can spend it or bank it further.
#
# NO LINE HERE IS LETHAL. The largest immediate total is Firework Finale (18,
# paying 3) plus Fwoosh! (8, paying 1) plus Duck and Cover, at 1 of 3 energy
# spent -- 26 -- with a Bomb at 5 landing later. The enemy's HP is set above
# the sum.
#
# THE MIRROR DISAGREES WITH THE LIVE BUILD HERE, the same one way t04's header
# sets out: at a bank of 4 the flag-off mirror still lets the shipped base
# rule zero an Attack and eat 3 Sparks. The mirror is therefore richer than
# the live board, and a richer mirror can only make the closeness falsifier
# stricter.

