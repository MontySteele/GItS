# KLEESPARK-R1, TURN 4. THE RARE POWER, ON A BANK THAT CAN PAY.
#
# See t01's header for what the round is and what the mirror cannot see.
#
# WHAT THIS BOARD IS. Spark Knight's Oath -- the strict Rare Power, the eighth
# row -- in hand on a deck that has been generating. Its face converts every
# Attack that does NOT already print a Spark price into a 3-Spark, 0-Energy
# card. The bank holds 3, which is exactly one such conversion, and the hand
# holds two unpriced Attacks (Kaboom!, Jumpy Dumpty) for it to convert.
#
# THIS IS ONE OF EXACTLY TWO BOARDS CARRYING THE POWER, and it is the half
# where the bank CAN pay. t05 is the half where it is short. Two boards is
# what the round allotted the Power: it is one Rare in a deck, and staging it
# more often would say the deck holds more Rares than it does.
#
# THE POWER IS A TRAP ON ITS OWN BOARD AND THAT IS THE CARD, NOT THE STAGING.
# Playing it costs 2 of 3 energy and leaves 1; the conversion then makes the
# remaining Attacks free of energy but priced at 3 Sparks each, against a bank
# of 3. Whether that reads as a payoff or as a brick is the question the
# funnel is being handed, and this file states the arithmetic without
# answering it.
#
# THE MIRROR AND THE LIVE BUILD DISAGREE ON THIS BOARD, and the disagreement
# runs one way. At a bank of 3 the mirror still applies the SHIPPED base rule
# (the next Attack goes free and eats the bank); the live +proto build has
# retired it. So the mirror scores Kaboom! as free where the live game charges
# 1 energy for it, which makes the mirror's top lines RICHER than the live
# board's. Dominance is the only thing the closeness falsifier refuses, so an
# over-rich mirror can only make the falsifier stricter, never laxer.
#
# NO LINE HERE IS LETHAL. The largest immediate total, live, is Jumpy Dumpty
# (2 energy, 8 x2 = 16) plus Kaboom! (1 energy, 7) = 23 with the Oath unplayed,
# and 7 with it played; a Bomb at 6 lands later. The enemy's HP is above all
# of it.

id: klee-sparks-r1-t04
character: KLEEMOD-KLEE

exact_hand: true

prototype: true

notes: |
  42/62 HP, no Block, 3 energy, a Spark bank of 3, and one enemy
  telegraphing an attack.

assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The Spark bank is written to 3 through SPARK_POWER, which is how the
     live game holds Sparks."
  - "The encounter is GENERATED. This file can write the enemy's HP and
     Block and cannot write its INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board below
     declares a telegraphed ATTACK as the falsifier's input."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "The player has no Strength and the enemy carries no aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."

staging:
  - give: {card: KLEEMOD-PROTO_TRUE_SPARK_KNIGHT, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-KABOOM, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-JUMPY_DUMPTY, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-DUCK_AND_COVER, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 42}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_power: {who: player, name: SPARK_POWER, amount: 3}
  - set_hp: {who: first, amount: 46}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

board:
  character: klee
  pilot: demolition
  hp: 42
  max_hp: 62
  block: 0
  energy: 3
  turn: 5
  resources:
    sparks: 3
  hand:
    - proto_true_spark_knight
    - kaboom
    - jumpy_dumpty
    - duck_and_cover
  enemies:
    - name: "Act 1 enemy"
      hp: 46
      max_hp: 46
      block: 0
      intent: {kind: attack, amount: 11}
