# KLEESPARK-R2, BOARD D. THREE BODIES, AN AoE SINK AND A SINGLE-TARGET SINK.
#
# See t01's header for what the round is and what the mirror cannot see.
#
# WHAT THIS BOARD IS. Three enemies alive, a bank of 2, and two Spark-priced
# Attacks the bank can each afford: Dodoco Blast (2, seven to ALL) and Fwoosh!
# (1, eight to ONE). `KLEESPARK-R1` sec.11.6 item 4: *"It could not put an AoE
# card in front of two enemies. The encounter is the seed's, and the seed gave
# one body on both AoE boards."* This board is that repair, and it is why this
# file pins a seed that is ALREADY RECORDED ON DISK as having drawn three
# bodies rather than taking whatever the next roll gives.
#
# THE SEED IS THE ONLY LEVER THIS FILE HAS OVER THE ENCOUNTER, and it is not a
# certain one. `NMQLUYZDLV` drew Twig Slime (S) + Leaf Slime (M) + Leaf Slime
# (S) on `kokomi-slice1-t03`, `-t04`, `-t05`, `kokomi-slice1-r2-t03..05` and
# `kokomi-slice1-r3-t03..05` -- six recorded stagings, all three-body. Those
# were KOKOMI runs. Whether the Act-1 encounter roll is character-independent
# is NOT established here, so if this staging draws fewer than three bodies the
# packet records what it drew, S3 goes UNREACHED on this board, and the round
# says so rather than smoothing it.
#
# THE ENEMY HP IS LEVELLED, and that is a staging fact rather than a claim.
# The three slimes roll small and different HP, and an AoE that kills two of
# them outright would make the board's question arithmetic rather than a
# choice. `set_hp {who: lowest_hp}` three times raises the three lowest in
# turn, which lands all three at 30 when 30 is above every rolled value.
#
# THE SLOTS THIS BOARD SITS UNDER ARE S1 AND S3. S1: 2 >= 1 and 2 < 1 + 2 = 3,
# so the bank reaches the cheaper use and cannot buy both. S3: three or more
# enemies with two or more affordable Spark uses.
#
# NO LINE HERE IS LETHAL against the board. Dodoco Blast is 7 to each of three
# 30 HP bodies; Fwoosh! is 8 to one; Kaboom! is 7 to one at 1 energy.

id: klee-sparks-r2-t04
character: KLEEMOD-KLEE

# Pinned before the round (MANIFEST.md), and pinned for its ENCOUNTER: this is
# the seed recorded three-body on six earlier stagings.
seed: NMQLUYZDLV

exact_hand: true

prototype: true

slots:
  - S1
  - S3

notes: |
  42/62 HP, no Block, 3 energy, a Spark bank of 2, and three enemies alive.

assumptions:
  - "The hand is EXACTLY the list below and nothing else. The hand the
     game dealt is emptied before these cards are given, and a packet
     whose live hand is not this list is refused rather than written."
  - "The Spark bank is written to 2 through SPARK_POWER, which is how the
     live game holds Sparks."
  - "The encounter is GENERATED. This file can write each enemy's HP and
     can write only the FIRST enemy's Block, and it cannot write any
     intent or how many enemies there are -- the packet records whichever
     encounter and telegraphs the game actually drew."
  - "Every card is granted unupgraded. An upgrade moves printed numbers,
     so an upgraded grant is a different board."
  - "The player has no Strength and no enemy carries an aura, Vulnerable
     or Weak. Every Klee attack applies Pyro, and a reaction on top of a
     hit would move every number the falsifier scores."

# Needs a dev build carrying the prototype rows (klee-mod/build/deploy_proto.ps1).

staging:
  - give: {card: KLEEMOD-PROTO_SPARK_BLAST, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_SPARK_STRIKE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-KABOOM, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-DUCK_AND_COVER, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 42}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_power: {who: player, name: SPARK_POWER, amount: 2}
  - set_hp: {who: lowest_hp, amount: 30}
  - set_hp: {who: lowest_hp, amount: 30}
  - set_hp: {who: lowest_hp, amount: 30}
  - set_block: {who: first, amount: 0}
  - read: "the staged board"

board:
  character: klee
  pilot: demolition
  hp: 42
  max_hp: 62
  block: 0
  energy: 3
  turn: 4
  resources:
    sparks: 2
  hand:
    - proto_spark_blast
    - proto_spark_strike
    - kaboom
    - duck_and_cover
  enemies:
    - name: "Act 1 enemy (1)"
      hp: 30
      max_hp: 30
      block: 0
      intent: {kind: attack, amount: 8}
    - name: "Act 1 enemy (2)"
      hp: 30
      max_hp: 30
      block: 0
      intent: {kind: attack, amount: 6}
    - name: "Act 1 enemy (3)"
      hp: 30
      max_hp: 30
      block: 0
      intent: {kind: attack, amount: 6}
