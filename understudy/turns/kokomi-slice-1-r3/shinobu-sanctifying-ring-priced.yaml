# KOKOMI SLICE 1, ROUND 3. One half of a MATCHED SET.
#
# ROUND 3 IS ROUND 2'S BOARDS ON HONEST FACES. Round 2 graded 4 SURVIVES and 7
# REFUSED, every refusal `intent_insensitive`, and three of those on SHIPPED
# control halves -- and the round's own finding explains all seven. `All
# Streams Flow to the Sea` printed a number that already carried its Charge
# rider and then said "Scales with Charge" beneath it, so four of eleven
# graders and the pair reviewer read the card as 13 where the game deals 9.
# The phantom four manufactured the lethal line every refusal rests on;
# `staged_turn execute` settled it live at 22 HP -> 1. That is EB-164, it is
# fixed at the GENERATOR (a face states its scaling exactly once), and this
# round re-runs the same eleven boards against faces that say what is true.
#
# NOT ONE PRINTED NUMBER MOVED between round 2 and round 3. The fix was
# wording; the sheets are frozen (R213). The only board change is group D's
# seed, below.
#
# WHY THERE IS A ROUND 2. Round 1 staged the same eleven cards and the
# independent pair read RETURNED every one of them, with the same reason on six
# of the seven: THE BOARDS, NOT THE CARDS. The hand the game dealt on top of the
# declared one supplied the whole race-versus-turtle choice before the card
# under test was reached, and no threshold on either half of any card was set,
# so nothing the card did could cross one. Round 2 changes the BOARDS and not
# one printed number.
#
# THE THREE THINGS THAT CHANGED, and they are the same three on every file:
#   1. THE HAND IS EXACTLY THE DECLARED HAND. `exact_hand: true` empties the
#      dealt hand to the bottom of the draw pile before the grants, so the
#      alternatives are the ones this file chose and no others. Round 1's
#      packets carried ten cards where the file declared four or five.
#   2. NO REDUNDANT STANDALONE BLOCK. Every extra Block card is one the board
#      supplies rather than the card, and a Block card that beats the card's own
#      Block half at the same price makes the half unreadable. Where one is
#      still in hand, this file's header says what it is there to do.
#   3. THRESHOLDS ON BOTH HALVES. Enemy HP is written so the damage half either
#      crosses a kill line or provably cannot, and the player's HP is written so
#      the telegraphed hit takes at least a quarter of what is left -- at 48/70
#      a single-digit telegraph is cosmetic and a Block half answers nothing.
#
# HOW TO READ A SET. Within a group the files declare the SAME board -- same HP,
# same Block, same energy, same Charge, same enemies, same alternatives in hand
# -- and differ in EXACTLY ONE CARD: the one under test. If the boards differed
# anywhere else, a change in how the turn plays could be attributed to the
# difference instead of to the card.
#
# THE SEED IS PART OF THE SET. The encounter is GENERATED, so every half of a
# group is staged on ONE seed, pinned in MANIFEST.md and carried over from round
# 1 so the fight is the one these boards were written against.
#
# THE TURN ID IS DELIBERATELY OPAQUE. It is printed into the design-blind packet
# the grader reads, so nothing in it names an arm. The FILENAME names the arm,
# because only the tooling and the packet-writer read filenames.
#
# NOTHING HERE IS A CLAIM THAT ANY ARM IS BETTER. The funnel refuses turns and
# never rates them, and the designer of these rows may not grade them.
#
# GROUP B -- WHAT SHINOBU'S BLOCK COSTS. Three energy, three bodies.
#
# THE PRESCRIPTIONS THIS BOARD EXECUTES, from the round-1 pair read:
#   (either)  "Change the board so Warding Ring itself controls a threshold --
#              ideally where its 3 AoE damage kills or sets up multiple
#              enemies, while its 4 Block answers meaningful surviving damage.
#              Nereid's Ascension currently decides the board before Shinobu
#              matters."
#   (priced)  "Change the board, not merely the price: create AoE thresholds
#              where 3 damage plus 4 Block is a credible full-turn package."
#
# BOTH THRESHOLDS ARE WRITTEN, and they are the two halves of the card:
#   * THE DAMAGE HALF KILLS TWO BODIES. The two non-attacking enemies are
#     written to 3 HP, which is exactly the AoE's number. One card removes both.
#   * THE BLOCK HALF FULLY ANSWERS THE TELEGRAPH. The attacker's hit is 4 and
#     the Block half is 4. Nothing gets through, and nothing is wasted.
# The pinned seed is the reason those two numbers can both be true at once: its
# first fight is three bodies with one attacker, and that attacker's telegraph
# is the size of the Block half already.
#
# NO STANDALONE BLOCK CARD AT ALL. Round 1 put a 5-Block card beside a 4-Block
# half at the same price, which made the half unreadable -- the reviewer's words
# were that neither grader played or seriously weighed the card. There is no
# other Block on this board, so whatever the Block half is worth, it is worth it
# on its own.
#
# TWO ATTACKS AGAINST THREE BODIES, and the ratio is the design. A hand holding
# three single-target attacks can clear the two small bodies without the AoE,
# and then "damage all" and "damage one" are measuring the same thing. With two,
# clearing both small bodies is something only the AoE does in one card.
#
# THE ROUND-3 CHANGE ON THIS BOARD: THE ATTACKER IS OUT OF LETHAL REACH.
# Round 2 wrote it at 10 HP and called killing it "the third line, the one that
# competes with the Block half" -- but at TRUE card values the two 1-cost
# attacks are 6 + 9 = 15 for two of the three energy, so it was not a competing
# line, it was a strictly better one that removed the telegraph and left a
# whole energy spare. Both of this group's round-2 refusals were therefore
# SOUND: unlike groups C and D, they did not rest on the misread face. The
# attacker is given 6 Block, an effective 16 against that ceiling of 15, so no
# line on this board removes the hit and the mode choice is actually asked --
# Block rather than HP because `set_hp` clamps at a creature's own maximum and
# this body generates at 10/10. Nothing else moves:
# the two small bodies stay at 3, which is the AoE's own number, and the
# telegraph stays at 4, which is the Block half's.
#
# THREE energy is the smallest budget on which all three shapes are affordable:
# at two the cost-3 shape is not a hard choice, it is a dead card, and a dead
# card is not an arm.

id: kokomi-slice1-r3-t05
character: KLEEMOD-KOKOMI

prototype: true

# EB-165's door: the dealt hand is emptied to the bottom of the draw pile
# before the grants below, so the packet shows exactly these cards.
exact_hand: true

notes: |
  16/70 HP, no Block, 3 energy, a Charge bank of 8, and three enemies: one at
  10 HP behind 6 Block telegraphing an attack, two at 3 HP telegraphing Status
  cards.

# STAGING RULE, for the operator and not for the grader: the telegraph is
# generated with the encounter, and defence is worth nothing against an intent
# that is not an attack. If the live telegraph is not an attack, re-roll the
# seed and stage again rather than recording the divergence.
#
# The list below is folded VERBATIM into the design-blind packet, so it carries
# mechanical facts about the staging ONLY -- never why the board was built,
# never which card is being looked at. The rationale lives in the header above,
# where no grader reads.
assumptions:
  - "THE HAND BELOW IS THE WHOLE HAND. The cards the game dealt at the
     start of this fight were moved to the bottom of the draw pile before
     these were granted, so what is printed here is what was set up and
     nothing else."
  - "The encounter is GENERATED. This file can write the enemies' HP and
     Block and cannot write their INTENT -- the packet records whichever
     telegraph the game actually drew, and the mirrored board declares a
     telegraphed ATTACK as the falsifier's input. If the live intent
     differs, the closeness reading is a reading of the DECLARED board and
     the packet is a picture of the LIVE one; they are two records, not
     one."
  - "Every card is granted unupgraded. An upgrade moves printed numbers, so
     an upgraded grant is a different board."
  - "Charge is written to 8 through the registered resource. All Streams
     Flow to the Sea reads it at one point per two Charge."
  - "The player has no Strength and the enemies carry no aura, Vulnerable
     or Weak. A reaction on top of a hit would move every number the
     falsifier scores."
  - "The board carries THREE living enemies rather than one."

# This file names a row on the quarantined staging surface, so it cannot be
# staged until a dev build carrying those rows is deployed. Until then it is
# closeness-only, which needs no game.
staging:
  - give: {card: KLEEMOD-PROTO_SHINOBU_SANCTIFYING_RING_PRICED, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-WATERS_EDGE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-ALL_STREAMS_FLOW, pile: hand, upgraded: false}
  - set_hp: {who: player, amount: 16}
  - set_block: {who: player, amount: 0}
  - set_energy: {amount: 3}
  - set_resource: {name: KLEEMOD_CHARGE, amount: 8}
  # THE TWO NON-ATTACKING BODIES, WRITTEN TO THE AoE's OWN NUMBER. Addressed by
  # `highest_hp` twice rather than by name, because a display name is the one
  # spelling that changes when a seed is re-rolled. On the pinned fight the two
  # are the largest bodies on the board and the attacker is the smallest, so the
  # first write takes the larger of the two and the second takes the other.
  - set_hp: {who: highest_hp, amount: 3}
  - set_hp: {who: highest_hp, amount: 3}
  # AND THE ATTACKER IS PUT OUT OF LETHAL REACH -- the round-3 change to this
  # board. At 10 HP and no Block it died to two 1-cost attacks (6 + 9 = 15)
  # with a whole energy to spare, so the turn had a line that removed the
  # telegraph and the mode choice was never asked. It is given 6 Block, which
  # puts it at an effective 16 against a three-energy ceiling of 15 on one
  # body: the best single-target line now leaves it alive on 1.
  #
  # WHY BLOCK AND NOT HP. `set_hp` clamps at the creature's max, and this body
  # generates at 10/10 -- a write of 16 came back as 10, which is how we know.
  # Block is the only verb in the grammar that can raise an enemy's effective
  # durability above its own maximum.
  #
  # THE ORDER MATTERS: after the two writes above the board reads 10 / 3 / 3,
  # so `highest_hp` is now the attacker itself, which is why this comes third.
  - set_block: {who: highest_hp, amount: 6}
  - read: "the staged board"

# The tier0 mirror. Read ONLY by `closeness`; never by the packet,
# which reads the live game. The parser refuses this file if the hand
# here and the hand staged above are not the same multiset of cards.
board:
  character: kokomi
  pilot: generic
  hp: 16
  max_hp: 70
  block: 0
  energy: 3
  turn: 3
  resources:
    charge: 8
  hand:
    - proto_shinobu_sanctifying_ring_priced
    - waters_edge
    - all_streams_flow
  enemies:
    - name: "Act-1 attacker"
      hp: 10
      max_hp: 10
      block: 6
      intent: {kind: attack, amount: 4}
    - name: "Act-1 second body"
      hp: 3
      max_hp: 32
      block: 0
      intent: {kind: inject, status: slimed, count: 2}
    - name: "Act-1 third body"
      hp: 3
      max_hp: 15
      block: 0
      intent: {kind: inject, status: slimed, count: 1}
