# EB-184's live acceptance: THE REFUSED LINE, REPLAYED.
#
# Kokomi slice 1 round 4 `t02`. The seat took the *Gain 3 Block* half of
# `proto_thoma_crimson_ooyoroi_either` -- a `choose_one` card the codegen types
# ATTACK for the sake of the mode that aims -- and wrote no target, correctly
# from the printed face. `ExecutePlayCard` asked the CARD's `TargetType`, saw
# `AnyEnemy`, and refused with "Card requires a target. Provide 'target' with
# an entity_id." The line never resolved and the pair read RETURNED the whole
# arm on that alone.
#
# The fix (`GitsModalTargeting` + `IModalCard`) asks the chosen MODE instead.
# This file is the acceptance the BACKLOG row names: the Block mode replays
# with no target. Its twin, `eb184-modal-damage-needs-target.yaml`, is the
# other half -- the damage mode still demands one -- and is SEEN TO FAIL by
# construction.
#
# PRECONDITIONS: a dev build (`klee-mod\build\deploy_proto.ps1`), because the
# row is quarantined out of every release build.
#
# WHAT A PASS PROVES, EXACTLY: a targetless mode of an Attack-typed modal card
# posts, resolves, and lands its printed number. It proves nothing about the
# arm's design -- the pair read owns that, and this run is a hand-set board
# under Guardrail-7 besides.

name: eb184-modal-block-no-target
character: KLEEMOD-KLEE
turns: 6

prototype: true

notes: |
  One prototype modal Attack granted to hand, played with the Block mode named
  and NO target, and the 3 Block it prints landing on the player.

assumptions:
  - "`KLEEMOD-PROTO_THOMA_CRIMSON_OOYOROI_EITHER` is the surface row's ModelDb
     entry. If the build is not a dev build the first step fails with the give
     endpoint's own 'no card matched', which is the quarantine working."
  - "Energy is written to 3 first, so no refusal here can be
     EnergyCostTooHigh wearing the answer the scenario is looking for."
  - "The player's Block is written to 0 first, so the 3 read after the play is
     this card's and not a starter's."
  - "The card is granted UNUPGRADED; the surface carries no upgrade delta for
     this row, so the upgraded face does not exist to test."
  - "Nothing on Klee's opening board multiplies Block, so 3 printed is 3
     landed."
  - "`mode:` is passed to the bridge VERBATIM. The bridge owns the match
     against the card's own printed mode labels, so the string here is the
     sheet's label and a label edit on the surface is an edit here too."

steps:
  - give: {card: KLEEMOD-PROTO_THOMA_CRIMSON_OOYOROI_EITHER, pile: hand, upgraded: false}
  - set_energy: {amount: 3}
  - set_block: {who: player, amount: 0}
  - expect:
      player_block: {amount: 0}

  # The refused line, exactly as the seat wrote it: the Block mode, no target.
  - play: {card: "Thoma - Blazing Ooyoroi", mode: "Gain 3 Block, applying no element"}
  - select: {cards: ["Gain 3 Block, applying no element"]}
  - expect:
      player_block: {amount: 3}
