# EB-292: a Plan card played on the Bake-Kurage must not put a non-finite
# number into the scene.
#
# THE DEFECT THIS FILE IS THE ACCEPTANCE FOR. A blind seat played Kokomi on
# 0.2.2001+proto.dirty and the game reached a 41 GB working set and stopped
# answering the bridge. `godot.log` from that session says what happened, in
# two lines that repeat for ~900 lines and one that ends it:
#
#     ERROR: Offset is non-finite   at: sample_baked (scene/resources/curve.cpp)
#     ERROR: Condition "!std::isfinite(p_size.x) || !std::isfinite(p_size.y)"
#            is true.  at: set_size ... NCard.UpdateTypePlaqueSizeAndPosition()
#     System.OutOfMemoryException  at NCardTrail.CreatePoint / _Process
#
# and the FIRST of them lands in fight ONE, round one, within two card plays of
# the first card ever played on the jellyfish (`Player 1 playing card
# KLEEMOD-PROTO_KK_KURAGES_OATH (targeting Bake-Kurage (index 1))`, then a
# Water's Edge at the enemy, then the burst) -- four rounds before the morning
# drain the hang was first blamed on. So the subject is the PLAY, not the drain:
# the queue's turn-start resolution is exercised here as well, but the assertion
# that matters is the one right after the first play on the pet.
#
# WHY AN ASSERTION ON THE LOG, AND NOT ON THE BOARD. The wire cannot see this.
# A card node handed a non-finite size still reports a legal board, a legal
# hand and a legal queue; what breaks is the SCENE, and the engine prints it
# every frame until `NCardTrail` -- which interpolates its trail points at a
# fixed spacing along the distance the card moved -- is asked to fill an
# unbounded distance and takes the process's memory with it. The bridge answers
# normally right up to the moment it stops answering at all, which is exactly
# what the seat saw. `log_lacks` is the only instrument in the pack that can
# fail on the frame the defect appears rather than several minutes later.
#
# WHAT A PASS PROVES, EXACTLY: playing a Plan card on the pet, playing a second
# one on it in the same turn, ending the turn so the queue drains, and playing
# again on the turn after all leave `godot.log` free of a non-finite number,
# and the game still answers. It proves nothing about the Plan rule's numbers
# (`KokomiOverhaulRuleTests` owns those) and nothing about fun.
#
# AND WHAT IT DOES NOT PROVE, ON THE RECORD. This file PASSED on the unfixed
# build. Four attempts -- this line at Instant speed, the seat's line on the
# seat's own seed and encounter at Instant, the same at normal animation speed,
# and the same again at the seat's ~28 s pacing -- each produced a play sequence
# byte-identical to the recorded session's in `godot.log` and not one non-finite
# line. The trigger is environmental and was not reproduced, so this file is a
# REGRESSION watch on the arm's own play shape and not a reproduction of the
# hang. `NonFiniteCardGuardTests` is where the fix itself is asserted.

name: eb292-plan-on-pet-hang
character: KLEEMOD-KOKOMI
turns: 6

# Every card here lives on the QUARANTINED prototype surface, so the pack's
# name lint checks the prefix rather than a sheet row. See eb147's header.
prototype: true

notes: |
  Two Plan cards onto the Bake-Kurage in one turn, then the turn boundary that
  drains them, with the engine log read after each. The `log_lacks` steps are
  the subject; the power stacks around them are there so a failure can say
  whether the queue itself moved.

assumptions:
  - "The Bake-Kurage is on the field from the first turn of every Kokomi
     combat: `ProtoBakeKuragePower.Install` summons it from `BeforeCombatStart`
     (rule 1). If it is not there, the first `play ... on Bake-Kurage` fails
     with `no enemy 'Bake-Kurage'` -- which is a different defect and says so."
  - "`Bake-Kurage` resolves through `player.kokomi_plans.pet_entity_id`, the
     block `KokomiPlan.Snapshot` writes; it is NOT in `battle.enemies` and
     `find_enemy` cannot see it. `scenario.find_pet` is the reader, and it is
     the same field `blindplay._pet_target` aims at."
  - "The pending-Plans badge is a Counter power whose printed title is `Plan`
     (`PendingPlansPower.Localization`), so `power: {name: Plan}` reads the
     queue's length. A Counter at zero is REMOVED by the game rather than kept,
     which is what the `no_power` read after the drain is asserting."
  - "Energy is written to 5 first, so nothing in this file can be refused for
     EnergyCostTooHigh wearing the answer the scenario is looking for. Both
     Plan cards cost 1 and Coral Guard costs 1."
  - "`non-finite` is the substring both engine errors carry (`Offset is
     non-finite`, and Godot's `is_finite` condition prints `!std::isfinite`) --
     the first is the one that appears first in the recorded session, and it is
     what this file matches on. A build that printed neither and hung anyway
     would fail on the timeout instead, which is still a failure."
  - "The encounter is whatever the run seed deals, so no damage or HP number is
     asserted anywhere in this file. The fight has to survive one enemy turn
     for the last two steps to run; on a first-floor board at 80 max HP that is
     not in doubt, and a death would end the scenario as `no_progress` rather
     than as a false pass."
  - "`state_type` on a combat screen is the ROOM, not the word `combat`:
     `scenario.COMBAT_SCREENS` is (`monster`, `elite`, `boss`), and a first
     Monster node is `monster`. Asserting it is how this file says the fight
     is still up rather than that a reward screen has replaced it."
  - "12 s covers the turn boundary: the enemy side acts, block clears, energy
     resets, the hand is dealt and the two Plans are carried out, each with its
     own visuals. The runner's own 0.7 s settle is sized for one card play and
     is not enough here, which is what the `wait` verb exists for."

steps:
  # ---- a hand that is exactly what this file put in it --------------------
  - clear_hand: {}
  - give: {card: KLEEMOD-PROTO_KK_KURAGES_OATH, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_KK_BATTLE_PLAN, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_KK_CORAL_GUARD, pile: hand, upgraded: false}
  - set_energy: {amount: 5}

  # ---- the board opened clean, so a later hit is this file's own ----------
  - expect:
      log_lacks: {text: "non-finite"}
      can_play: {card: "Kurage's Oath", value: true}

  # ---- ONE Plan card on the jellyfish. THIS is the step that broke. -------
  - play: {card: "Kurage's Oath", target: "Bake-Kurage"}
  - wait: 2
  - expect:
      power: {who: player, name: "Plan", stacks: 1}
      log_lacks: {text: "non-finite"}

  # ---- and a second one in the same turn, which is what fight 2 did -------
  - play: {card: "Battle Plan", target: "Bake-Kurage"}
  - wait: 2
  - expect:
      power: {who: player, name: "Plan", stacks: 2}
      log_lacks: {text: "non-finite"}

  # ---- the morning: both Plans are carried out and the turn opens ---------
  - end_turn: {}
  - wait: 12
  - expect:
      state_type: {value: "monster"}
      no_power: {who: player, name: "Plan"}
      log_lacks: {text: "non-finite"}

  # ---- and the game still answers a card play, which is what hung --------
  - set_block: {who: player, amount: 0}
  - give: {card: KLEEMOD-PROTO_KK_CORAL_GUARD, pile: hand, upgraded: false}
  - play: {card: "Coral Guard (proto)"}
  - expect:
      player_block: {amount: 5}
      log_lacks: {text: "non-finite"}
