# EB-142 scenario: the Spark cost line is a PLAYABILITY GATE, not a silent fail.
#
# THE QUESTION. `docs/klee-cards.yaml:303` gives hold_the_line
# `{op: spend_spark, amount: 2}` at TOP LEVEL, and the sheet comment beside it
# states the structural rule: "a `spend_spark` inside a conditional branch is
# invisible to the playability gate, and the payoff would then fire unpaid."
# The C# half is `Cards/Generated/HoldTheLine.cs`:
#
#     protected override bool IsPlayable => SparkPower.CanSpend(Owner.Creature, 2);
#
# and `SparkPower.CanSpend`'s own docstring says what that buys: "a short bank
# shows as an unplayable card rather than as a play that quietly does nothing."
#
# THAT SENTENCE IS AN ASSERTION ABOUT THE WIRE, and this is the only instrument
# that can make it. tier0 can check its own `card_playable`; nothing in the repo
# can check that the SHIPPED card reports `can_play: false` to a player looking
# at it. The bridge serialises `card.CanPlay(out var reason)` straight onto the
# hand entry (`McpMod.StateBuilder.cs:1268-1277`), so the gate is readable.
#
# THE LADDER IS PLAYED, NOT SET. Sparks are a POWER (`Powers/SparkPower.cs`), not
# one of BaseLib's registered CustomResources, so `set_resource` cannot move
# them. Sparkly Treasure is cost 0 and `gain_spark 1`, which makes 0 -> 1 -> 2 a
# three-line ladder with no arithmetic in it.

name: spark-gate-refusal
character: KLEEMOD-KLEE
turns: 8

notes: |
  Hold the Line in hand at Sparks 0, 1 and 2. It must read unplayable at 0 and
  1, with the reason the game gives for an IsPlayable override, and playable at
  2 with no reason at all.

assumptions:
  - "`BlockedByCardLogic` is the UnplayableReason an `IsPlayable` override
     produces. The enum's members are None / HasUnplayableKeyword /
     BlockedByHook / BlockedByCardLogic / EnergyCostTooHigh / StarCostTooHigh /
     NoLivingAllies (read off sts2.dll); which of the two `BlockedBy*` arms the
     override maps to is the assumption, and a failure here prints the reason
     the game actually gave, which settles it."
  - "Energy is set to 5 first, so a refusal can never be EnergyCostTooHigh
     wearing the answer this scenario is looking for."
  - "The card is granted UNUPGRADED; the upgrade moves the Block (5->8, 6->9),
     never the price, so the gate is the same on both faces."
  - "A Counter power at 0 is REMOVED by the game rather than kept at zero.
     `SparkPower.Spend` goes through `PowerCmd.ModifyAmount(-2)`, and the last
     expect reads the removal; if the game keeps a 0-stack badge instead, this
     is the expect that says so."
  - "Klee starts the fight at 0 Sparks. If a relic or a starting card ever
     changes that, the first expect fails at the number it actually found."

steps:
  - give: {card: KLEEMOD-HOLD_THE_LINE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-SPARKLY_TREASURE, pile: hand, upgraded: false, count: 2}
  - set_energy: {amount: 5}

  # ---- Sparks 0: refused ---------------------------------------------------
  - expect:
      description_contains: {card: "Hold the Line", text: "Spend 2"}
      can_play: {card: "Hold the Line", value: false}
      unplayable_reason: {card: "Hold the Line", value: "BlockedByCardLogic"}

  # ---- Sparks 1: still refused, and this is the interesting one ------------
  - play: {card: "Sparkly Treasure"}
  - expect:
      power: {who: player, name: "Spark", stacks: 1}
      can_play: {card: "Hold the Line", value: false}
      unplayable_reason: {card: "Hold the Line", value: "BlockedByCardLogic"}

  # ---- Sparks 2: the price is met -----------------------------------------
  - play: {card: "Sparkly Treasure"}
  - expect:
      power: {who: player, name: "Spark", stacks: 2}
      can_play: {card: "Hold the Line", value: true}
      unplayable_reason: {card: "Hold the Line", value: null}

  # ---- and it really does spend, rather than reading playable and lying ----
  - set_block: {who: player, amount: 0}
  - play: {card: "Hold the Line"}
  - expect:
      no_power: {who: player, name: "Spark"}
