# THE FURINA STAGE'S PAGE ACCEPTANCE, live (the re-founding, 2026-10-04,
# review/active/furina-refounding-2026-10-03.md). The file keeps its name for
# the history in git; what it proves now is the re-founded rule from her side:
# Fanfare is ONE number on Furina, a card's Spend takes its price from it, a
# Spend she cannot pay is not offered, and the blind-play page prints the
# stage -- her Fanfare and this turn's flow, the seats front to back, each
# act, and the log in plain words -- with the shipped meters gone (`EB-735`,
# `EB-736`).
#
# WHAT IS STILL EYES-ON is the three bodies themselves and the strip: the
# `wait` steps are their capture windows, evidence of nothing on their own.
#
# THE BUILD THIS RUNS ON: the dev deploy with the Furina Stage arm on. With
# the arm off every assertion below is false by construction.
#
# NOTHING HERE IS QUOTABLE (R215 B): a prototype arm's arithmetic.

name: furina-stage-damage-order
character: KLEEMOD-FURINA
# The cards it names are `proto_fs_` rows on the quarantined surface, so the
# file declares itself a prototype scenario and is checked against that
# surface rather than against a shipped sheet (`EB-147`).
prototype: true
turns: 2
# PINNED, because this file asserts printed damage numbers and an act-1
# hallway is not one fight.
seed: YVKF7957EUFG

notes: |
  The re-founded Stage proved from Furina's side: Rising Applause gives her
  Fanfare, Curtain Rise's Spend 3 takes 3 of it for the bigger hit, and once
  she holds less than 3 the Spend mode is not offered. The PAGE: her Fanfare
  line, the seats front to back, the Usher's act line, the Spend line in the
  log, and the three retired meter lines gone (`EB-736`), with no Encore row
  and no shipped Fanfare buff on the board. Two frames held for the bodies
  and the strip.

assumptions:
  - "The build carries the Furina Stage arm. With it off there is no Salon
     Solitaire, no performer and no Spend."
  - "Salon Solitaire has opened the combat with the Gentilhomme Usher on
     stage (rule 1). This is the one board fact the file assumes rather than
     reads."
  - "Rising Applause gives 3 Fanfare (`proto_fs_standing_ovation`, unupgraded)
     and Curtain Rise's Spend 3 deals 17 (unupgraded). Nothing else in this
     fight gives her Fanfare, so she holds 3 after round one, 6 after round
     two's Rising Applause, and 0 after its two Spends."
  - "Chevalmarin and Crabaletta are summoned BY NAME rather than by Salon
     Debut, whose summon is random: the page checks below name them."
  - "Curtain Rise is a CHOOSE-ONE face: mode 0 deals 7 and mode 1 pays 3 of
     her Fanfare for 17, offered only when she holds at least 3. Both are run
     into the fattest body (`highest_hp`) so the deltas are the printed
     numbers before Vulnerable or a reaction moves them."
  - "The modes are answered BY LABEL, as every modal scenario is."
  - "A hand does not survive `end_turn`. Each round-two play is of its OWN
     copy, granted in the step above it."

steps:
  # ---------------------------------------------------------------- setup --
  - give: {card: KLEEMOD-PROTO_FS_STANDING_OVATION, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_FS_SURINTENDANTE_CHEVALMARIN, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_FS_MADEMOISELLE_CRABALETTA, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_FS_CURTAIN_RISE, pile: hand, upgraded: false}
  - set_energy: {amount: 5}

  # The face offers both modes: the printed face is the choice.
  - expect:
      can_play: {card: "Curtain Rise", value: true}
  - expect:
      description_contains: {card: "Curtain Rise", text: "3: deal"}

  # 3 Fanfare for Furina, then two summons behind the Usher. EYES-ON: three
  # bodies stand in a line beside her, front to back.
  - play: {card: "Rising Applause"}
  - play: {card: "Surintendante Chevalmarin"}
  - play: {card: "Mademoiselle Crabaletta"}
  - wait: {seconds: 30}

  # The performers act front to back at the end of her turn.
  - end_turn: {}

  # ------------------------------------------- the Spend, from her Fanfare -
  - set_energy: {amount: 5}
  - give: {card: KLEEMOD-PROTO_FS_STANDING_OVATION, pile: hand, upgraded: false}
  - play: {card: "Rising Applause"}
  - give: {card: KLEEMOD-PROTO_FS_CURTAIN_RISE, pile: hand, upgraded: false}
  - play: {card: "Curtain Rise", target: highest_hp}
  - expect:
      prompt_contains: "Choose"
  - select: {cards: ["Spend 3"]}
  - expect:
      enemy_hp_block_delta: {who: highest_hp, amount: -17}
  - give: {card: KLEEMOD-PROTO_FS_CURTAIN_RISE, pile: hand, upgraded: false}
  - play: {card: "Curtain Rise", target: highest_hp}
  - select: {cards: ["Spend 3"]}

  - read: {what: player}

  # ------------------------------------------------- THE PAGE, and `EB-735` -
  # Asserted by the performer and the words, never by value: the numbers move
  # with the hallway this seed rolls.
  - expect:
      page_contains: {text: "## Your stage"}
  - expect:
      page_contains: {text: "- Fanfare "}
  - expect:
      page_contains: {text: "Seats, front to back"}
  - expect:
      page_contains: {text: "**Usher**"}
  - expect:
      page_contains: {text: "**Chevalmarin**"}
  - expect:
      page_contains: {text: "You spent 3 Fanfare"}
  - expect:
      page_contains: {text: "**Usher** acted: Furina gains"}

  # ------------------------------------------------ THE HEADER, and `EB-736` -
  - expect:
      page_lacks: {text: "- Encore:"}
  - expect:
      page_lacks: {text: "- Fanfare:"}
  - expect:
      page_lacks: {text: "- Furina Burst:"}
  # ------------------------------------------- THE GLOSSARY, and `EB-744` ---
  - expect:
      page_lacks: {text: "**Encore**"}
  - expect:
      page_lacks: {text: "back performer"}
  # ------------------------------------------------ THE BUFF, and `EB-745` --
  - expect:
      page_lacks: {text: "nothing spends it"}

  - wait: {seconds: 20}

  # ------------------------------------------------ the short-Fanfare refusal
  # Two Spends took her to 0, short of 3, so the Spend mode is NOT OFFERED:
  # the chooser shows the base mode alone, and the card deals its 7.
  - give: {card: KLEEMOD-PROTO_FS_CURTAIN_RISE, pile: hand, upgraded: false}
  - play: {card: "Curtain Rise", target: highest_hp}
  - expect:
      prompt_contains: "Choose"
  - select: {cards: ["Deal 7 damage"]}
  - expect:
      enemy_hp_block_delta: {who: highest_hp, amount: -7}
  - wait: {seconds: 20}
