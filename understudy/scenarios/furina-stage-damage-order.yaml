# THE FURINA STAGE'S ACCEPTANCE, live. Four claims, and the file is explicit
# about which of them a machine checks and which are eyes-on, because the wire
# cannot see a pet at all.
#
# WHAT THE WIRE CARRIES AND WHAT IT DOES NOT -- REWRITTEN 2026-09-09 BY
# `EB-735`. The paragraph here used to say a performer's bar was not
# machine-assertable, and it was right at the time: `scenario.digest` read
# `player`, `hand`, `enemies` and `prompt`, and the only pet the harness could
# name was the Bake-Kurage through an arm-specific block a different kit wrote.
#
# Round one is why that changed. Three blind seats played some 550 actions
# without ever knowing who was on stage or what a bar held, because the page
# had no renderer for her performers. `EB-735` built one, off a `furina_stage`
# block the ledger now publishes, and gave this file two checks that read the
# PAGE -- `page_contains` and `page_lacks` -- so the surface the row is about
# is the surface a scenario asserts. The three bars in seat order and the bow
# line below are those checks.
#
# WHAT IS STILL EYES-ON is the strip and the three bodies THEMSELVES: whether
# the line re-flows after a departure, and whether the three read as three on
# screen, are questions about pixels and the `wait` steps are their capture
# windows. Those are evidence of nothing on their own, which is what
# `furina-full-stage-frame` learned the hard way.
#
# THE BUILD THIS RUNS ON: `deploy_proto.ps1` with `-p:FurinaStage=true` (the
# arm ships OFF, and with it off every assertion below is false by
# construction -- there is no relic, no stage and no Spend, and the three kit
# cards are not in the deck). A run on any other build is not this scenario.
#
# NOTHING HERE IS QUOTABLE (R215 B): a prototype arm's arithmetic.

name: furina-stage-damage-order
character: KLEEMOD-FURINA
# The cards it names are `proto_fs_` rows on the quarantined surface, so the
# file declares itself a prototype scenario and is checked against that
# surface rather than against a shipped sheet (`EB-147`).
prototype: true
turns: 2

notes: |
  The damage order proved from Furina's side of it: a fat lead and her Block
  answer a hallway intent whole, a Spend rider fires in full out of a lead that
  cannot pay it, and a bow lands its Block. `EB-735` adds the PAGE: three named
  bars in seat order and the bow line, asserted rather than eyeballed, with the
  three retired meter lines asserted gone (`EB-736`). Round two adds four more:
  Curtain Rise played BOTH WAYS from one board (`EB-746`), an act line that
  names its effect (`EB-743`), no Encore row in the glossary (`EB-744`) and no
  shipped Fanfare buff on the board (`EB-745`). Two frames held for the bodies
  themselves and the strip.

assumptions:
  - "The build carries `-p:PrototypeCards=true -p:FurinaStage=true`. With the
     arm off there is no Salon Solitaire, no performer and no Spend, and the
     three kit cards are not in her starter."
  - "Salon Solitaire has opened the combat with the Gentilhomme Usher in the
     front seat at FurinaStageLaw.OpeningFanfare = 3 (brief sec.3 rule 2).
     This is the one board fact the file assumes rather than reads, because
     the wire carries no pet."
  - "Rising Applause (`proto_fs_standing_ovation`, renamed under `EB-739`)
     raises FurinaStageLaw.RefillAmount = 5 on the BACK
     performer, which with one performer on stage is the lead (rule 5). So the
     lead stands at 8 for the enemy turn below."
  - "Energy is set to 5 so the three kit cards all play in one turn."
  - "The act-1 hallway intent this is run against puts at most 14 through: the
     lead's 8 plus the Block written below covers it whole. A bigger intent is
     not a failure of the rule, it is a different fight -- rerun on a hallway."
  - "Curtain Rise is a CHOOSE-ONE face since `EB-746`: mode 0 deals 7 and mode
     1 pays the lead 3 for 13. Both are run into a bare body, so the deltas
     below are the printed numbers before Vulnerable or a reaction moves
     them."
  - "The modes are answered BY LABEL, `deep-breath-modal-choice.yaml`'s rule:
     the generator emits each label into the option card's title and its
     description, so a label edit on the sheet is an edit to this file too. On
     an empty stage the Spend mode is NOT OFFERED at all (rule 8, as a choice),
     so a play there opens no screen -- which is why both plays below stand on
     an occupied stage."

steps:
  # ---------------------------------------------------------------- setup --
  - give: {card: KLEEMOD-PROTO_FS_STANDING_OVATION, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_FS_SALON_DEBUT, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_FS_SALON_DEBUT, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_FS_CURTAIN_RISE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-PROTO_FS_CURTAIN_RISE, pile: hand, upgraded: false}
  - set_energy: {amount: 5}

  # PREVIEW TRUTH, the half a machine can reach: with a performer on stage the
  # rider fires, so the card is playable and its printed number is the paid
  # one. The face itself is checked below by what it DELIVERS, which is the
  # only honest check of a preview -- `description_contains` would read the
  # template rather than the number a player sees.
  - expect:
      can_play: {card: "Curtain Rise", value: true}

  # `EB-746`: AND THE FACE OFFERS BOTH MODES. Spend is a CHOICE on play now --
  # four of six round-two seats said the card spent for them, "no verb to
  # decline" -- so the printed face is the choice and not a rider.
  - expect:
      description_contains: {card: "Curtain Rise", text: "Choose one"}

  # ------------------------------------------------- the reserve, and RULE 5
  # Raise 5 on the back performer. Alone on stage, the Usher IS the back, so
  # the lead stands at 3 + 5 = 8 for the enemy turn.
  - play: {card: "Rising Applause"}

  # ------------------------------------------------- three bars, and RULE 3 -
  # Two summons fill the middle and back seats at 1 each. EYES-ON: three
  # bodies stand in a line beside her, front to back, each with its own visible
  # HP bar, and the strip reads `Block > Usher 8 > her HP` with the two
  # newcomers behind it. Nothing below asserts this; the frame is the evidence.
  - play: {card: "Salon Début"}
  - play: {card: "Salon Début"}
  - wait: {seconds: 30}

  # ------------------------------------------- the damage order, and RULE 6 -
  # Block 6 in front of an 8-bar lead. The enemy's arrow still points at HER
  # -- the redirect is in her damage pipeline, not in its targeting (rule 6) --
  # and what lands is answered by the Block and then by the lead, in that
  # order, so her own bar does not move.
  #
  # MACHINE-CHECKED, and it is the whole rule from her side: with the arm OFF
  # this same board loses HP, because there is no second buffer.
  - set_block: {who: player, amount: 6}
  - end_turn: {}
  - expect:
      player_hp_delta: {amount: 0}

  # ------------------------------------------------ Spend in full, RULE 8/9 -
  # The lead came out of the enemy turn short -- it ate what the Block did not
  # -- and Curtain Rise asks it for 3 anyway. RULE 8's second clause: the rider
  # fires IN FULL whatever the lead can pay, the lead pays what it has, and it
  # leaves with a bow. So the enemy takes the full 13 and not a scaled-down
  # number, which is the assertion that would fail if the shortfall rule ever
  # came back.
  - set_energy: {amount: 5}
  - play: {card: "Curtain Rise", target: first}
  - expect:
      prompt_contains: "Choose"
  - select: {cards: ["Spend 3: deal 13 instead"]}
  - expect:
      enemy_hp_block_delta: {who: first, amount: -13}

  # THE BOW, machine-checked where it can be: the Usher's departure effect is
  # 4 Block to Furina (rule 9). It is asserted as a floor rather than an
  # equality because the turn's own Block is on the board too and the acts have
  # not fired yet -- what is being pinned is that a bow PAID, which is the
  # difference between rule 7's two departures.
  - read: {what: player}

  # ------------------------------------------------- THE PAGE, and `EB-735` -
  # The row's own acceptance, asserted rather than eyeballed: the blind-play
  # page prints the stage in DAMAGE ORDER, with three named bars in seat order
  # and a line for the bow that just happened.
  #
  # THE BARS ARE NOT ASSERTED BY VALUE and that is deliberate. What round one
  # could not see was WHO and WHERE, not how much; the numbers move with the
  # intent this hallway happened to roll, and a scenario pinning them would be
  # asserting the fight rather than the page. So each line is checked for the
  # performer and the seat word it stands under.
  - expect:
      page_contains: {text: "## Your stage"}
  - expect:
      page_contains: {text: "lead: Chevalmarin"}
  - expect:
      page_contains: {text: "back: Crabaletta"}
  - expect:
      page_contains: {text: "took a [gold]Bow[/gold]"}
  - expect:
      page_contains: {text: "**Usher** left the stage: emptied by a Spend"}

  # ------------------------------------------------ THE HEADER, and `EB-736` -
  # The three shipped meter lines the brief retires are gone from the header
  # while the arm is on. All three were on the page in round one, beside a
  # glossary calling Fanfare the bar -- one word, two resources, the shown one
  # dead.
  - expect:
      page_lacks: {text: "- Encore:"}
  - expect:
      page_lacks: {text: "- Fanfare:"}
  - expect:
      page_lacks: {text: "- Furina Burst:"}

  # ------------------------------------------- THE GLOSSARY, and `EB-744` ---
  # The Encore ROW is gone too, not only the meter line. Round two read a rule
  # for a meter the arm never grants, beside the bar of the same name; since
  # `EB-745` nothing can grant it, and a rule for a number that cannot move is
  # what the seats filed.
  - expect:
      page_lacks: {text: "**Encore**"}

  # ------------------------------------------------ THE BUFF, and `EB-745` --
  # And the shipped FanfarePower is not on the board at all. "Fanfare 30
  # (buff), generated by losing HP, nothing spends it" sat in every round-two
  # seat's status list; the sentence below is `FanfareMeterPower`'s own, so
  # its absence is the absence of the badge rather than of a word.
  - expect:
      page_lacks: {text: "nothing spends it"}

  # ------------------------------------------------- THE ACTS, and `EB-743` -
  # An act line NAMES ITS EFFECT. "It moved 3" covered 3 Block, 5 damage and a
  # Hydro aura alike, and two seats' Block arithmetic did not close for the
  # whole run. The Usher is the act asserted because its effect is the one the
  # sweep adds to a number the page also prints.
  - expect:
      page_contains: {text: "**Usher** performed: Furina gains"}
  - expect:
      page_contains: {text: "[gold]Block[/gold]."}

  - wait: {seconds: 20}

  # ---------------------------------------------- the empty-stage fallback --
  # EYES-ON and read from the strip: after the bow the middle performer has
  # stepped up, so the rider still has somebody to pay it. The claim the frame
  # settles is that the line RE-FLOWED -- the survivors closed the gap and the
  # new front bar is the one the strip names -- which is the placement pass
  # doing its job (`FurinaStagePlacement`).
  #
  # `EB-746`: AND THIS PLAY TAKES THE OTHER MODE, from the same board and the
  # same card, which is the row's own acceptance. The base mode deals 7 and
  # leaves every bar where it stood -- the verb to decline that round two's
  # seats could not find.
  - play: {card: "Curtain Rise", target: first}
  - expect:
      prompt_contains: "Choose"
  - select: {cards: ["Deal 7 damage"]}
  - expect:
      enemy_hp_block_delta: {who: first, amount: -7}
  - wait: {seconds: 20}
