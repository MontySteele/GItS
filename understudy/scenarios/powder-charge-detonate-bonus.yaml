# EB-142 scenario: powder_charge's detonate bonus reaches the bomb's damage.
#
# THE QUESTION. `docs/klee-cards.yaml:248` prints
# `{op: spend_spark, amount: 2}, {op: detonate, target: enemy, bonus: 4}`. The
# C# is `Cards/Generated/PowderCharge.cs`, which spends 2 and calls
# `BombPower.DetonateOn(ctx, target, DynamicVars["Bonus"].IntValue)`. The
# `bonus` is the number a sheet can print and a C# `DynamicVar` can hold without
# either of them ever reaching a creature's HP -- so this asserts the arithmetic
# where it lands: a Pop! bomb is 5 (`docs/klee-cards.yaml:14`, `bomb_damage: 5`),
# and detonating it with a +4 bonus has to move 9.
#
# THE SPARKS ARE EARNED, NOT SET, AND THAT IS NOT A CONVENIENCE. Sparks are a
# POWER (`Powers/SparkPower.cs`, a `PowerModel` with a badge), not one of
# BaseLib's registered CustomResources, so `set_resource` cannot move them --
# see the pack's README note. Two plays of Sparkly Treasure (cost 0,
# `gain_spark 1`) is the deterministic ladder to exactly 2, and playing the
# card that grants a meter is the route `gits/GitsDebugState.cs`'s header
# prescribes for anything it does not set.
#
# WHY POP! AND NOT A BOMB SET BY HAND. Placing a bomb is status application,
# which the debug door deliberately does not do. Pop! is a Basic 0-cost skill
# and placing a bomb is not a hit, so it detonates nothing on the way in --
# `probe_corpse.py` relies on the same fact.

name: powder-charge-detonate-bonus
character: KLEEMOD-KLEE
turns: 8

notes: |
  Bomb the enemy with Pop!, climb to exactly 2 Sparks, then Powder Charge it.
  5 (the bomb) + 4 (the bonus) = 9, asserted as an HP+Block delta.

assumptions:
  - "Exactly ONE bomb is on the target when Powder Charge resolves. DetonateOn
     walks every BombPower on the creature, so a second bomb would add its own
     damage and its own +4."
  - "The player has no Strength and the enemy no Vulnerable; the 9 is asserted
     raw. The enemy's Block is set to 0 first, so the HP+Block bracket and the
     plain HP delta agree."
  - "Both cards are granted UNUPGRADED. Upgraded, Powder Charge's bonus is 7
     (+3, docs/klee-upgrades.yaml) and Pop!'s bomb is 7 (+2)."
  - "A detonated bomb is CONSUMED, so the BombPower is gone from the target
     afterwards (`BombPower.Detonate`, a Counter). The last expect reads that."
  - "The turn does not roll over between the placement and the detonation: a
     bomb left standing detonates on its own schedule at the start of the
     player's turn, which probe_corpse.py's first live run learned the hard way."

steps:
  - give: {card: KLEEMOD-POP, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-POWDER_CHARGE, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-SPARKLY_TREASURE, pile: hand, upgraded: false, count: 2}
  - set_energy: {amount: 5}

  # ---- the bomb -----------------------------------------------------------
  - play: {card: "Pop!", target: first}
  - expect:
      power: {who: first, name: "Bomb", stacks: 1}

  # ---- the bank, climbed one Spark at a time -------------------------------
  - play: {card: "Sparkly Treasure"}
  - expect:
      power: {who: player, name: "Spark", stacks: 1}
      can_play: {card: "Powder Charge", value: false}
  - play: {card: "Sparkly Treasure"}
  - expect:
      power: {who: player, name: "Spark", stacks: 2}
      can_play: {card: "Powder Charge", value: true}

  # ---- the detonation ------------------------------------------------------
  - set_block: {who: first, amount: 0}
  - play: {card: "Powder Charge", target: first}
  - expect:
      enemy_hp_block_delta: {who: first, amount: -9}
      no_power: {who: first, name: "Bomb"}
