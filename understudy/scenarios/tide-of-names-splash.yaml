# EB-142 scenario: Tide of Names pays its cost-scaled damage to EVERY enemy.
#
# THE QUESTION. `docs/kokomi-cards.yaml:637` prints
# `{op: exhaust_from, amount: 1, select: chosen}` then
# `{op: damage, amount_formula: {base: 5, per: 2, count: exhaust_selection_cost},
#   target: all_enemies}`. The C# is
# `Cards/Kokomi/Generated/TheTideRemembers.cs`, whose `CalculatedDamageVar`
# carries `.WithMultiplier(card => ExhaustSelection.Cost(card))`.
#
# Two things can go wrong there and only one of them is visible to tier0: the
# LADDER (5 / 7 / 9 for costs 0 / 1 / 2) and the SPLASH. A card that computed
# the right number and delivered it to one enemy would pass every sheet lint in
# the repo. So the assertion is per-enemy and the check's denominator is the
# BEFORE state, which is the only way an enemy the hit killed still counts.
#
# THE COST-2 CARD IT EXHAUSTS IS A SECOND COPY OF ITSELF, which is not a trick:
# the card is cost 2, the selector is filtered to `KokomiResources.OwnCard`, and
# granting two copies means the file names one card instead of two and cannot
# drift when somebody reprices whatever else it would have named.
#
# WHY THE ID AND THE TITLE DISAGREE. The sheet id is `the_tide_remembers`; the
# printed title is "Tide of Names" (R211 kept the id and changed the name, the
# R69 pattern). The grant names the id, the play names the title, and
# `scenario.card_key` folds both onto one key anyway -- but writing each one the
# way the surface it is talking to spells it is how the file stays readable.

name: tide-of-names-splash
character: KLEEMOD-KOKOMI
turns: 8

notes: |
  Grant two copies, play one, exhaust the other (cost 2) at the select screen,
  and assert 5 + 2*2 = 9 against every living enemy.

assumptions:
  - "THE FIGHT HAS AT LEAST TWO ENEMIES. The encounter is generated and this
     file pins no seed, so a single-enemy first fight fails the check with
     `needed at least 2 living enemies` -- which is a re-run, not a defect.
     Pin a seed with `seed:` once one is known to roll a pair."
  - "No enemy carries a non-Hydro aura. The card is an IElementalCard applying
     Hydro, and a reaction on top of the hit would move the number."
  - "The player has no Strength and no enemy has Vulnerable; 9 is asserted raw
     as an HP+Block delta, so standing Block is folded in rather than assumed
     absent."
  - "The card is granted UNUPGRADED: upgraded, CalculationBase is 7 (+2) and the
     ladder becomes 7 / 9 / 11."

steps:
  - give: {card: KLEEMOD-THE_TIDE_REMEMBERS, pile: hand, upgraded: false, count: 2}
  - set_energy: {amount: 3}
  - expect:
      description_contains: {card: "Tide of Names", text: "ALL enemies"}

  # ---- the play opens the exhaust selection --------------------------------
  - play: {card: "Tide of Names"}
  - expect:
      state_type: "hand_select"
      prompt_contains: "Exhaust"

  # ---- choose the cost-2 card, which is the second copy --------------------
  - select: {cards: ["Tide of Names"]}
  - confirm: {}

  # ---- 5 + 2 per point of cost, to everything still standing ---------------
  - expect:
      each_enemy_hp_block_delta: {amount: -9, at_least: 2}
