# EB-150 scenario: Deep Breath's "choose one" screen opens, and BOTH modes
# resolve without the turn dying under them.
#
# THE QUESTION. `docs/furina-cards.yaml:707` prints
# `{op: choose_one, modes: [...]}` with two modes -- "Gain 1 Energy and 2
# Encore" and "Spend 3 Encore: draw 3". The C# is
# `Cards/Furina/Generated/DeepBreath.cs`, whose OnPlay awaits
# `ModalChoice.SelectMode`, which awaits
# `CardSelectCmd.FromChooseACardScreen`. [USER], 2026-08-26: "Deep Breath's
# 'choose one' mechanic doesn't work - softlocks the game".
#
# WHAT THE SOFT-LOCK WAS, AND WHY THIS FILE IS THE INSTRUMENT FOR IT. The
# option cards the helper fabricates were in NO CARD POOL, and
# `CardModel.Pool` (decompile, `MegaCrit.Sts2.Core.Models/CardModel.cs:297`)
# does not return null for that -- it falls through to
# `ModelDb.CardPool<MockCardPool>()`, whose `GenerateAllCards` calls
# `NeverEverCallThisOutsideOfTests_ClearOwner()` and throws
# `InvalidOperationException: You monster!`. That throw lands inside
# `NChooseACardSelectionScreen._Ready()` at the first `NCard.Create(card)`,
# which is BEFORE `_skipButton` and `_peekButton` are fetched; `NOverlayStack`
# then calls `AfterOverlayShown()`, which dereferences `_peekButton`, and the
# `NullReferenceException` in the playtest log is that. The awaited
# `TaskCompletionSource` never completes, the card play never returns, and the
# turn is gone. No sheet lint and no tier0 test can see any of that: it is a
# CARD-POOL MEMBERSHIP fact that only exists once a real screen tries to draw
# a real card node.
#
# WHY THE ASSERTIONS ARE ENCORE AND NOT ENERGY OR HAND SIZE. The harness
# asserts HP, Block, power stacks, resource amounts, prompts, `can_play`,
# `unplayable_reason` and printed text -- energy and hand size are not among
# them. Encore is a registered CustomResource (`KLEEMOD_ENCORE`,
# `Powers/FurinaResources.cs:137`), so `set_resource` writes it and `expect:
# resource` reads it, and BOTH modes move it: mode 0 by +2, mode 1 by -3.
# That makes one reading enough to say which mode actually resolved.
#
# WHY MODE 1 IS GIVEN A BANK OF 5 FIRST. `FurinaResources.SpendEncoreOrHp`
# takes the shortfall out of the player's HP rather than refusing, so a mode-1
# play on an empty bank would "succeed" while moving Encore by nothing and HP
# by 3 -- an assertion that could not tell a resolved mode from a skipped one.
# 5 -> 2 is a spend that can only have come from the mode.
#
# NO `confirm` STEP, UNLIKE `eb142-take-it-from-the-top.yaml`. A `card_select`
# of the "choose" type takes the pick immediately and the bridge REFUSES a
# confirm on it ("Choose-a-card screen requires no confirmation - use
# select_card(index) to pick directly"). The first RED run of this file carried
# one and failed on that refusal -- a true failure, but of the harness's shape
# rather than of the card, and a red that names the wrong thing is a red
# somebody will misread. Without it the failure lands where it belongs: on the
# Encore that did not move.
#
# THE LAST `state_type` IS THE SOFT-LOCK ASSERTION ITSELF. A hung card play
# leaves the run on a screen that never advances; asserting `monster` after
# each mode resolves is the reading that says the turn is still live.

name: deep-breath-modal-choice
character: KLEEMOD-FURINA
turns: 8

notes: |
  Two plays of Deep Breath in one turn, one per mode. Each opens the base
  game's choose-a-card screen, is answered by name, and is read back on
  Encore -- +2 for mode 0, -3 for mode 1 -- with combat still live after both.

assumptions:
  - "Deep Breath is granted UNUPGRADED. Upgraded it costs 0
     (docs/furina-upgrades.yaml, OnUpgrade: EnergyCost.UpgradeBy(-1)); the
     mode bodies are identical on both faces, so only the energy budget the
     scenario sets would change."
  - "The two modes print the labels the sheet prints, verbatim, because the
     generator emits the label into BOTH the option card's title and its
     description (gen_klee_cards.py's modal option emitter). `select` resolves
     by name against the screen's own card list, so a label edit on the sheet
     is a scenario edit too."
  - "Encore starts wherever the run left it, so both arms WRITE the bank
     before the play instead of assuming 0. The two writes are the only reason
     the +2 and the -3 are exact numbers rather than deltas off an unknown."
  - "No Fanfare assertion is made even though spending Encore prints Fanfare
     (FurinaResources.FanfarePerEncoreSpent = 1). Fanfare has other sources in
     a live fight and this file sets none of them to zero."
  - "3 energy covers both plays (cost 1 each) with room for the mode-0 gain;
     the energy is re-written before the second play so a first-play cost
     cannot starve the second."

steps:
  # ---- mode 0: gain 1 Energy and 2 Encore ---------------------------------
  - give: {card: KLEEMOD-DEEP_BREATH, pile: hand, upgraded: false, count: 2}
  - set_energy: {amount: 3}
  - set_resource: {name: KLEEMOD_ENCORE, amount: 0}
  - expect:
      description_contains: {card: "Deep Breath", text: "Choose one"}
  - play: {card: "Deep Breath"}
  - expect:
      prompt_contains: "Choose"
  - select: {cards: ["Gain 1 Energy and 2 Encore"]}
  - expect:
      resource: {name: KLEEMOD_ENCORE, amount: 2}
      state_type: "monster"

  # ---- mode 1: spend 3 Encore, draw 3 -------------------------------------
  - set_energy: {amount: 3}
  - set_resource: {name: KLEEMOD_ENCORE, amount: 5}
  - play: {card: "Deep Breath"}
  - expect:
      prompt_contains: "Choose"
  - select: {cards: ["Spend 3 Encore: draw 3"]}
  - expect:
      resource: {name: KLEEMOD_ENCORE, amount: 2}
      state_type: "monster"
