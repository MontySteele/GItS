# EB-184's OTHER half, and it is SEEN TO FAIL BY CONSTRUCTION.
#
# `eb184-modal-block-no-target.yaml` proves the repair let the targetless mode
# through. This file proves the repair did not simply switch aiming OFF: the
# same card, the same absent target, the DAMAGE mode named, must still be
# refused. A fix that made both modes targetless would pass the twin and be
# wrong, and nothing else in the pack would notice.
#
# **THIS SCENARIO IS EXPECTED TO FAIL, AND ITS FAILURE IS THE PASS.** The
# harness has no "expect a refusal" verb -- `_post` raises on a bridge error
# by design, because in every other file a refusal IS the defect -- so the
# evidence is the raised message, which must name the target requirement. A
# run that reports PASS here is the defect: it means the damage mode resolved
# with nothing to hit.
#
# Do not add it to any batch that grades scenarios by exit code.
#
# PRECONDITIONS: a dev build (`klee-mod\build\deploy_proto.ps1`).

name: eb184-modal-damage-needs-target
character: KLEEMOD-KLEE
turns: 6

prototype: true

notes: |
  The same prototype modal Attack, played with the DAMAGE mode named and no
  target. The bridge must refuse it.

assumptions:
  - "`KLEEMOD-PROTO_THOMA_CRIMSON_OOYOROI_EITHER` is the surface row's ModelDb
     entry. If the build is not a dev build the first step fails with the give
     endpoint's own 'no card matched', which is the quarantine working -- a
     DIFFERENT failure from the one this file is looking for, and the message
     is how they are told apart."
  - "Energy is written to 3 first, so the refusal cannot be
     EnergyCostTooHigh wearing the answer the scenario is looking for."
  - "The refusal is the bridge's, not the game's: `ExecutePlayCard` asks
     `GitsModalTargeting` whether the NAMED mode aims, and this one does."

steps:
  - give: {card: KLEEMOD-PROTO_THOMA_CRIMSON_OOYOROI_EITHER, pile: hand, upgraded: false}
  - set_energy: {amount: 3}

  # No `target`. The named mode aims, so this must be refused.
  - play: {card: "Thoma - Blazing Ooyoroi", mode: "Deal 8 damage, applying its element"}
  - expect:
      player_block: {amount: 0}
