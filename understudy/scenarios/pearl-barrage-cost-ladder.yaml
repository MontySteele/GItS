# EB-151 scenario: Pearl Barrage's damage climbs with the EXHAUSTED card's
# printed cost, on both rungs, in one turn.
#
# THE QUESTION. `docs/kokomi-cards.yaml:428-430` prints
# `{op: exhaust_from, amount: 1, select: chosen}` then
# `{op: damage, amount_formula: {base: 5, per: 3, count: exhaust_selection_cost},
#   target: enemy}` -- the ladder 5 / 8 / 11 for a victim costing 0 / 1 / 2.
# The C# is `Cards/Kokomi/Generated/PearlBarrage.cs:57-63`, whose
# `CalculatedDamageVar(ValueProp.Move).WithMultiplier(static (card, _) =>
# ExhaustSelection.Cost(card))` is read at HIT time by
# `AttackCommand.Execute` (decompile,
# MegaCrit.Sts2.Core.Commands.Builders/AttackCommand.cs:654), which is after
# the exhaust block above it has run and recorded.
#
# [USER], 2026-08-26: "what does Pearl Barrage even do? Seems to just do 5
# damage all the time." 5 is the card's BASE -- the number it lands at when
# the multiplier reads 0. Two different worlds produce that reading and this
# file is built to tell them apart, because they have opposite fixes:
#
#   (a) THE MULTIPLIER IS BROKEN. `ExhaustSelection` is scoped by
#       `ReferenceEquals(_scope, resolvingCard) && ReferenceEquals(_seat,
#       SeatOf(resolvingCard))` (`Powers/ExhaustSelection.cs:282-284`) and
#       every entry point swallows its exceptions into a `Log.Warn`
#       (`:115-141`), so a scope miss or a throw inside Open/Record is a
#       SILENT 0 rather than an error. Then this file fails and the fix is
#       code.
#   (b) THE MULTIPLIER IS FINE AND THE FODDER WAS FREE. `Cost` sums the
#       PRINTED cost (`:189-190`, `EnergyCost.Canonical`), and a live Kokomi
#       hand is full of cost-0 conscripted units. Exhausting one pays exactly
#       5, correctly, every time. Then this file PASSES on the deployed build
#       and the finding is a legibility/design one -- which is a QUEUE row,
#       not a patch.
#
# THE VICTIMS ARE NAMED FOR THEIR COST AND NOTHING ELSE. Coral Guard is a
# cost-1 Basic whose whole body is Block, and Gyorin Formation a cost-2 Rare
# whose whole body is Block: neither does anything from the hand, neither is
# a kit card (so both pass `KokomiResources.OwnCard`), and exhausting either
# moves no number this file reads.

name: pearl-barrage-cost-ladder
character: KLEEMOD-KOKOMI
turns: 8

notes: |
  Two plays of Pearl Barrage in one turn. The first exhausts a cost-1 card and
  must move 5 + 3*1 = 8; the second exhausts a cost-2 card and must move
  5 + 3*2 = 11. The gap between them IS the multiplier.

assumptions:
  - "Both Pearl Barrages are granted UNUPGRADED. Upgraded, CalculationBase is
     8 (+3, PearlBarrage.cs:99) and the ladder becomes 8 / 11 / 14."
  - "The victims are granted unupgraded too. `ExhaustSelection.Describe` reads
     `EnergyCost.Canonical` -- the PRINTED cost -- so an upgrade that changed
     a victim's cost would change the rung being asserted."
  - "The player has no Strength and the enemy no Vulnerable; 8 and 11 are
     asserted raw as HP+Block deltas, with the enemy's Block written to 0
     first so the bracket and the plain HP delta agree."
  - "No enemy carries a non-Hydro aura. Pearl Barrage is an IElementalCard
     applying Hydro and a reaction on top of the hit would move the number."
  - "The enemy survives the first hit. If 8 kills it the second play has no
     target and the step fails on that rather than on the multiplier -- a
     re-run, not a defect."
  - "3 energy covers both cost-1 plays, and it is re-written between them so a
     spent first play cannot starve the second."

steps:
  - give: {card: KLEEMOD-PEARL_BARRAGE, pile: hand, upgraded: false, count: 2}
  - give: {card: KLEEMOD-CORAL_GUARD, pile: hand, upgraded: false}
  - give: {card: KLEEMOD-GYORIN_FORMATION, pile: hand, upgraded: false}
  - set_energy: {amount: 3}
  - set_block: {who: first, amount: 0}
  - expect:
      description_contains: {card: "Pearl Barrage", text: "Exhaust"}

  # ---- rung 1: a cost-1 victim is worth 3 --------------------------------
  - play: {card: "Pearl Barrage", target: first}
  - expect:
      state_type: "hand_select"
      prompt_contains: "Exhaust"
  - select: {cards: ["Coral Guard"]}
  - confirm: {}
  - expect:
      enemy_hp_block_delta: {who: first, amount: -8}

  # ---- rung 2: a cost-2 victim is worth 6 --------------------------------
  - set_energy: {amount: 3}
  - set_block: {who: first, amount: 0}
  - play: {card: "Pearl Barrage", target: first}
  - expect:
      state_type: "hand_select"
  - select: {cards: ["Gyorin Formation"]}
  - confirm: {}
  - expect:
      enemy_hp_block_delta: {who: first, amount: -11}
