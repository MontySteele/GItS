# ADOPTED 2026-07-27 -- Serenitea Sweep II, track B1. All three jobs kept.
# The original ledger check retired with the ledgers (2026-08-06
# simplification), and the R-number / register lints that succeeded it
# retired in the 2026-09-23 process trim. The argument, and the recorded NOT-doing list -- no Windows runner, no pck
# build, no deploy automation, no coverage number, no scheduled runs -- live
# in docs/current/rationale/serenitea-g3-ci-proposal.md. Read that before
# adding a job here; each refusal is a decision, not an oversight.
#
# The consumer is the NEXT SESSION, not a hypothetical contributor: this is a
# pre-session guarantee that every session inherits a green world on the fresh
# clone it actually starts from. A GitHub runner IS that fresh clone -- no art,
# no game_ref/, no .venv -- which is the environment Track A had to reconstruct
# by hand, and which caught two defects in this sprint's own work.
#
# SPEED PASS 2026-08-29 ([USER]: "Github takes about 5 minutes to run those
# checks even if the PR is just altering markdown files. Is there a way to
# speed that up?"). Three changes, no new jobs and no renamed ones -- the
# three job names are load-bearing, they may be required checks in branch
# protection, and a renamed job blocks every pull request:
#   (1) `pytest` runs `-n auto --dist loadscope`, the exact arm
#       tools/hooks/push_gate.py runs locally. That comment used to say xdist
#       was "deliberately not in CI's install line"; [USER] overturned it.
#   (2) a docs-only pull request runs only the tests that READ markdown,
#       named one by one in the `pytest` job below, and says loudly which
#       suite it skipped. The classifier is tools/ci_changed_paths.py and it
#       FAILS SAFE: an empty or unavailable diff is `false`, the full run.
#   (3) `setup-python` caches pip against .github/requirements-ci.txt.
#
# NOT DONE, on purpose, and appended to the NOT-doing list at the top: no
# `paths-ignore` at the trigger level. A trigger-level filter makes the job
# report NOTHING rather than report success, and a required check that never
# reports blocks the pull request forever -- which is why the docs-only
# decision lives INSIDE a job that always runs and always reports. A
# `concurrency:` block (cancel superseded runs on the same branch) is a
# separate, optional change and is [USER]'s to ask for.

name: repo

on:
  pull_request:
  push:
    branches: [main]        # post-merge, because merge races are real here

permissions:
  contents: read

jobs:
  # (a) The Track A fresh-clone gate, made permanent.
  pytest:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the changed-path step below has both endpoints of
      # the diff. The suite itself still needs no history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/requirements-ci.txt
      # The install line moved to .github/requirements-ci.txt so the cache
      # above has a key. That file carries the loose-pin note it inherited:
      # a resolver surprise should look like a resolver surprise, not like a
      # repo failure.
      - run: pip install -r .github/requirements-ci.txt

      # Is this change nothing but markdown? tools/ci_changed_paths.py owns
      # the rule and its --self-test owns the cases. Every branch here that
      # cannot answer honestly prints an empty list and lets the tool's
      # empty-input case decide -- which is `false`, the full run.
      - id: scope
        name: changed paths -- docs-only?
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            if ! git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1; then
              base='origin/${{ github.event.pull_request.base.ref }}'
            fi
            changed=$(git diff --name-only "$base"...HEAD 2>/dev/null || true)
          else
            before='${{ github.event.before }}'
            case "$before" in
              ''|0000000000000000000000000000000000000000) changed='' ;;
              *) changed=$(git diff --name-only "$before" HEAD 2>/dev/null || true) ;;
            esac
          fi
          echo "--- changed paths ---"
          printf '%s\n' "$changed"
          echo "---------------------"
          printf '%s\n' "$changed" \
            | python tools/ci_changed_paths.py | tee -a "$GITHUB_OUTPUT"

      # NOTE the absence of GITS_REFERENCE_MODE: a runner has no game_ref/, so
      # the loader takes the committed-only path on its own. That is the point
      # -- this job asserts the COMMITTED world is sound. The auto-mode suite
      # is the deploy machine's job and stays there (validate.ps1 S7).
      #
      # `-n auto --dist loadscope` is the exact arm tools/hooks/push_gate.py
      # runs, minus its `-m "not battery"` deselection: CI keeps the bands.
      # loadscope is load-bearing, not a preference -- it keeps a module on
      # one worker so a module-scoped battery fixture is computed once rather
      # than once per worker. Measured on the 16-CPU dev box 2026-08-29 at
      # 917e07f: 4451 passed / 46 skipped / 12 xfailed either way, 59.2 s
      # parallel against 281.4 s serial. No test needed isolating, and no
      # `serial` marker was added.
      - name: full suite (parallel)
        if: steps.scope.outputs.docs_only != 'true'
        run: python -m pytest tier0/tests tier05/tests -q -n auto --dist loadscope

      # The docs-only arm: every module in tier0/tests + tier05/tests that
      # opens a committed .md file tools/ci_changed_paths.py classifies as a
      # doc (audited 2026-08-29, re-listed 2026-09-23 when the register and
      # ruling-index tests retired). What each one reads:
      #   test_staged_turn              docs/current/BACKLOG.md (face-defect ids)
      #   test_reaction_phase_parity    docs/current/operations/prototype.md
      #   test_prototype_surface        review/active/*.md
      #   test_prototype_authorship     review/qa/*/packet.md
      #   test_understudy_seat          review/qa/kokomi-first-turn-example/packet.md
      #   test_understudy_blindplay     docs/current/operations/understudy-seats.md
      #   test_eb157_baselib_pin        docs/current/STATE.md (the BaseLib pin)
      #   test_agent_rituals            docs/current/OPERATIONS.md, operations/*.md
      #   test_arm_keyword_tips, test_inazuma_companion_overhaul
      #                                 docs/current/text-conventions.md
      #   test_music_ledger_gate        docs/current/operations/media.md
      #   test_teyvat_ancients_codegen, test_teyvat_events_codegen
      #                                 docs/current/operations/codegen.md
      #   test_visual_qa_contract       docs/current/operations/act-assets.md
      #   test_eb495_kit_verb_triggers, test_lane_d_enemy_seam
      #                                 docs/current/atlas/*.md
      # Add a module here the moment a test starts reading one of those trees.
      # The `lints` job below still runs IN FULL on a docs-only change.
      - name: docs-only -- the markdown-reading tests only
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          echo "::notice title=docs-only fast path::Every changed path is markdown under docs/current, review/, or the repo root. SKIPPING the full tier0+tier05 suite; running only the markdown-reading tests, plus the FULL lints job. The push gate ran the whole fast lane locally before this push."
          python -m pytest -q \
            tier0/tests/test_staged_turn.py \
            tier0/tests/test_reaction_phase_parity.py \
            tier0/tests/test_prototype_surface.py \
            tier0/tests/test_prototype_authorship.py \
            tier0/tests/test_understudy_seat.py \
            tier0/tests/test_understudy_blindplay.py \
            tier0/tests/test_eb157_baselib_pin.py \
            tier0/tests/test_agent_rituals.py \
            tier0/tests/test_arm_keyword_tips.py \
            tier0/tests/test_inazuma_companion_overhaul.py \
            tier0/tests/test_music_ledger_gate.py \
            tier0/tests/test_teyvat_ancients_codegen.py \
            tier0/tests/test_teyvat_events_codegen.py \
            tier0/tests/test_visual_qa_contract.py \
            tier0/tests/test_eb495_kit_verb_triggers.py \
            tier0/tests/test_lane_d_enemy_seam.py

  # (b) The lints: exactly `run_lints --lane ci`, the same list the git
  # pre-push hook runs, so there is one source of truth for what CI checks
  # (tools/run_lints.py's REGISTRY). Every ci-lane lint must pass on this
  # fresh, shallow clone -- no game_ref/, no art, no game. Local-only lints
  # stay in run_lints's `local` lane and never run here.
  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/requirements-ci.txt
      # Same file as the other two jobs, so all three share one cache key.
      - run: pip install -r .github/requirements-ci.txt
      # Runs UNCONDITIONALLY, docs-only change or not.
      - name: run_lints --lane ci
        run: python tools/run_lints.py --lane ci
      # 2026-09-02. THE DEPLOY GATE'S SOURCE-ONLY RULES, HERE AT LAST.
      #
      # klee-mod/build/validate.ps1 holds rules that read committed text and
      # nothing else, and until today the only way to reach any of them was a
      # Windows machine with the game installed. On 2026-09-02 PR #291 put the
      # base game's `[blue]` numeral colour on every power face, this workflow
      # was green, it merged, and the round-six deploy was refused by S5 -- a
      # regex over C# this runner executes in four seconds. The wrapper was
      # what made it unreachable; it was never what made it correct, which is
      # the argument the header of this job already makes about the python
      # lints above.
      #
      # A STEP, NOT A JOB: the three job names are load-bearing (see the file
      # header), and this belongs to the question `lints` already asks.
      # S4/S5/S8 only. Everything needing the staged package, the game install,
      # the built pck or the pytest suite stays at deploy time --
      # klee-mod/build/static_rules.ps1 carries the table and the reason for
      # each. ONE implementation: validate.ps1 calls the same functions, so a
      # finding here is the string that would refuse the deploy.
      - name: deploy gate static rules (S4 pool, S5 loc syntax, S8 ascii)
        shell: pwsh
        run: ./klee-mod/build/validate_static.ps1

  # (c) Patch sentinel -- ADVISORY, NEVER BLOCKING (S12, 2026-08-05).
  #
  # Read docs/patch-sentinel.md before touching this job. The sentinel asks
  # whether the INSTALLED game still agrees with game_ref/. A GitHub runner has
  # neither -- no Steam install, no gitignored baselines -- so what runs here
  # is deliberately the smaller half: the diff core's own tests, plus the tool
  # invoked for real so that an import error or a broken CLI surfaces on the
  # fresh clone rather than on the one machine that can answer the question.
  #
  # The `skipped` line it prints here is the CORRECT output, not a degraded
  # one. The real comparison is a local `python tools/patch_sentinel.py` run on
  # a machine that owns the game, and its findings are alarms for a
  # [USER]-gated pass -- which is exactly why this job must never gate a merge:
  # an upstream balance patch is not a defect in the pull request that happens
  # to be open when it lands.
  patch-sentinel:
    runs-on: ubuntu-latest
    continue-on-error: true
  #
  # Skips its two STEPS on a docs-only change (2026-08-29): the sentinel reads
  # game assemblies and C# fixtures, and no markdown edit can move either. The
  # JOB still runs and still reports, because a job that reports nothing is
  # the failure mode `paths-ignore` would have caused.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/requirements-ci.txt
      - run: pip install -r .github/requirements-ci.txt
      # The same classifier the `pytest` job runs, duplicated rather than
      # passed between jobs on purpose: a `needs:` edge would serialise this
      # job behind `pytest` and cost far more wall clock than the few seconds
      # the duplication saves. It fails safe the same way.
      - id: scope
        name: changed paths -- docs-only?
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            if ! git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1; then
              base='origin/${{ github.event.pull_request.base.ref }}'
            fi
            changed=$(git diff --name-only "$base"...HEAD 2>/dev/null || true)
          else
            before='${{ github.event.before }}'
            case "$before" in
              ''|0000000000000000000000000000000000000000) changed='' ;;
              *) changed=$(git diff --name-only "$before" HEAD 2>/dev/null || true) ;;
            esac
          fi
          printf '%s\n' "$changed" \
            | python tools/ci_changed_paths.py | tee -a "$GITHUB_OUTPUT"
      - name: sentinel diff core (synthetic fixtures only)
        if: steps.scope.outputs.docs_only != 'true'
        run: python -m pytest tier0/tests/test_patch_sentinel.py -q
      - name: sentinel runs (asserts nothing -- no game on a runner)
        if: steps.scope.outputs.docs_only != 'true'
        run: python tools/patch_sentinel.py || true
