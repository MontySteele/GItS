# ADOPTED 2026-07-27 -- Serenitea Sweep II, track B1. All three jobs kept.
# The original ledger check retired with the ledgers (2026-08-06
# simplification); its successor is the R-number namespace lint below. The
# argument, and the recorded NOT-doing list -- no Windows runner, no pck
# build, no deploy automation, no coverage number, no scheduled runs -- live
# in docs/current/rationale/serenitea-g3-ci-proposal.md. Read that before
# adding a job here; each refusal is a decision, not an oversight.
#
# The consumer is the NEXT SESSION, not a hypothetical contributor: this is a
# pre-session guarantee that every session inherits a green world on the fresh
# clone it actually starts from. A GitHub runner IS that fresh clone -- no art,
# no game_ref/, no .venv -- which is the environment Track A had to reconstruct
# by hand, and which caught two defects in this sprint's own work.

name: repo

on:
  pull_request:
  push:
    branches: [main]        # post-merge, because merge races are real here

permissions:
  contents: read

jobs:
  # (a) The Track A fresh-clone gate, made permanent.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No requirements file in-tree; these are the suite's actual imports.
      # Pinned loosely on purpose -- a resolver surprise here should look like
      # a resolver surprise, not like a repo failure.
      - run: pip install pytest pyyaml pillow numpy
      # NOTE the absence of GITS_REFERENCE_MODE: a runner has no game_ref/, so
      # the loader takes the committed-only path on its own. That is the point
      # -- this job asserts the COMMITTED world is sound. The auto-mode suite
      # is the deploy machine's job and stays there (validate.ps1 S7).
      - run: python -m pytest tier0/tests tier05/tests -q

  # (b) The softlock-preventing lints, invoked DIRECTLY.
  #
  # These live behind validate.ps1 today, which makes them Windows-only -- and
  # the population that pushes most will never run a Windows lint. The wrapper
  # is what makes them unreachable; it is not what makes them correct.
  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pillow numpy
      - name: hand-written parity
        run: python tools/lint_handwritten_parity.py
      - name: constant parity
        run: python tools/lint_constant_parity.py
      # EB-89 (2026-08-25). The half the line above structurally cannot see:
      # constant parity compares constants to constants and never reads the
      # PROSE a player is shown, so a repricing could leave a tooltip quoting
      # a retired number with every gate green. Pinned by
      # tier0/tests/test_eb89_prose_constants.py.
      - name: prose constants
        run: python tools/lint_prose_constants.py
      # Sim-hygiene sprint 2026-07-29. The sibling of the line above, pointed
      # at the sim's own internal correspondence instead of the C# mirrors:
      # an engine op with no offer-time price is a card the drafter cannot
      # see, silently. Also wired into pytest (test_sheet_lints).
      - name: op parity
        run: python tools/lint_op_parity.py
      # EB-71 (2026-08-12). The codegen guard for the unified Sly grammar:
      # `Card.sly` is the one field and the base-game keyword rides it as the
      # reserved `{op: sly_autoplay}` rider, so a sheet or generator that
      # revives `sly_keyword` / `sly_this_turn` must fail loudly rather than
      # generate a class that silently means something else. Pinned by
      # tier0/tests/test_eb71_cs_parity.py; wired here beside the other
      # parity lints because that is where a codegen guard belongs.
      - name: sly grammar
        run: python tools/lint_sly_grammar.py
      # ALREADY THE GATE Y-8 ASKED FOR (verified 2026-08-06, Track Y). The
      # second sitting's Y-8 asked that `gen_roster_cards.py --check` become
      # "CI job 4" so that the class "sheet changed, generated C# didn't" fails
      # loudly. It has run here, in the blocking `lints` job, since the
      # sim-hygiene sprint -- so the reply's outcome was already in force and
      # this workflow gained no new job. Deliberately NOT duplicated as a
      # separate job: two invocations of one check would double the failure
      # noise and halve the trust, and the recorded NOT-doing list at the head
      # of this file exists precisely so job additions stay decisions rather
      # than reflexes.
      #
      # Exercised for real the same day: Y-4 deleted an upgrade delta from
      # docs/furina-upgrades.yaml, this check went red on the stale generated
      # card and manifest, and stayed red until the generator was re-run.
      - name: codegen staleness
        run: python tools/gen_roster_cards.py --check
      - name: pool membership
        run: python tools/lint_pool_membership.py
      - name: ancient coverage
        run: python tools/lint_ancient_coverage.py
      # Axis-Validity Track A, 2026-08-04. Both run on a fresh clone by
      # construction: the floors are a committed percentages-only file and the
      # tags are a committed review file, so neither needs game_ref/. The
      # coverage gate runs in --gate mode against the pinned debt list while
      # P1's binding null is open -- see the retired sprint log, §0 and §5:
      # git show pre-simplification-2026-08-06:docs/archive/sprint-axis-validity-track-a-log-2026-08-04.md
      - name: role/tempo review artifacts current
        run: python tools/suggest_role_tempo_tags.py --check
      - name: role/tempo coverage (floors only, against the debt list)
        run: python tools/lint_role_tempo_coverage.py --gate
      - name: roster registry
        run: python tools/lint_roster_registry.py
      # Successor to the ledger check (retired 2026-08-06 with the ledgers).
      # The R/D namespace is frozen at tag pre-simplification-2026-08-06; this
      # guards docs/current against citing unissued numbers or re-declaring
      # frozen ones. Runs from committed state only -- no tags needed.
      - name: R-number namespace
        run: python tools/lint_r_numbers.py
      # EB-127. The other half of the same namespace question: r-numbers
      # guards R/D, this guards the ROW ids -- no two rows in QUEUE.md or
      # BACKLOG.md may define the same id, no id may define a row in both, and
      # no number at or below its series' frozen ceiling may be re-minted once
      # its row has closed. Two collisions reached review in two weeks
      # (EB-119/EB-120, and M38 minted twice off one base) and neither was
      # caught by anything mechanical. Citations are out of scope AS
      # DEFINITIONS by design. The retired-id half reads committed constants
      # rather than git history, for the reason r-numbers does the same: this
      # checkout is depth-1 with no tags.
      - name: register row-id uniqueness
        run: python tools/lint_register_ids.py
      # EB-109. An enchanted id (`x@sharp-2`) became reachable at RUNTEMPLATE
      # 10, and the upgrade suffix rides INSIDE the decoration, so every
      # `<id> + upgrades.SUFFIX` site silently changed meaning without being
      # edited. This holds the reachability answer beside each site and fails
      # on a new site nobody has answered for.
      - name: upgrade-suffix append sites
        run: python tools/lint_upgrade_suffix_appends.py
      # Understudy 2026-08-04. vendor/ carries third-party source pinned to an
      # exact upstream commit; this asserts the tree still is what the
      # provenance note says it is, in both directions. Cheap, and the one
      # failure it prevents (running a pre-v0.107 bridge against a v0.107.1
      # game) is invisible until the game is already booting.
      - name: vendor pin
        run: python tools/lint_vendor_pin.py
      # art_coverage runs WITHOUT --strict: ImageGen/ is gitignored Tier F and
      # absent here, so the bill is empty by construction. It is present to
      # prove the tool still runs, not to assert coverage -- asserting coverage
      # on a tree with no art is the vacuum this sprint spent Track A on.
      - name: art coverage (runs; asserts nothing about art)
        run: python tools/art_coverage.py

  # (c) Patch sentinel -- ADVISORY, NEVER BLOCKING (S12, 2026-08-05).
  #
  # Read docs/patch-sentinel.md before touching this job. The sentinel asks
  # whether the INSTALLED game still agrees with game_ref/. A GitHub runner has
  # neither -- no Steam install, no gitignored baselines -- so what runs here
  # is deliberately the smaller half: the diff core's own tests, plus the tool
  # invoked for real so that an import error or a broken CLI surfaces on the
  # fresh clone rather than on the one machine that can answer the question.
  #
  # The `skipped` line it prints here is the CORRECT output, not a degraded
  # one. The real comparison is a local `python tools/patch_sentinel.py` run on
  # a machine that owns the game, and its findings are alarms for a
  # [USER]-gated pass -- which is exactly why this job must never gate a merge:
  # an upstream balance patch is not a defect in the pull request that happens
  # to be open when it lands.
  patch-sentinel:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml
      - name: sentinel diff core (synthetic fixtures only)
        run: python -m pytest tier0/tests/test_patch_sentinel.py -q
      - name: sentinel runs (asserts nothing -- no game on a runner)
        run: python tools/patch_sentinel.py || true
